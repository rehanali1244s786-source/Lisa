            boolean launch(Intent i) {
              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
              try {
                startActivity(i);
                if (Build.VERSION.SDK_INT >= 29 && !Settings.canDrawOverlays(this) && !hinted) {
                  hinted = true;
                  log("LISA", "Tip: allow “Display over other apps” in LISA settings so I can open apps while in background.");
                }
                return true;
              } catch (Exception e) { return false; }
            }

            String openApp(String name) {
              String q = name.toLowerCase(Locale.ROOT).trim();
              for (String[] a : ALIAS) if (q.contains(a[0])) q = q.replace(a[0], a[1]);
              q = q.trim();
              if (q.isEmpty()) return null;
              PackageManager pm = getPackageManager();
              ResolveInfo best = null;
              int bs = 0;
              for (ResolveInfo r : pm.queryIntentActivities(new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), 0)) {
                String lb = r.loadLabel(pm).toString().toLowerCase(Locale.ROOT);
                int s = lb.equals(q) ? 4 : lb.startsWith(q) ? 3 : lb.contains(q) ? 2 : (q.length() > 3 && r.activityInfo.packageName.contains(q.replace(" ", ""))) ? 1 : 0;
                if (s > bs) { bs = s; best = r; }
              }
              if (best == null) return null;
              Intent li = pm.getLaunchIntentForPackage(best.activityInfo.packageName);
              return (li != null && launch(li)) ? best.loadLabel(pm).toString() : null;
            }

            boolean youtubeSearch(String q) {
              Intent i = new Intent(Intent.ACTION_SEARCH).setPackage("com.google.android.youtube").putExtra("query", q);
              if (launch(i)) return true;
              return web("https://www.youtube.com/results?search_query=" + enc(q));
            }

            boolean playSong(String q) {
              for (String pk : new String[]{"com.google.android.apps.youtube.music", "com.google.android.youtube", "com.spotify.music"}) {
                if (getPackageManager().getLaunchIntentForPackage(pk) == null) continue;
                Intent i = new Intent("android.media.action.MEDIA_PLAY_FROM_SEARCH").setPackage(pk).putExtra(SearchManager.QUERY, q).putExtra("android.intent.extra.focus", "vnd.android.cursor.item/*");
                if (launch(i)) return true;
              }
              return youtubeSearch(q);
            }


          #start.on{background:linear-gradient(135deg,var(--c),#b0003a);color:#fff;box-shadow:0 0 22px #ff2d9566}
          #start:active,.mini:active,.btn:active{transform:scale(.95)}
          main{flex:1;position:relative;overflow:hidden}
          .pg{display:none;position:absolute;inset:0;overflow:auto;padding:0 14px 16px}
          .pg.show{display:block;animation:in .3s ease-out}
          @keyframes in{from{opacity:0;transform:translateY(12px)}}
          .card{background:rgba(255,255,255,.06);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:10px 0}
          h3{margin:0 0 8px;font-size:13px;letter-spacing:1.5px;color:var(--a);text-transform:uppercase}
          small{opacity:.65}
          nav{display:flex;background:#0b1030f2;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
          nav button{flex:1;background:none;border:0;color:#8896c9;padding:9px 0 7px;font-size:11px}
          nav button b{display:block;font-size:20px;font-weight:400}
          nav button.on{color:var(--a)}
          #plog{height:46vh;overflow:auto}
          .orb{width:140px;height:140px;margin:6px auto 4px;position:relative;filter:grayscale(.8) opacity(.65);transition:.4s}
          .live .orb{filter:none}
          .orb i{position:absolute;inset:0;border-radius:50%;border:2px dashed var(--a);animation:rg 7s linear infinite}
          .orb i:nth-child(2){inset:12px;border-color:var(--b);animation-duration:10s;animation-direction:reverse}
          .orb i:nth-child(3){inset:24px;border-color:var(--c);animation-duration:5s}
          .orb b{position:absolute;inset:44px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,var(--a) 45%,var(--b));box-shadow:0 0 34px var(--a);animation:pl 2.4s ease-in-out infinite}
          .live .orb b{animation-duration:.8s;background:radial-gradient(circle at 30% 30%,#fff,var(--c) 45%,var(--b));box-shadow:0 0 40px var(--c)}
          @keyframes rg{to{transform:rotate(360deg)}}@keyframes pl{50%{transform:scale(1.25)}}
          #state{text-align:center;font-weight:600}
          #hint{display:none;text-align:center;font-size:12px;color:#7dffb0;margin:4px 0 0}
          #log{max-height:32vh;overflow:auto}
          .msg{margin:6px 0;padding:9px 12px;border-radius:14px;background:#141b5a;max-width:90%;white-space:pre-wrap}
          .msg.y{margin-left:auto;background:#3a1fa8}
          .row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:8px 0}
          .row>div{flex:1}
          input,select,textarea{width:100%;background:#0c1233;border:1px solid #2b3a8c;border-radius:12px;color:#fff;padding:11px;font:14px system-ui;margin:4px 0}
          .btn{border:0;color:#fff;font-weight:700;padding:11px 16px;border-radius:12px;background:linear-gradient(135deg,var(--b),#3a1fa8)}
          .btn:disabled{opacity:.5}
          .mini{border:1px solid var(--bd);background:#12195c;color:#fff;border-radius:10px;padding:8px 12px;font-size:12px}
          .mini.ok{color:#7dffb0;border-color:#2c7a52}
          pre{margin:6px 0 0;white-space:pre-wrap;font:12px system-ui;color:#b9c6ff}
          .cmd b{color:var(--a)}.cmd p{margin:6px 0}
          #toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--a);color:#012;padding:8px 16px;border-radius:20px;font-weight:700;opacity:0;transition:.3s;z-index:9}
          #toast.s{opacity:1}
          </style></head><body>
          <div id="bg"></div>
          <div id="app">
          <header><div class="brand">LISA</div><button id="start" onclick="tog()">▶ START</button></header>
          <main>
          <section class="pg show" id="p_home">
           <div class="orb"><i></i><i></i><i></i><b></b></div>
           <div id="state">Tap START — LISA keeps listening in background</div>
           <div id="hint">Running in background. You can swipe the app away and just say “Hey Lisa”.</div>
           <button class="btn" onclick="Native.vision()" style="width:100%;margin:8px 0 0">📷 What is this? (camera)</button>
           <div class="card"><div id="log"></div><div class="row"><input id="txt" placeholder="Or type a command…" onkeydown="if(event.key=='Enter')send()"><button class="btn" onclick="send()">Send</button></div></div>
          </section>
          <section class="pg" id="p_cmd">
           <div class="card cmd"><h3>Apps</h3><p><b>“Hey Lisa, open WhatsApp”</b></p><p><b>“यूट्यूब खोलो”</b></p></div>
           <div class="card cmd"><h3>Search</h3><p><b>“Google search cricket score”</b></p><p><b>“YouTube search Arijit Singh”</b></p><p><b>“गूगल पर दिल्ली का मौसम सर्च करो”</b></p></div>
           <div class="card cmd"><h3>Music</h3><p><b>“Play Kesariya”</b> · <b>“गाना चलाओ तुम ही हो”</b></p><p><b>“pause”</b> · <b>“next”</b> · <b>“previous”</b> · <b>“अगला गाना”</b></p></div>
           <div class="card cmd"><h3>Phone</h3><p><b>“Call mummy”</b> · <b>“मम्मी को कॉल करो”</b></p><p><b>“torch on / off”</b> · <b>“volume up / down”</b> · <b>“battery”</b></p></div>
           <div class="card cmd"><h3>Utilities</h3><p><b>“timer 5 minutes”</b> · <b>“alarm 7:30 am”</b></p><p><b>“weather in Delhi”</b> · <b>“what's the time”</b></p></div>
           <div class="card cmd"><h3>Vision</h3><p><b>“Hey Lisa, what is this”</b> · <b>“ye kya hai”</b> · <b>“यह क्या है”</b></p><p>Opens your camera. Take the photo and LISA tells you what it is.</p></div>
           <div class="card cmd"><h3>Chat</h3><p>Ask anything. LISA answers in the language you speak.</p><p><b>“stop listening”</b> / <b>“लिसा बंद”</b> turns her off.</p></div>
          </section>
          <section class="pg" id="p_priv">
           <div class="card" id="pl_lock"><h3>Private chat</h3><small>Enter the code to open.</small>
            <input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="Code" onkeydown="if(event.key=='Enter')pinGo()"><button class="btn" onclick="pinGo()">Unlock</button></div>
           <div id="pl_chat" style="display:none">
            <div class="card"><div class="row"><div><select id="plang"><option value="hinglish">Hinglish</option><option value="en">English</option><option value="hindi">Hindi</option><option value="urdu">Roman Urdu</option></select></div><button class="mini" onclick="pinLock()">Lock</button></div>
             <div id="plog"></div>
             <div class="row"><input id="ptxt" placeholder="Message Lisa…" onkeydown="if(event.key=='Enter')psend()"><button class="btn" onclick="psend()">Send</button></div></div>
           </div>
          </section>
          <section class="pg" id="p_set">
           <div class="card"><h3>API key</h3><input id="key" type="password" placeholder="Paste Groq (gsk_…) or Gemini (AIza…) key"><button class="btn" onclick="saveKey()">Save &amp; auto-connect</button>
            <div id="conn" style="margin-top:8px"></div>
            <button class="btn" id="test" onclick="Native.test();poll()" style="margin-top:6px">Test connection</button><pre id="det"></pre></div>
           <div class="card"><h3>Voice</h3>Listening language<select id="lang" onchange="Native.setCfg('lang',this.value)"><option value="hi-IN">Hindi + English (Hinglish)</option><option value="en-US">English (US)</option><option value="en-IN">English (India)</option><option value="ur-PK">Urdu</option><option value="pa-IN">Punjabi</option><option value="bn-IN">Bengali</option><option value="ta-IN">Tamil</option><option value="te-IN">Telugu</option><option value="mr-IN">Marathi</option><option value="gu-IN">Gujarati</option><option value="ar-SA">Arabic</option></select>
            Speech speed<select id="rate" onchange="Native.setCfg('rate',this.value)"><option>0.8</option><option>1.0</option><option>1.2</option><option>1.4</option></select>
            Personality<textarea id="persona" rows="4" onchange="Native.setCfg('persona',this.value)"></textarea></div>
           <div class="card"><h3>Permissions</h3><div id="perms"></div></div>
          </section>
          </main>
          <nav><button class="on" data-p="home" onclick="go('home')"><b>🏠</b>Home</button><button data-p="cmd" onclick="go('cmd')"><b>🎙</b>Commands</button><button data-p="priv" onclick="go('priv')"><b>🔒</b>Private</button><button data-p="set" onclick="go('set')"><b>⚙️</b>Settings</button></nav>
          </div>
          <div id="toast"></div>
          <script>
          const $=i=>document.getElementById(i);let run=false,last='';
          const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
          const P=[['mic','Microphone','Needed to hear you'],['ovl','Display over other apps','Lets LISA open apps and YouTube from background'],['bat','Battery unrestricted','Keeps LISA alive in background'],['ct','Contacts','For “call mummy”'],['call','Phone calls','Call without touching the phone']];
          $('perms').innerHTML=P.map(p=>'<div class="row"><div><b>'+p[1]+'</b><br><small>'+p[2]+'</small></div><button class="mini" id="pm_'+p[0]+'" onclick="Native.perm(\''+p[0]+'\')">Allow</button></div>').join('');
          function toast(t){const e=$('toast');e.textContent=t;e.className='s';setTimeout(()=>e.className='',1600)}
          function go(p){if(p!='priv'&&popen)pinLock();document.querySelectorAll('.pg').forEach(e=>e.classList.toggle('show',e.id=='p_'+p));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.p==p));if(p=='set')loadCfg()}
          function tog(){run?Native.stop():Native.start();setTimeout(poll,700)}
          function send(){const v=$('txt').value.trim();if(!v)return;if(Native.cmd(v))$('txt').value='';else toast('Press START first')}
          function loadCfg(){let c;try{c=JSON.parse(Native.cfg())}catch(e){return}
           $('lang').value=c.lang;$('rate').value=c.rate;$('persona').value=c.persona;
           const rows=[['groq','Groq',c.gk,c.mg],['gemini','Gemini',c.mk,c.mm]].filter(x=>x[2]).map(x=>'<div class="row"><div><b>'+x[1]+'</b> <small>'+esc(x[2])+'</small><br><small>'+(x[3]?'Models: '+esc(x[3].split(',').join(' › ')):'Not tested yet')+'</small></div><button class="mini" onclick="Native.removeKey(\''+x[0]+'\');loadCfg()">Remove</button></div>');
           $('conn').innerHTML=rows.join('')||'<small>No key saved yet.</small>'}
          function saveKey(){const v=$('key').value.trim();if(!v)return;const r=Native.saveKey(v);if(r.indexOf('ok')==0){$('key').value='';setTimeout(loadCfg,300);toast('Saved. Finding a working model…')}else toast(r);poll()}
          function poll(){let s;try{s=JSON.parse(Native.status())}catch(e){return}
           run=s.run;const b=$('start');b.textContent=run?'■ STOP':'▶ START';b.classList.toggle('on',run);document.body.classList.toggle('live',run);
           $('state').textContent=run?s.state:'Tap START — LISA keeps listening in background';
           $('hint').style.display=run?'block':'none';
           const L=(s.log||[]).join('\n');
           if(L!==last){last=L;$('log').innerHTML=s.log.map(x=>{const y=x.indexOf('You: ')==0;return '<div class="msg'+(y?' y':'')+'">'+esc(x.slice(y?5:6))+'</div>'}).join('');$('log').scrollTop=1e9}
           P.forEach(p=>{const e=$('pm_'+p[0]);const ok=s[p[0]];e.textContent=ok?'✓ On':'Allow';e.classList.toggle('ok',!!ok)});
           $('det').textContent=s.det||'';$('test').disabled=!!s.busy;$('test').textContent=s.busy?'Testing…':'Test connection'}
          setInterval(poll,1000);poll();
          let plast='',popen=false;
          function pinGo(){const v=$('pin').value;$('pin').value='';if(Native.privUnlock(v)){showPriv(true)}else toast('Wrong code')}
          function pinLock(){Native.privLock();showPriv(false)}
          function showPriv(o){popen=o;$('pl_lock').style.display=o?'none':'block';$('pl_chat').style.display=o?'block':'none';if(!o){$('plog').innerHTML='';plast=''}}
          function psend(){const v=$('ptxt').value.trim();if(!v)return;if(Native.privSend(v,$('plang').value))$('ptxt').value='';else toast('Wait for the reply')}
          function ppoll(){let s;try{s=JSON.parse(Native.privStatus())}catch(e){return}
           if(popen&&!s.open){showPriv(false);return}
           if(!popen)return;
           const L=(s.log||[]).join('\n')+(s.busy?'|b':'');
           if(L!==plast){plast=L;$('plog').innerHTML=(s.log||[]).map(x=>{const y=x.indexOf('You: ')==0;return '<div class="msg'+(y?' y':'')+'">'+esc(x.slice(y?5:6))+'</div>'}).join('')+(s.busy?'<div class="msg">…</div>':'');$('plog').scrollTop=1e9}}
          setInterval(ppoll,800);
          </script></body></html>
          LISA_EOF
          cat > LISA/icons.py <<'LISA_EOF'
          import zlib, struct, math, os
          def png(path, n):
              c = (n - 1) / 2
              raw = bytearray()
              for y in range(n):
                  raw.append(0)
                  for x in range(n):
                      r = math.hypot(x - c, y - c) / c
                      t = (x + y) / (2 * n)
                      R, G, B = int(20 + 50 * t), int(24 + 8 * t), int(80 + 70 * t)
                      if r < 0.5:
                          k = r / 0.5
                          R, G, B = int(255 * (1 - k)), int(255 - 26 * k), 255
                      elif 0.66 < r < 0.78:
                          R, G, B = 255, 45, 149
                      elif 0.84 < r < 0.90:
                          R, G, B = 124, 77, 255
                      raw += bytes((R, G, B, 255))
              def ch(t, d):
                  b = t + d
                  return struct.pack('>I', len(d)) + b + struct.pack('>I', zlib.crc32(b) & 0xffffffff)
              data = b'\x89PNG\r\n\x1a\n' + ch(b'IHDR', struct.pack('>IIBBBBB', n, n, 8, 6, 0, 0, 0)) + ch(b'IDAT', zlib.compress(bytes(raw), 9)) + ch(b'IEND', b'')
              os.makedirs(os.path.dirname(path), exist_ok=True)
              open(path, 'wb').write(data)
          for d, n in (('mdpi', 48), ('hdpi', 72), ('xhdpi', 96), ('xxhdpi', 144), ('xxxhdpi', 192)):
              png('res/mipmap-%s/ic_launcher.png' % d, n)
          LISA_EOF
          (cd LISA && python3 icons.py)
      - name: Build APK
        env:
          KS_PASS: ${{ secrets.LISA_KS_PASS || 'lisa1234' }}
        run: |
          set -e
          WS="$GITHUB_WORKSPACE"
          cd LISA
          BT="$ANDROID_HOME/build-tools/34.0.0"
          JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          rm -rf build && mkdir -p build/obj

          "$BT/aapt2" compile --dir res -o build/res.zip
          "$BT/aapt2" link -o build/base.apk -I "$JAR" \
            --manifest AndroidManifest.xml -R build/res.zip -A assets \
            --min-sdk-version 24 --target-sdk-version 28 \
            --version-code ${{ github.run_number }} --version-name 2.0

          javac -nowarn -source 8 -target 8 -Xlint:-options -classpath "$JAR" -d build/obj \
            $(find src -name '*.java')

          "$BT/d8" --lib "$JAR" --min-api 24 --output build \
            $(find build/obj -name '*.class')
          (cd build && zip -q base.apk classes.dex)

          "$BT/zipalign" -f -p 4 build/base.apk build/aligned.apk

          if [ ! -f "$WS/lisa.keystore" ]; then
            keytool -genkeypair -keystore "$WS/lisa.keystore" -alias lisa \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Abdul Rehman"
          fi
          "$BT/apksigner" sign --ks "$WS/lisa.keystore" \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" \
            --out LISA.apk build/aligned.apk
          "$BT/apksigner" verify LISA.apk

          mkdir -p "$WS/out"
          cp LISA.apk "$WS/out/LISA.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LISA-apk
          path: out/LISA.apk
          if-no-files-found: error

                String b64 = Base64.encodeToString(jpg, Base64.NO_WRAP);
                SharedPreferences sp = app.getSharedPreferences("lisa", 0);
                String sys = sp.getString("persona", LisaService.DEF_PERSONA) + Ai.RULES + VISION_RULES;
                reply(Ai.vision(sp, sys, q, b64));
              } catch (Exception e) {
                LisaService.log("LISA", "Vision error: " + e.getMessage());

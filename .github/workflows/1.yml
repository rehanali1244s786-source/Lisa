            static final Pattern VISION = Pattern.compile("^(?:(?:please|pls|zara|जरा|ज़रा) )?(?:" + VA + "|" + VB + "|" + VC + ")(?: please| batao| bata do| bata de| बताओ| बता दो| बताइए| जी)?$");
            void handle(String raw) {
              try {
                String l = norm(raw);
                Matcher m;
                if (has(l, "stop listening|stop lisa|goodbye|good bye|bye bye|shut down|लिसा बंद|सुनना बंद|अलविदा|बाय बाय|band ho ja|बंद हो जा")) {
                  say(T("Okay, going to sleep. Bye!", "ठीक है, मैं बंद हो रही हूँ। अलविदा!"), false);
                  h.postDelayed(new Runnable() { public void run() { shutdown(); } }, 3500);
                  return;
                }
                if (VISION.matcher(l).matches()) {
                  say(T("Opening the camera. Point it at the thing and take a photo.", "कैमरा खोल रही हूँ। चीज़ दिखाकर फोटो ले लीजिए।"), false);
                  if (!launch(new Intent(this, CameraActivity.class).putExtra("q", raw))) say(T("I could not open the camera.", "कैमरा नहीं खुल पाया।"), true);
                  return;
                }
                if (has(l, "torch|flash ?light|टॉर्च|टार्च|टोर्च|फ्लैश ?लाइट")) {
                  boolean off = has(l, "\\boff\\b|\\bband\\b|बंद|ऑफ|बन्द");
                  torch(!off);
                  say(off ? T("Torch off", "टॉर्च बंद कर दी") : T("Torch on", "टॉर्च चालू कर दी"), true);
                  return;
                }
                if (has(l, "battery|बैटरी|baitri")) {
                  Intent b = registerReceiver(null, new IntentFilter(Intent.ACTION_BATTERY_CHANGED));
                  int p = b.getIntExtra("level", 0) * 100 / Math.max(1, b.getIntExtra("scale", 100));
                  say(T("Battery is " + p + " percent", "बैटरी " + p + " प्रतिशत है"), true);
                  return;
                }
                if (has(l, "volume|वॉल्यूम|वोल्यूम|आवाज|awaz")) {
                  boolean up = has(l, "\\bup\\b|increase|louder|badha|बढ़ा|बढा|ज्यादा|ज़्यादा|तेज");
                  AudioManager am = (AudioManager) getSystemService(AUDIO_SERVICE);
                  for (int i = 0; i < 3; i++) am.adjustStreamVolume(AudioManager.STREAM_MUSIC, up ? AudioManager.ADJUST_RAISE : AudioManager.ADJUST_LOWER, i == 2 ? AudioManager.FLAG_SHOW_UI : 0);
                  say(up ? T("Volume up", "आवाज़ बढ़ा दी") : T("Volume down", "आवाज़ कम कर दी"), true);
                  return;
                }
                int key = 0;
                if (l.matches("(pause|pause music|pause song|pause karo|stop music|stop song|रुको|रोको|रोक दो|गाना रोको|गाना बंद करो|गाना बंद कर दो|म्यूजिक बंद करो|रुक जाओ)")) key = KeyEvent.KEYCODE_MEDIA_PAUSE;
                else if (l.matches("(resume|resume music|continue|play|play music|play song|गाना चलाओ|गाना चालू करो|चालू करो|फिर से चलाओ|गाना चला दो)")) key = KeyEvent.KEYCODE_MEDIA_PLAY;
                else if (l.matches("(next|next song|skip|अगला|अगला गाना|नेक्स्ट|स्किप|आगे)")) key = KeyEvent.KEYCODE_MEDIA_NEXT;
                else if (l.matches("(previous|previous song|back|पिछला|पिछला गाना|प्रीवियस)")) key = KeyEvent.KEYCODE_MEDIA_PREVIOUS;
                if (key != 0) { media(key); say(T("Done", "हो गया"), true); return; }

                if (has(l, "\\btimer\\b|टाइमर")) {
                  int sec = 0;
                  boolean any = false;
                  m = Pattern.compile("(\\d+)\\s*(hours?|hrs?|घंटे|घंटा|घण्टे|minutes?|mins?|मिनट|seconds?|secs?|सेकंड|सेकेंड|सेकण्ड)").matcher(l);
                  while (m.find()) {
                    any = true;
                    int n = Integer.parseInt(m.group(1));
                    String u = m.group(2);
                    if (u.startsWith("h") || u.startsWith("घ")) sec += n * 3600;
                    else if (u.startsWith("m") || u.startsWith("म")) sec += n * 60;
                    else sec += n;
                  }
                  if (!any) {
                    m = Pattern.compile("(\\d+)").matcher(l);
                    if (m.find()) { sec = Integer.parseInt(m.group(1)) * 60; any = true; }
                  }
                  if (!any || sec <= 0 || sec > 86400) { say(T("How long? For example, timer 5 minutes.", "कितनी देर का टाइमर लगाना है? जैसे 5 मिनट का टाइमर।"), true); return; }
                  launch(new Intent(AlarmClock.ACTION_SET_TIMER).putExtra(AlarmClock.EXTRA_LENGTH, sec).putExtra(AlarmClock.EXTRA_SKIP_UI, true));
                  say(T("Timer is set", "टाइमर सेट कर दिया"), true);
                  return;
                }
                if (has(l, "\\balarm\\b|अलार्म")) {
                  m = Pattern.compile("(\\d{1,2})(?:[:.](\\d{2}))?").matcher(l);
                  if (!m.find()) { say(T("What time? For example, alarm at 7:30 am.", "किस समय का अलार्म लगाऊँ? जैसे सुबह 7:30 बजे।"), true); return; }
                  int hr = Integer.parseInt(m.group(1)), mi = m.group(2) == null ? 0 : Integer.parseInt(m.group(2));
                  boolean pm = has(l, "\\bp\\.?m\\b|शाम|रात|दोपहर|evening|night|afternoon"), am = has(l, "\\ba\\.?m\\b|सुबह|morning");
                  if (pm && hr < 12) hr += 12;
                  if (am && hr == 12) hr = 0;
                  if (hr > 23 || mi > 59) { say(T("I did not get a valid time.", "मुझे सही समय समझ नहीं आया।"), true); return; }
                  launch(new Intent(AlarmClock.ACTION_SET_ALARM).putExtra(AlarmClock.EXTRA_HOUR, hr).putExtra(AlarmClock.EXTRA_MINUTES, mi).putExtra(AlarmClock.EXTRA_SKIP_UI, true));
                  say(T("Alarm set for ", "अलार्म सेट कर दिया ") + String.format(Locale.ENGLISH, "%02d:%02d", hr, mi), true);
                  return;
                }
                if (has(l, "what.?s the time|what time|current time|कितने बजे|कितना बजा|टाइम क्या|समय क्या|kitne baje|time kya")) {
                  Calendar c = Calendar.getInstance();
                  int hh = c.get(Calendar.HOUR) == 0 ? 12 : c.get(Calendar.HOUR), mm = c.get(Calendar.MINUTE);
                  say(curHi ? "अभी " + hh + " बजकर " + mm + " मिनट हुए हैं" : "It's " + new SimpleDateFormat("h:mm a", Locale.ENGLISH).format(new Date()), true);

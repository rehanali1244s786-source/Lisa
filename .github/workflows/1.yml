            static final int RC = 77;
            static final String VISION_RULES = " The user just took a photo with the phone camera and is asking about it. Look at the photo and answer the question directly: say what the main object or scene is and add one useful detail. If short text in the photo matters, read it out. If the photo is blurry or too dark, say so and ask them to retake it. Do not identify real people from their faces.";
            boolean started;
            String question = "What is this?";

            static String T(String en, String hi) {
              LisaService s = LisaService.inst;
              return s != null && s.curHi ? hi : en;
            }

            static void reply(String t) {
              LisaService s = LisaService.inst;
              if (s != null && LisaService.running) s.say(t, true);
              else LisaService.log("LISA", t);
            }

            protected void onCreate(Bundle b) {
              super.onCreate(b);
              String q = getIntent().getStringExtra("q");
              if (q != null && !q.trim().isEmpty()) question = q.trim();
              else LisaService.log("You", "📷 What is this?");
              if (b != null) started = b.getBoolean("started");
              if (started) return;
              started = true;
              new File(getCacheDir(), CamProvider.NAME).delete();
              Uri u = Uri.parse("content://" + CamProvider.AUTH + "/" + CamProvider.NAME);
              Intent i = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
              i.putExtra(MediaStore.EXTRA_OUTPUT, u);
              i.setClipData(ClipData.newRawUri("photo", u));
              i.addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION | Intent.FLAG_GRANT_READ_URI_PERMISSION);
              try {
                startActivityForResult(i, RC);
              } catch (Exception e) {
                reply(T("I could not find a camera app.", "कैमरा ऐप नहीं मिला।"));
                finish();
              }
            }

            protected void onSaveInstanceState(Bundle o) {
              super.onSaveInstanceState(o);
              o.putBoolean("started", started);
            }

            protected void onActivityResult(int rc, int res, Intent data) {
              super.onActivityResult(rc, res, data);
              if (rc != RC) return;
              if (res != RESULT_OK) {
                reply(T("Okay, cancelled.", "ठीक है, रद्द कर दिया।"));
                finish();
                return;
              }
              LisaService.state = "Looking at the photo…";
              Bitmap th = null;
              if (data != null && data.getExtras() != null) {
                Object o = data.getExtras().get("data");
                if (o instanceof Bitmap) th = (Bitmap) o;
              }
              final Context app = getApplicationContext();
              final File f = new File(getCacheDir(), CamProvider.NAME);
              final Bitmap thumb = th;
              final String q = question;
              new Thread(new Runnable() { public void run() { analyze(app, f, thumb, q); } }).start();
              finish();
            }

            static void analyze(Context app, File f, Bitmap thumb, String q) {

            String queryContact(String key) {
              key = key.trim();
              if (key.isEmpty()) return "";
              Cursor c = null;
              try {
                c = getContentResolver().query(ContactsContract.CommonDataKinds.Phone.CONTENT_URI, new String[]{ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME, ContactsContract.CommonDataKinds.Phone.NUMBER}, ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " LIKE ?", new String[]{"%" + key + "%"}, null);
                if (c == null) return "";
                String best = "";
                int n = 0;
                while (c.moveToNext() && n++ < 50) {
                  String dn = c.getString(0), num = c.getString(1);
                  if (dn == null || num == null) continue;
                  if (dn.equalsIgnoreCase(key)) return dn + "|" + num;
                  if (best.isEmpty()) best = dn + "|" + num;
                }
                return best;
              } catch (Exception e) {
                return "";
              } finally {
                if (c != null) c.close();
              }
            }


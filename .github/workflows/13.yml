            static boolean brightness(LisaService s, String l) {
              if (!Settings.System.canWrite(s)) {
                s.launch(new Intent(Settings.ACTION_MANAGE_WRITE_SETTINGS, Uri.parse("package:" + s.getPackageName())));
                s.say(s.T("Please allow LISA to modify system settings, then ask again.", "कृपया LISA को सिस्टम सेटिंग्स बदलने की अनुमति दीजिए, फिर दोबारा बोलिए।"), false);
                return true;
              }
              ContentResolver cr = s.getContentResolver();
              if (LisaService.has(l, "\\bauto(matic)?\\b|ऑटो|ऑटोमैटिक")) {
                Settings.System.putInt(cr, Settings.System.SCREEN_BRIGHTNESS_MODE, Settings.System.SCREEN_BRIGHTNESS_MODE_AUTOMATIC);
                s.say(s.T("Automatic brightness on", "ऑटो ब्राइटनेस चालू कर दी"), true);
                return true;
              }
              int cur = 128;
              try { cur = Settings.System.getInt(cr, Settings.System.SCREEN_BRIGHTNESS); } catch (Exception e) {}
              int v;
              Matcher m = Pattern.compile("(\\d{1,3})").matcher(l);
              if (m.find()) v = Math.min(100, Integer.parseInt(m.group(1))) * 255 / 100;
              else if (LisaService.has(l, MAXW)) v = 255;
              else if (LisaService.has(l, MINW)) v = 10;
              else if (LisaService.has(l, LOWW)) v = 40;
              else if (LisaService.has(l, UPW)) v = cur + 64;
              else if (LisaService.has(l, DOWNW)) v = cur - 64;
              else {
                s.say(s.T("How bright? Say full, low, up, down, or a percent.", "कितनी ब्राइटनेस? फुल, लो, ऊपर, नीचे या प्रतिशत बोलिए।"), true);
                return true;
              }
              v = Math.max(1, Math.min(255, v));
              Settings.System.putInt(cr, Settings.System.SCREEN_BRIGHTNESS_MODE, Settings.System.SCREEN_BRIGHTNESS_MODE_MANUAL);
              Settings.System.putInt(cr, Settings.System.SCREEN_BRIGHTNESS, v);
              int pc = v * 100 / 255;
              s.say(s.T("Brightness " + pc + " percent", "ब्राइटनेस " + pc + " प्रतिशत कर दी"), true);
              return true;
            }

            static boolean dnd(LisaService s, String l) {
              boolean off = LisaService.has(l, OFF), on = LisaService.has(l, ON);
              if (on == off) {
                s.say(s.T("Should I turn Do Not Disturb on or off?", "डू नॉट डिस्टर्ब चालू करूँ या बंद?"), true);
                return true;
              }
              NotificationManager nm = (NotificationManager) s.getSystemService(Context.NOTIFICATION_SERVICE);
              if (nm == null || !nm.isNotificationPolicyAccessGranted()) {
                s.launch(new Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS));
                s.say(s.T("Please allow LISA under Do Not Disturb access, then ask again.", "कृपया डू नॉट डिस्टर्ब एक्सेस में LISA को अनुमति दीजिए, फिर दोबारा बोलिए।"), false);
                return true;
              }
              nm.setInterruptionFilter(on ? NotificationManager.INTERRUPTION_FILTER_PRIORITY : NotificationManager.INTERRUPTION_FILTER_ALL);
              s.say(on ? s.T("Do Not Disturb on", "डू नॉट डिस्टर्ब चालू कर दिया") : s.T("Do Not Disturb off", "डू नॉट डिस्टर्ब बंद कर दिया"), true);
              return true;
            }

            static boolean speed(LisaService s, boolean faster) {
              float cur = Vox.num(s.sp, "rate", 1f);
              int bi = 0;
              for (int i = 1; i < RATES.length; i++) if (Math.abs(RATES[i] - cur) < Math.abs(RATES[bi] - cur)) bi = i;
              int ni = Math.max(0, Math.min(RATES.length - 1, bi + (faster ? 1 : -1)));
              s.sp.edit().putString("rate", String.valueOf(RATES[ni])).apply();
              if (ni == bi) s.say(faster ? s.T("This is already my fastest speed.", "यह मेरी सबसे तेज़ रफ़्तार है।") : s.T("This is already my slowest speed.", "यह मेरी सबसे धीमी रफ़्तार है।"), true);
              else s.say(faster ? s.T("Okay, speaking faster.", "ठीक है, अब तेज़ बोलूँगी।") : s.T("Okay, speaking slower.", "ठीक है, अब धीरे बोलूँगी।"), true);
              return true;
            }

            static boolean lang(LisaService s, String l) {
              String code, en, hi;
              if (LisaService.has(l, "hinglish|hindi|हिंदी|हिन्दी|हिंग्लिश")) { code = "hi-IN"; en = "Hindi and English"; hi = "हिंदी और अंग्रेज़ी"; }
              else if (LisaService.has(l, "english|angrezi|अंग्रेज़ी|अंग्रेजी|इंग्लिश")) { code = "en-US"; en = "English"; hi = "अंग्रेज़ी"; }
              else if (LisaService.has(l, "urdu|उर्दू")) { code = "ur-PK"; en = "Urdu"; hi = "उर्दू"; }
              else if (LisaService.has(l, "punjabi|पंजाबी")) { code = "pa-IN"; en = "Punjabi"; hi = "पंजाबी"; }
              else return false;
              s.sp.edit().putString("lang", code).apply();
              s.say(s.T("Okay, I will listen in " + en + ".", "ठीक है, अब मैं " + hi + " में सुनूँगी।"), true);
              return true;
            }
            static boolean shot(LisaService s) {
              LisaAccess a = LisaAccess.inst;
              if (a == null) {
                s.say(s.T("Please turn on LISA in Accessibility settings so I can take screenshots.", "स्क्रीनशॉट लेने के लिए सेटिंग्स में LISA की Accessibility चालू कीजिए।"), true);
                return true;
              }
              if (Build.VERSION.SDK_INT < 28) {
                s.say(s.T("Screenshots by voice need Android 9 or newer.", "वॉइस से स्क्रीनशॉट के लिए Android 9 या नया चाहिए।"), true);
                return true;
              }
              LisaAccess.sleep(400);
              boolean ok = a.screenshot();
              s.say(ok ? s.T("Screenshot taken", "स्क्रीनशॉट ले लिया") : s.T("I could not take a screenshot.", "स्क्रीनशॉट नहीं ले पाई।"), true);
              return true;
            }

            static boolean isRead(String l) {
              if (l.trim().split("\\s+").length > 10) return false;
              return LisaService.has(l, "screen|स्क्रीन") && LisaService.has(l, READW) && !LisaService.has(l, NOTREAD);
            }

            static boolean read(LisaService s) {
              LisaAccess a = LisaAccess.inst;
              if (a == null) {
                s.say(s.T("Please turn on LISA in Accessibility settings so I can read the screen.", "स्क्रीन पढ़ने के लिए सेटिंग्स में LISA की Accessibility चालू कीजिए।"), true);
                return true;
              }
              String t = a.readScreen();
              if (t.isEmpty()) {
                s.say(s.T("I could not find any text on this screen.", "इस स्क्रीन पर मुझे कोई टेक्स्ट नहीं मिला।"), true);
                return true;
              }
              if (t.length() > 420) {
                try {
                  String sum = Ai.ask(s.sp, "You are reading a phone screen aloud for the user. Summarize the screen text below in at most 3 short sentences, in the same language as the text. Output only the summary.", new ArrayList<String[]>(), t).trim();
                  if (!sum.isEmpty()) t = sum;
                } catch (Exception e) {}
              }
              if (t.length() > 420) t = t.substring(0, 420);
              s.say(t, true);
              return true;
            }
          }

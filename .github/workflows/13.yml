          package com.abdulrehman.lisa;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.content.Intent;
          import android.graphics.Path;
          import android.graphics.Rect;
          import android.os.Build;
          import android.os.Bundle;
          import android.util.DisplayMetrics;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;
          import java.util.concurrent.CountDownLatch;
          import java.util.concurrent.TimeUnit;

          /* Lets LISA read the screen and tap/type/swipe in other apps. Every method here blocks,
             so call them from a worker thread, never from the main thread. */
          public class LisaAccess extends AccessibilityService {
            static volatile LisaAccess inst;

            @Override protected void onServiceConnected() {
              super.onServiceConnected();
              inst = this;
              Ovl.show(this);
            }

            @Override public void onAccessibilityEvent(AccessibilityEvent e) {}

            @Override public void onInterrupt() {}

            @Override public boolean onUnbind(Intent i) {
              inst = null;
              return super.onUnbind(i);
            }

            @Override public void onDestroy() {
              inst = null;
              super.onDestroy();
            }

            static void sleep(long ms) {
              try { Thread.sleep(ms); } catch (InterruptedException e) { Thread.currentThread().interrupt(); }
            }

            static String low(CharSequence c) { return c == null ? "" : c.toString().toLowerCase(Locale.ROOT).trim(); }

            AccessibilityNodeInfo root() {
              try { return getRootInActiveWindow(); } catch (Exception e) { return null; }
            }

            String fg() {
              AccessibilityNodeInfo r = root();
              CharSequence p = r == null ? null : r.getPackageName();
              return p == null ? "" : p.toString();
            }

            boolean waitFg(String pkg, long ms) {
              long end = System.currentTimeMillis() + ms;
              while (System.currentTimeMillis() < end) {
                if (pkg.equals(fg())) return true;
                sleep(150);
              }
              return pkg.equals(fg());
            }

            void walk(AccessibilityNodeInfo n, List<AccessibilityNodeInfo> out, int depth) {
              if (n == null || out.size() >= 1500 || depth > 40) return;
              if (n.isVisibleToUser()) out.add(n);
              int c = n.getChildCount();
              for (int i = 0; i < c; i++) walk(n.getChild(i), out, depth + 1);
            }

            List<AccessibilityNodeInfo> all() {
              List<AccessibilityNodeInfo> out = new ArrayList<AccessibilityNodeInfo>();
              AccessibilityNodeInfo r = root();
              if (r != null) walk(r, out, 0);
              return out;
            }

            /* labels must be lower case. Exact matches win over "contains" matches. */
            AccessibilityNodeInfo find(String[] labels, boolean exact) {
              List<AccessibilityNodeInfo> l = all();
              for (AccessibilityNodeInfo n : l) {
                String t = low(n.getText()), d = low(n.getContentDescription());
                for (String lb : labels) if (t.equals(lb) || d.equals(lb)) return n;
              }
              if (exact) return null;
              for (AccessibilityNodeInfo n : l) {
                String t = low(n.getText()), d = low(n.getContentDescription());
                for (String lb : labels) if ((!t.isEmpty() && t.contains(lb)) || (!d.isEmpty() && d.contains(lb))) return n;
              }
              return null;
            }

            int[] size() {
              DisplayMetrics d = getResources().getDisplayMetrics();
              return new int[]{d.widthPixels, d.heightPixels};
            }

            /* first non-editable node below the header whose text or description contains token */
            AccessibilityNodeInfo containing(String token) {
              int top = size()[1] / 8;
              String tk = low(token);
              if (tk.isEmpty()) return null;
              for (AccessibilityNodeInfo n : all()) {
                if (n.isEditable()) continue;
                String t = low(n.getText()), d = low(n.getContentDescription());
                if (!t.contains(tk) && !d.contains(tk)) continue;
                Rect r = new Rect();
                n.getBoundsInScreen(r);
                if (r.top >= top) return n;
              }
              return null;
            }

            /* Heuristic, not app-specific: a clickable block 25-60% of the screen wide, at least 1/7 of the
               screen tall and below the top fifth. That is what a video thumbnail in a grid looks like. */
            AccessibilityNodeInfo tile() {
              int[] s = size();
              for (AccessibilityNodeInfo n : all()) {
                if (!n.isClickable()) continue;
                Rect r = new Rect();
                n.getBoundsInScreen(r);
                if (r.width() >= s[0] / 4 && r.width() <= s[0] * 6 / 10 && r.height() >= s[1] / 7 && r.top >= s[1] / 5) return n;
              }
              return null;
            }

            boolean click(AccessibilityNodeInfo n) {

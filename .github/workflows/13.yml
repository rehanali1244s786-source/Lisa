            static final Set<String> FILL = new HashSet<String>(Arrays.asList("karo", "kar", "do", "करो", "कर", "दो", "for", "about", "please", "pls", "ke", "liye", "के", "लिए", "it", "इसे", "mein", "में"));

            static boolean vocab(String l, String words) {
              Set<String> st = new HashSet<String>(Arrays.asList(words.split(",")));
              for (String w : l.split("\\s+")) if (!w.isEmpty() && !st.contains(w)) return false;
              return true;
            }

            /* drop filler words at both ends of a query, keep everything in the middle */
            static String lead(String q) {
              String[] w = q.trim().split("\\s+");
              int a = 0, b = w.length;
              while (a < b && FILL.contains(w[a])) a++;
              while (b > a && FILL.contains(w[b - 1])) b--;
              StringBuilder sb = new StringBuilder();
              for (int i = a; i < b; i++) sb.append(sb.length() == 0 ? "" : " ").append(w[i]);
              return sb.toString();
            }

            static String firstToken(String q) {
              for (String w : q.trim().split("\\s+")) if (w.length() >= 3) return w;
              return "";
            }

            static String translit(LisaService s, String q) {
              try {
                String en = Ai.ask(s.sp, "Output only the English-letter transliteration of this text, nothing else.", new ArrayList<String[]>(), q).replaceAll("[^A-Za-z0-9 ]", "").trim();
                return en.isEmpty() ? q : en;
              } catch (Exception e) {
                return q;
              }
            }

            static boolean run(LisaService s, String l, String raw) {
              try {
                Matcher m;
                String app = null, q = null;
                if ((m = P_OPEN_SEARCH.matcher(l)).find()) { app = m.group(1); q = m.group(2); }
                else if ((m = P_APP_OPEN_SEARCH.matcher(l)).find()) { app = m.group(1); q = m.group(2); }
                else if ((m = P_SEARCH_ON.matcher(l)).find() && !LisaService.has(m.group(2), "google|गूगल|chrome|क्रोम") && s.resolveApp(LisaService.strip(m.group(2), LisaService.OPEN_STOP)) != null) { app = m.group(2); q = m.group(1); }
                if (app != null) { openSearch(s, app, q); return true; }
                return standalone(s, l);
              } catch (Exception e) {
                LisaService.log("LISA", "Error: " + e.getMessage());
                s.say(s.T("Sorry, that did not work.", "माफ़ कीजिए, यह नहीं हो पाया।"), true);
                return true;
              }
            }

            static void openSearch(LisaService s, String appRaw, String qRaw) {
              String an = LisaService.strip(appRaw, LisaService.OPEN_STOP);
              String q = lead(qRaw);
              if (q.isEmpty()) { s.say(s.T("What should I search for?", "क्या सर्च करूँ?"), true); return; }
              String[] r = s.resolveApp(an);
              if (r == null) { s.say(s.T("I could not find an app called " + an + ".", an + " नाम का ऐप नहीं मिला।"), true); return; }
              String label = r[0], pkg = r[1];

          import android.accessibilityservice.AccessibilityService;
          import android.content.Context;
          import android.graphics.PixelFormat;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;

          /* A 1x1 transparent window. While it is visible, Android treats LISA as having a visible window,
             which lets it start activities from the background. */
          class Ovl {
            static View view;
            static WindowManager wm;

            static void show(final Context c) {
              new Handler(Looper.getMainLooper()).post(new Runnable() {
                public void run() {
                  if (view != null) return;
                  try {
                    int type;
                    boolean saw = Build.VERSION.SDK_INT < 23 || Settings.canDrawOverlays(c);
                    if (saw) type = Build.VERSION.SDK_INT >= 26 ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY : WindowManager.LayoutParams.TYPE_PHONE;
                    else if (c instanceof AccessibilityService) type = WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY;
                    else return;
                    WindowManager m = (WindowManager) c.getSystemService(Context.WINDOW_SERVICE);
                    View v = new View(c);
                    WindowManager.LayoutParams lp = new WindowManager.LayoutParams(1, 1, type, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE | WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL, PixelFormat.TRANSLUCENT);
                    lp.gravity = Gravity.TOP | Gravity.START;
                    m.addView(v, lp);
                    wm = m;
                    view = v;
                  } catch (Exception e) {}
                }
              });
            }

            static void hide() {
              new Handler(Looper.getMainLooper()).post(new Runnable() {
                public void run() {
                  try { if (view != null && wm != null) wm.removeView(view); } catch (Exception e) {}
                  view = null;
                  wm = null;
                }
              });
            }
          }

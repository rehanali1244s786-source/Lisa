            /* ---------- speaking ---------- */
            static boolean dev(String s) {
              for (char c : s.toCharArray()) if (c >= '\u0900' && c <= '\u097F') return true;
              return false;
            }

            static String langOf(String t) {
              int d = 0, a = 0;
              for (char c : t.toCharArray()) {
                if (c >= '\u0900' && c <= '\u097F') d++;
                else if (c >= '\u0600' && c <= '\u06FF') a++;
              }
              if (d > 0 && d >= a) return "hi-IN";
              return a > 0 ? "ur-PK" : "en-US";
            }


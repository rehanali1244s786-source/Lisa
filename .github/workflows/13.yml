            static final int F = Pattern.CASE_INSENSITIVE | Pattern.UNICODE_CASE;

            /* "open tiktok and search haniya": the app name is everything up to the first connector that is
               followed by a search verb, so a query such as "tom and jerry" stays whole */
            static final Pattern P_OPEN_SEARCH = Pattern.compile("^(?:please |pls )?(?:" + OPENV + ")\\s+(.+?)\\s+(?:" + CONN + ")\\s+(?:" + SRCHV + ")" + KARO + "\\s+(.+)$", F);
            static final Pattern P_APP_OPEN_SEARCH = Pattern.compile("^(.+?)\\s+(?:" + OPENV + ")" + KARO + "\\s+(?:" + CONN + ")\\s+(?:" + SRCHV + ")" + KARO + "\\s+(.+)$", F);
            static final Pattern P_SEARCH_ON = Pattern.compile("^(?:" + SRCHV + ")" + KARO + "\\s+(.+?)\\s+(?:on|in|par|pe|पर|पे|में|mein)\\s+(.+)$", F);
            static final Pattern P_SEARCH = Pattern.compile("^(?:" + SRCHV + ")" + KARO + "\\s+(.+)$", F);
            static final Pattern P_SUBMIT = Pattern.compile("^(?:(?:press|hit|tap) (?:enter|search)|(?:enter|एंटर|सर्च) (?:press|dabao|दबाओ|karo|करो))$", F);
            static final Pattern P_TAP = Pattern.compile("^(?:tap|click|touch|press)\\s+(?:on\\s+)?(.+)$", F);
            static final Pattern P_TAP2 = Pattern.compile("^(.+?)\\s+(?:par|पर)\\s+(?:click|tap|क्लिक|टैप|दबाओ)" + KARO + "$", F);
            static final Pattern P_TYPE = Pattern.compile("^(?:type|likho|लिखो|टाइप)\\s+(.+)$", F);

            /* every word of the sentence must be in the list, so normal chat is never hijacked */
            static final String V_PROFILE = "open,show,go,to,the,his,her,first,pehla,profile,please,pls,kholo,khol,karo,kar,do,dikhao,jao,खोलो,खोल,ओपन,प्रोफाइल,प्रोफ़ाइल,पहला,पहली,का,की,इसका,उसका,इसकी,उसकी,करो,कर,दो,दिखाओ,जाओ,जी,ये,यह,इस,this,that,account,अकाउंट";
            static final String V_FOLLOW = "please,pls,follow,फॉलो,फ़ॉलो,karo,kar,kardo,do,him,her,them,account,this,isko,ise,करो,कर,दो,इसको,इसे,अकाउंट,कीजिए,करें,it,लो,को,ये,यह,jaldi";

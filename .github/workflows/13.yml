          cat > LISA/src/com/abdulrehman/lisa/Vox.java <<'LISA_EOF'
          package com.abdulrehman.lisa;

          import android.content.SharedPreferences;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.Voice;
          import java.util.Locale;

          /* Applies the voice, speed and pitch chosen in Settings to a TextToSpeech engine. */
          class Vox {
            static float num(SharedPreferences sp, String k, float d) {
              try { return Float.parseFloat(sp.getString(k, String.valueOf(d))); } catch (Exception e) { return d; }
            }

            static void apply(TextToSpeech tts, SharedPreferences sp, String lg) {
              Locale loc = Locale.forLanguageTag(lg);
              boolean set = false;
              String vn = sp.getString("voice_" + loc.getLanguage(), "");
              if (!vn.isEmpty()) {
                try {
                  for (Voice v : tts.getVoices()) {
                    if (v.getName().equals(vn)) {
                      tts.setVoice(v);
                      set = true;
                      break;
                    }
                  }
                } catch (Exception e) {}
              }
              if (!set) {
                if (tts.isLanguageAvailable(loc) >= TextToSpeech.LANG_AVAILABLE) tts.setLanguage(loc);
                else if (lg.startsWith("ur")) tts.setLanguage(new Locale("hi", "IN"));
              }
              tts.setSpeechRate(num(sp, "rate", 1f));
              tts.setPitch(num(sp, "pitch", 1f));
            }
          }
          LISA_EOF

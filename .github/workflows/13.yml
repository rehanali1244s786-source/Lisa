                    tts.speak(t, TextToSpeech.QUEUE_FLUSH, null, "u" + System.nanoTime());
                  } catch (Exception e) { afterSpeak(); return; }
                  h.removeCallbacks(speakGuard);
                  h.postDelayed(speakGuard, Math.min(45000L, 3000L + t.length() * 120L));
                }
              });
            }

            void afterSpeak() {
              h.removeCallbacks(speakGuard);
              if (!speaking) return;
              speaking = false;
              awaitUntil = System.currentTimeMillis() + AWAKE_MS;
              followAfter = false;
              state = "Say “Hey " + NAME + "”";
              sched(250);
            }


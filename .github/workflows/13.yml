            static final String[] SEARCH_GO = {"search", "सर्च", "सर्च करें", "go", "खोजें"};
            static final String[] TAB_USERS = {"users", "accounts", "अकाउंट", "अकाउंट्स", "यूज़र्स", "यूजर्स", "लोग", "people"};
            static final String[] FOLLOW = {"follow", "फॉलो", "फ़ॉलो", "फॉलो करें", "फ़ॉलो करें", "follow back", "subscribe", "सब्सक्राइब"};
            static final String[] FOLLOWING = {"following", "subscribed", "फॉलो किया गया", "फ़ॉलो किया गया"};
            static final String[] PROFILE_LBL = {"profile", "प्रोफाइल", "प्रोफ़ाइल"};


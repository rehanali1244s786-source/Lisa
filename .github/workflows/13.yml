            static String norm(String s) {
              StringBuilder b = new StringBuilder();
              for (char c : s.toLowerCase(Locale.ROOT).toCharArray()) b.append(c >= '\u0966' && c <= '\u096F' ? (char) ('0' + (c - '\u0966')) : c);
              return b.toString().replaceAll("[,!?।\"]", " ").replaceAll("\\.(?=\\s|$)", " ").replaceAll("\\s+", " ").trim();
            }

            static String strip(String s, String stop) {
              Set<String> st = new HashSet<String>(Arrays.asList(stop.split(",")));
              StringBuilder sb = new StringBuilder();
              for (String w : s.split("\\s+")) if (!w.isEmpty() && !st.contains(w)) sb.append(w).append(' ');
              return sb.toString().trim();
            }


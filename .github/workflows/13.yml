                return;
              }
              String qq = LisaService.dev(q) ? translit(s, q) : q;
              boolean ok = a.searchIn(qq);
              if (ok) lastQ = qq;
              s.say(ok ? s.T("Searched " + label + " for " + q, label + " पर " + q + " सर्च कर दिया") : s.T("I opened " + label + " but could not use its search box. Say dump screen to see what I can see.", label + " खुल गया लेकिन सर्च बॉक्स नहीं मिला। स्क्रीन डंप बोलिए।"), true);
            }

            static boolean openProfile(LisaAccess a) {
              AccessibilityNodeInfo tab = a.find(TAB_USERS, true);
              if (tab != null && !tab.isSelected()) {
                a.click(tab);
                LisaAccess.sleep(900);
              }
              String tok = firstToken(lastQ);
              AccessibilityNodeInfo row = tok.isEmpty() ? null : a.containing(tok);
              if (row != null && a.click(row)) return true;
              AccessibilityNodeInfo p = a.find(PROFILE_LBL, true);
              return p != null && a.click(p);
            }

            static boolean standalone(LisaService s, String l) {
              Matcher m;
              String act = null, arg = null;
              if (LisaService.has(l, "profile|प्रोफाइल|प्रोफ़ाइल") && vocab(l, V_PROFILE)) act = "profile";
              else if (LisaService.has(l, "follow|फॉलो|फ़ॉलो") && !LisaService.has(l, "unfollow|अनफॉलो") && vocab(l, V_FOLLOW)) act = "follow";
              else if (LisaService.has(l, "video|वीडियो|reel|रील") && LisaService.has(l, "next|अगला|agla|नेक्स्ट") && vocab(l, V_NAV)) act = "next";
              else if (LisaService.has(l, "video|वीडियो|reel|रील") && LisaService.has(l, "previous|prev|पिछला|pichla") && vocab(l, V_NAV)) act = "prev";
              else if (LisaService.has(l, "video|वीडियो|reel|रील|\\bvid\\b") && LisaService.has(l, "play|chalao|chala|चलाओ|चला|प्ले|open|khol|खोल|ओपन|start") && vocab(l, V_PLAY)) act = "play";
              else if (LisaService.has(l, "scroll|स्क्रॉल") && vocab(l, V_SCROLL)) act = LisaService.has(l, "\\bup\\b|ऊपर|upar") ? "scrollup" : "scrolldown";
              else if (l.matches("go back|पीछे जाओ|वापस जाओ|peeche jao|wapas jao|back jao")) act = "back";
              else if (l.matches("go home|home screen|होम स्क्रीन|home jao|होम जाओ")) act = "home";
              else if (P_SUBMIT.matcher(l).find()) act = "submit";
              else if (LisaService.has(l, "dump (the )?screen|screen dump|स्क्रीन डंप")) act = "dump";
              else if ((m = P_TAP.matcher(l)).find()) { act = "tap"; arg = m.group(1); }
              else if ((m = P_TAP2.matcher(l)).find()) { act = "tap"; arg = m.group(1); }
              else if ((m = P_TYPE.matcher(l)).find()) { act = "type"; arg = m.group(1); }

              LisaAccess a = LisaAccess.inst;
              if (act == null && a != null && !lastPkg.isEmpty() && !LisaService.has(l, "google|गूगल") && (m = P_SEARCH.matcher(l)).find() && lastPkg.equals(a.fg())) {
                act = "search";
                arg = lead(m.group(1));
              }
              if (act == null) return false;
              if (a == null) {
                s.say(s.T("Please turn on LISA in Accessibility settings so I can control apps.", "ऐप चलाने के लिए सेटिंग्स में LISA की Accessibility चालू कीजिए।"), true);
                return true;
              }

              boolean ok = false;
              String okMsg = s.T("Done", "हो गया");
              if (act.equals("profile")) { ok = openProfile(a); okMsg = s.T("Opened the profile", "प्रोफाइल खोल दिया"); }
              else if (act.equals("follow")) {
                AccessibilityNodeInfo f = a.find(FOLLOW, true);
                if (f != null) { ok = a.click(f); okMsg = s.T("Followed", "फॉलो कर लिया"); }
                else if (a.find(FOLLOWING, true) != null) { ok = true; okMsg = s.T("You already follow this account", "आप पहले से फॉलो कर रहे हैं"); }
              }
              else if (act.equals("play")) { AccessibilityNodeInfo t = a.tile(); ok = t != null && a.click(t); okMsg = s.T("Playing the video", "वीडियो चला रही हूँ"); }
              else if (act.equals("next") || act.equals("scrolldown")) ok = a.swipe(true);
              else if (act.equals("prev") || act.equals("scrollup")) ok = a.swipe(false);
              else if (act.equals("back")) ok = a.performGlobalAction(AccessibilityService.GLOBAL_ACTION_BACK);
              else if (act.equals("home")) ok = a.performGlobalAction(AccessibilityService.GLOBAL_ACTION_HOME);
              else if (act.equals("submit")) ok = a.submit();
              else if (act.equals("dump")) { LisaService.log("LISA", a.dump()); ok = true; okMsg = s.T("The screen details are in the log", "स्क्रीन की जानकारी लॉग में है"); }
              else if (act.equals("tap")) { String lb = lead(arg); AccessibilityNodeInfo n = lb.isEmpty() ? null : a.find(new String[]{lb}, false); ok = n != null && a.click(n); }
              else if (act.equals("type")) ok = a.type(arg);
              else if (act.equals("search")) {
                if ("com.google.android.youtube".equals(lastPkg)) ok = s.youtubeSearch(arg);
                else {
                  String qq = LisaService.dev(arg) ? translit(s, arg) : arg;
                  ok = a.searchIn(qq);
                  if (ok) lastQ = qq;
                }
                okMsg = s.T("Searched for " + arg, arg + " सर्च कर दिया");
              }
              s.say(ok ? okMsg : s.T("I could not do that on this screen.", "इस स्क्रीन पर यह नहीं हो पाया।"), true);
              return true;
            }

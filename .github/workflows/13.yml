            String[] resolveApp(String name) {
              String q = name.toLowerCase(Locale.ROOT).trim();
              for (String[] a : ALIAS) if (q.contains(a[0])) q = q.replace(a[0], a[1]);
              q = q.trim();
              if (q.isEmpty()) return null;
              PackageManager pm = getPackageManager();
              ResolveInfo best = null;
              int bs = 0;
              for (ResolveInfo r : pm.queryIntentActivities(new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), 0)) {
                String lb = r.loadLabel(pm).toString().toLowerCase(Locale.ROOT);
                int s = lb.equals(q) ? 4 : lb.startsWith(q) ? 3 : lb.contains(q) ? 2 : (q.length() > 3 && r.activityInfo.packageName.contains(q.replace(" ", ""))) ? 1 : 0;
                if (s > bs) { bs = s; best = r; }
              }
              if (best == null) return null;
              
              return new String[]{best.loadLabel(pm).toString(), best.activityInfo.packageName};
            }

            /* startActivity from the background can be dropped without any exception, so when the
               accessibility service is on we check that the app really reached the screen */
            boolean launchVerified(Intent i, String pkg) {
              if (!launch(i)) return false;
              LisaAccess a = LisaAccess.inst;
              if (a == null) return true;
              if (a.waitFg(pkg, 3000)) return true;
              try { a.startActivity(new Intent(i).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)); } catch (Exception e) {}
              return a.waitFg(pkg, 5000);
            }

            boolean startApp(String pkg) {
              Intent li = getPackageManager().getLaunchIntentForPackage(pkg);
              return li != null && launchVerified(li, pkg);
            }


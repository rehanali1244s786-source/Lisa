              for (int i = 0; i < 6 && c != null; i++) {
                if (c.isClickable() && c.isEnabled() && c.performAction(AccessibilityNodeInfo.ACTION_CLICK)) return true;
                c = c.getParent();
              }
              Rect r = new Rect();
              n.getBoundsInScreen(r);
              return r.width() > 0 && r.height() > 0 && gesture(r.centerX(), r.centerY(), r.centerX(), r.centerY(), 60);
            }

            boolean gesture(int x1, int y1, int x2, int y2, long ms) {
              try {
                Path p = new Path();
                p.moveTo(x1, y1);
                if (x1 != x2 || y1 != y2) p.lineTo(x2, y2);
                final CountDownLatch done = new CountDownLatch(1);
                final boolean[] ok = new boolean[1];
                GestureDescription g = new GestureDescription.Builder().addStroke(new GestureDescription.StrokeDescription(p, 0, Math.max(1, ms))).build();
                boolean sent = dispatchGesture(g, new GestureResultCallback() {
                  @Override public void onCompleted(GestureDescription d) { ok[0] = true; done.countDown(); }
                  @Override public void onCancelled(GestureDescription d) { done.countDown(); }
                }, null);
                if (!sent) return false;
                done.await(ms + 1500, TimeUnit.MILLISECONDS);
                return ok[0];
              } catch (Exception e) {
                return false;
              }
            }

            /* up = true moves the content up, which shows the next video in a vertical feed */
            boolean swipe(boolean up) {
              int[] s = size();
              int x = s[0] / 2;
              return up ? gesture(x, s[1] * 7 / 10, x, s[1] * 3 / 10, 250) : gesture(x, s[1] * 3 / 10, x, s[1] * 7 / 10, 250);
            }

            AccessibilityNodeInfo edit() {
              AccessibilityNodeInfo r = root();
              if (r != null) {
                try {
                  AccessibilityNodeInfo f = r.findFocus(AccessibilityNodeInfo.FOCUS_INPUT);
                  if (f != null && f.isEditable()) return f;
                } catch (Exception e) {}
              }
              for (AccessibilityNodeInfo n : all()) if (n.isEditable() || "android.widget.EditText".equals(String.valueOf(n.getClassName()))) return n;
              return null;
            }

            boolean type(String text) {
              AccessibilityNodeInfo f = edit();
              if (f == null) return false;
              f.performAction(AccessibilityNodeInfo.ACTION_FOCUS);
              f.performAction(AccessibilityNodeInfo.ACTION_CLICK);
              sleep(200);
              AccessibilityNodeInfo g = edit();
              if (g != null) f = g;
              Bundle b = new Bundle();
              b.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text);
              return f.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, b);
            }

            boolean submit() {
              AccessibilityNodeInfo f = edit();
              if (f != null && Build.VERSION.SDK_INT >= 30 && f.performAction(AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER.getId())) return true;
              AccessibilityNodeInfo b = find(Auto.SEARCH_GO, true);
              return b != null && click(b);
            }

            /* open the search box (if it is not already open), type, press search */
            boolean searchIn(String q) {
              AccessibilityNodeInfo box = null;
              long start = System.currentTimeMillis(), end = start + 10000;
              boolean clicked = false;
              while (System.currentTimeMillis() < end) {
                box = edit();
                if (box != null) break;
                if (!clicked) {
                  AccessibilityNodeInfo ic = find(Auto.SEARCH_ICON, System.currentTimeMillis() < start + 3000);
                  if (ic != null && click(ic)) clicked = true;
                }
                sleep(250);
              }
              if (box == null) return false;
              if (!type(q)) return false;
              sleep(300);
              return submit();
            }

            static class Tx {
              int top, left;
              String t;
              Tx(int a, int b, String c) { top = a; left = b; t = c; }
            }

            /* visible text in reading order (top to bottom, then left to right); password fields are skipped */
            String readScreen() {
              List<Tx> txt = new ArrayList<Tx>(), dsc = new ArrayList<Tx>();
              for (AccessibilityNodeInfo n : all()) {
                CharSequence pk = n.getPackageName();
                if (pk != null && "com.abdulrehman.lisa".contentEquals(pk)) continue;
                if (n.isPassword()) continue;
                Rect r = new Rect();
                n.getBoundsInScreen(r);
                String t = n.getText() == null ? "" : n.getText().toString().trim();
                String d = n.getContentDescription() == null ? "" : n.getContentDescription().toString().trim();
                if (!t.isEmpty()) txt.add(new Tx(r.top, r.left, t));
                else if (d.length() > 1) dsc.add(new Tx(r.top, r.left, d));
              }
              List<Tx> use = txt.isEmpty() ? dsc : txt;
              java.util.Collections.sort(use, new java.util.Comparator<Tx>() {
                @Override public int compare(Tx x, Tx y) {
                  int c = x.top / 30 - y.top / 30;
                  return c != 0 ? c : x.left - y.left;
                }
              });
              StringBuilder sb = new StringBuilder();
              String prev = "";
              for (Tx x : use) {
                if (x.t.equals(prev)) continue;
                prev = x.t;
                sb.append(x.t).append(". ");
                if (sb.length() > 3000) break;
              }
              return sb.toString().trim();
            }

            boolean screenshot() {
              return Build.VERSION.SDK_INT >= 28 && performGlobalAction(AccessibilityService.GLOBAL_ACTION_TAKE_SCREENSHOT);
            }

            String dump() {
              StringBuilder sb = new StringBuilder("pkg=" + fg() + "\n");
              int k = 0;
              for (AccessibilityNodeInfo n : all()) {
                String t = n.getText() == null ? "" : n.getText().toString();
                String d = n.getContentDescription() == null ? "" : n.getContentDescription().toString();
                String id = n.getViewIdResourceName() == null ? "" : n.getViewIdResourceName();
                if (t.isEmpty() && d.isEmpty() && id.isEmpty()) continue;
                Rect r = new Rect();
                n.getBoundsInScreen(r);
                sb.append(n.isClickable() ? "[c] " : "    ").append(clip(t)).append(" | ").append(clip(d)).append(" | ").append(id).append(" | ").append(r.flattenToString()).append("\n");
                if (++k >= 60) break;
              }
              return sb.toString().trim();
            }

            static String clip(String s) { return s.length() > 40 ? s.substring(0, 40) + "…" : s; }
          }

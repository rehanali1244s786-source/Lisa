                s.say(ok ? s.T("Searching YouTube for " + q, "यूट्यूब पर " + q + " खोज रही हूँ") : s.T("I could not open YouTube.", "यूट्यूब नहीं खुल पाया।"), false);
                return;
              }
              s.say(s.T("Opening " + label, label + " खोल रही हूँ"), false);
              if (!s.startApp(pkg)) {
                s.say(s.T("I could not open " + label + ". Allow Display over other apps and turn on LISA in Accessibility.", label + " नहीं खुल पाया। Display over other apps और LISA की Accessibility चालू कीजिए।"), true);

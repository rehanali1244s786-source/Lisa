          .orb b{position:absolute;inset:36px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff,var(--a) 42%,var(--b) 78%);box-shadow:0 0 40px var(--a),0 0 80px #7c4dff88;animation:pl 2.4s ease-in-out infinite}

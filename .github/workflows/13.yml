            /* ---------- listening ---------- */
            void sched(long ms) { h.removeCallbacks(listenR); h.postDelayed(listenR, ms); }

            void restart() {
              try { if (sr != null) sr.cancel(); } catch (Exception e) {}
              sched(100);

name: Build LISA APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK platform and build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Create LISA project files
        run: |
          set -e
          mkdir -p LISA/src/com/abdulrehman/lisa LISA/assets
          mkdir -p LISA/res/mipmap-mdpi LISA/res/mipmap-hdpi LISA/res/mipmap-xhdpi LISA/res/mipmap-xxhdpi LISA/res/mipmap-xxxhdpi
          cat > LISA/AndroidManifest.xml <<'LISA_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.abdulrehman.lisa">
            <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="28"/>
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.RECORD_AUDIO"/>
            <uses-permission android:name="android.permission.CAMERA"/>
            <uses-permission android:name="android.permission.VIBRATE"/>
            <uses-permission android:name="android.permission.READ_CONTACTS"/>
            <uses-permission android:name="com.android.alarm.permission.SET_ALARM"/>
            <uses-feature android:name="android.hardware.camera" android:required="false"/>
            <application android:label="LISA" android:icon="@mipmap/ic_launcher" android:usesCleartextTraffic="true" android:hardwareAccelerated="true" android:allowBackup="false">
              <activity android:name=".MainActivity" android:exported="true" android:theme="@android:style/Theme.DeviceDefault.NoActionBar" android:screenOrientation="portrait" android:configChanges="orientation|screenSize|keyboardHidden" android:windowSoftInputMode="adjustResize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          LISA_EOF
          cat > LISA/src/com/abdulrehman/lisa/MainActivity.java <<'LISA_EOF'
          package com.abdulrehman.lisa;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.database.Cursor;
          import android.graphics.drawable.ColorDrawable;
          import android.hardware.camera2.CameraCharacteristics;
          import android.hardware.camera2.CameraManager;
          import android.media.AudioManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.Vibrator;
          import android.provider.AlarmClock;
          import android.provider.ContactsContract;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.ArrayList;
          import java.util.Iterator;
          import java.util.List;
          import java.util.Locale;

          public class MainActivity extends Activity {
            WebView w;
            TextToSpeech tts;
            SpeechRecognizer sr;
            ValueCallback<Uri[]> fc;
            Handler ui = new Handler(Looper.getMainLooper());
            boolean paused = false;
            boolean mutedN = false;
            boolean mutedS = false;
            final Runnable unmute = new Runnable() {
              public void run() { setBeepMuted(false); }
            };

            boolean muteStream(AudioManager am, int stream, boolean mute, boolean current) {
              try {
                if (mute && !current && !am.isStreamMute(stream)) {
                  am.adjustStreamVolume(stream, AudioManager.ADJUST_MUTE, 0);
                  return true;
                }
                if (!mute && current) {
                  am.adjustStreamVolume(stream, AudioManager.ADJUST_UNMUTE, 0);
                  return false;
                }
              } catch (Exception e) {}
              return mute ? current : false;
            }

            void setBeepMuted(boolean m) {
              AudioManager am = (AudioManager) getSystemService(AUDIO_SERVICE);
              mutedN = muteStream(am, AudioManager.STREAM_NOTIFICATION, m, mutedN);
              mutedS = muteStream(am, AudioManager.STREAM_SYSTEM, m, mutedS);
            }

            void releaseBeepSoon() {
              ui.removeCallbacks(unmute);
              ui.postDelayed(unmute, 500);
            }

            protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().setBackgroundDrawable(new ColorDrawable(0xFF050816));
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              requestPermissions(new String[]{"android.permission.RECORD_AUDIO", "android.permission.CAMERA"}, 1);
              tts = new TextToSpeech(this, new TextToSpeech.OnInitListener() {
                public void onInit(int s) {
                  if (s != TextToSpeech.SUCCESS) return;
                  tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                    public void onStart(String id) {}
                    public void onDone(String id) { js("if(window.onSpoken)onSpoken()"); }
                    public void onError(String id) { js("if(window.onSpoken)onSpoken()"); }
                  });
                }
              });
              w = new WebView(this);
              setContentView(w);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              w.addJavascriptInterface(new Bridge(), "Native");
              w.setWebViewClient(new WebViewClient() {
                public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                  Uri u = r.getUrl();
                  if ("lisa.local".equals(u.getHost())) {
                    try {
                      String p = u.getPath();
                      if (p == null || p.equals("/")) p = "/index.html";
                      InputStream in = getAssets().open(p.substring(1));
                      return new WebResourceResponse("text/html", "UTF-8", in);
                    } catch (Exception e) {}
                  }
                  return null;
                }
              });
              w.setWebChromeClient(new WebChromeClient() {
                public void onPermissionRequest(final PermissionRequest r) {
                  ui.post(new Runnable() {
                    public void run() {
                      if (r.getOrigin() == null || !"lisa.local".equals(r.getOrigin().getHost())) {
                        r.deny();
                        return;
                      }
                      List<String> ok = new ArrayList<String>();
                      for (String res : r.getResources()) {
                        if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(res) || PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(res)) ok.add(res);
                      }
                      if (ok.isEmpty()) r.deny();
                      else r.grant(ok.toArray(new String[0]));
                    }
                  });
                }
                public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                  fc = cb;
                  try {
                    startActivityForResult(p.createIntent(), 2);
                  } catch (Exception e) {
                    fc = null;
                    return false;
                  }
                  return true;
                }
              });
              w.loadUrl("https://lisa.local/index.html");
            }

            protected void onActivityResult(int rc, int res, Intent d) {
              if (rc == 2 && fc != null) {
                fc.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, d));
                fc = null;
              }
            }

            public void onBackPressed() {
              w.evaluateJavascript("onBack()", new ValueCallback<String>() {
                public void onReceiveValue(String v) {
                  if (!"true".equals(v)) finish();
                }
              });
            }

            protected void onPause() {
              super.onPause();
              paused = true;
              if (sr != null) sr.cancel();
              ui.removeCallbacks(unmute);
              setBeepMuted(false);
              if (w != null) w.evaluateJavascript("if(window.stopCam)stopCam();if(window.pvLock)pvLock()", null);
            }

            protected void onResume() {
              super.onResume();
              paused = false;
              if (w != null) w.evaluateJavascript("if(window.resumeLoop)resumeLoop()", null);
            }

            protected void onDestroy() {
              super.onDestroy();
              ui.removeCallbacks(unmute);
              setBeepMuted(false);
              if (sr != null) sr.destroy();
              if (tts != null) tts.shutdown();
            }

            void js(final String code) {
              ui.post(new Runnable() {
                public void run() { w.evaluateJavascript(code, null); }
              });
            }

            class Bridge {
              @JavascriptInterface
              public void speak(final String t, final String lang, final float rate) {
                ui.post(new Runnable() {
                  public void run() {
                    tts.setLanguage(Locale.forLanguageTag(lang));
                    tts.setSpeechRate(rate);
                    tts.speak(t, TextToSpeech.QUEUE_FLUSH, null, "lisa");
                  }
                });
              }

              @JavascriptInterface
              public void listen(final String lang) {
                ui.post(new Runnable() {
                  public void run() {
                    if (paused) return;
                    if (!SpeechRecognizer.isRecognitionAvailable(MainActivity.this)) {
                      js("onHeardErr(-1)");
                      return;
                    }
                    if (sr == null) {
                      sr = SpeechRecognizer.createSpeechRecognizer(MainActivity.this);
                      sr.setRecognitionListener(new RecognitionListener() {
                        public void onReadyForSpeech(Bundle p) {}
                        public void onBeginningOfSpeech() {}
                        public void onRmsChanged(float v) {}
                        public void onBufferReceived(byte[] b) {}
                        public void onEndOfSpeech() {}
                        public void onPartialResults(Bundle b) {}
                        public void onEvent(int i, Bundle b) {}
                        public void onError(int e) {
                          releaseBeepSoon();
                          if (e == 8) sr.cancel();
                          js("onHeardErr(" + e + ")");
                        }
                        public void onResults(Bundle b) {
                          releaseBeepSoon();
                          ArrayList<String> l = b.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                          if (l == null || l.isEmpty()) js("onHeardErr(7)");
                          else js("onHeard(" + JSONObject.quote(l.get(0)) + ")");
                        }
                      });
                    }
                    Intent i = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                    i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                    i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, lang);
                    ui.removeCallbacks(unmute);
                    setBeepMuted(true);
                    sr.startListening(i);
                  }
                });
              }

              @JavascriptInterface
              public void stop() {
                ui.post(new Runnable() {
                  public void run() {
                    if (sr != null) sr.cancel();
                    ui.removeCallbacks(unmute);
                    setBeepMuted(false);
                  }
                });
              }

              @JavascriptInterface
              public void stopSpeak() {
                ui.post(new Runnable() {
                  public void run() {
                    if (tts != null) tts.stop();
                  }
                });
              }

              @JavascriptInterface
              public void http(final String id, final String url, final String method, final String headers, final String body) {
                new Thread(new Runnable() {
                  public void run() {
                    int code = 0;
                    String out;
                    try {
                      HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                      c.setConnectTimeout(15000);
                      c.setReadTimeout(30000);
                      c.setRequestMethod(method);
                      JSONObject h = new JSONObject(headers);
                      Iterator<String> it = h.keys();
                      while (it.hasNext()) {
                        String k = it.next();
                        c.setRequestProperty(k, h.getString(k));
                      }
                      if (body != null && body.length() > 0) {
                        c.setDoOutput(true);
                        OutputStream os = c.getOutputStream();
                        os.write(body.getBytes("UTF-8"));
                        os.close();
                      }
                      code = c.getResponseCode();
                      InputStream is = code >= 400 ? c.getErrorStream() : c.getInputStream();
                      BufferedReader r = new BufferedReader(new InputStreamReader(is, "UTF-8"));
                      StringBuilder sb = new StringBuilder();
                      String ln;
                      while ((ln = r.readLine()) != null) sb.append(ln).append('\n');
                      r.close();
                      out = sb.toString();
                    } catch (Exception e) {
                      out = "Network error: " + e.getMessage();
                    }
                    js("onHttp(" + JSONObject.quote(id) + "," + code + "," + JSONObject.quote(out) + ")");
                  }
                }).start();
              }

              @JavascriptInterface
              public String cmd(String n, String a) {
                try {
                  if (n.equals("torch")) {
                    CameraManager cm = (CameraManager) getSystemService(CAMERA_SERVICE);
                    for (String id : cm.getCameraIdList()) {
                      Boolean f = cm.getCameraCharacteristics(id).get(CameraCharacteristics.FLASH_INFO_AVAILABLE);
                      if (f != null && f) {
                        cm.setTorchMode(id, a.equals("1"));
                        break;
                      }
                    }
                  } else if (n.equals("battery")) {
                    Intent i = registerReceiver(null, new IntentFilter(Intent.ACTION_BATTERY_CHANGED));
                    return "" + (i.getIntExtra("level", 0) * 100 / i.getIntExtra("scale", 100));
                  } else if (n.equals("contact")) {
                    if (checkSelfPermission("android.permission.READ_CONTACTS") != PackageManager.PERMISSION_GRANTED) {
                      ui.post(new Runnable() {
                        public void run() {
                          requestPermissions(new String[]{"android.permission.READ_CONTACTS"}, 3);
                        }
                      });
                      return "perm";
                    }
                    return findContact(a);
                  } else if (n.equals("dial")) {
                    go(new Intent(Intent.ACTION_DIAL, Uri.parse("tel:" + a)));
                  } else if (n.equals("url")) {
                    go(new Intent(Intent.ACTION_VIEW, Uri.parse(a)));
                  } else if (n.equals("sms")) {
                    String[] p = a.split("\\|", 2);
                    Intent i = new Intent(Intent.ACTION_SENDTO, Uri.parse("smsto:" + p[0]));
                    i.putExtra("sms_body", p[1]);
                    go(i);
                  } else if (n.equals("timer")) {
                    go(new Intent(AlarmClock.ACTION_SET_TIMER).putExtra(AlarmClock.EXTRA_LENGTH, Integer.parseInt(a)).putExtra(AlarmClock.EXTRA_SKIP_UI, true));
                  } else if (n.equals("alarm")) {
                    String[] p = a.split(":");
                    go(new Intent(AlarmClock.ACTION_SET_ALARM).putExtra(AlarmClock.EXTRA_HOUR, Integer.parseInt(p[0])).putExtra(AlarmClock.EXTRA_MINUTES, Integer.parseInt(p[1])).putExtra(AlarmClock.EXTRA_SKIP_UI, true));
                  } else if (n.equals("vol")) {
                    AudioManager am = (AudioManager) getSystemService(AUDIO_SERVICE);
                    am.adjustStreamVolume(AudioManager.STREAM_MUSIC, a.equals("up") ? AudioManager.ADJUST_RAISE : AudioManager.ADJUST_LOWER, AudioManager.FLAG_SHOW_UI);
                  } else if (n.equals("vibrate")) {
                    ((Vibrator) getSystemService(VIBRATOR_SERVICE)).vibrate(600);
                  } else if (n.equals("app")) {
                    PackageManager pm = getPackageManager();
                    Intent q = new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER);
                    List<ResolveInfo> l = pm.queryIntentActivities(q, 0);
                    for (ResolveInfo r : l) {
                      String label = r.loadLabel(pm).toString();
                      if (label.toLowerCase().contains(a.toLowerCase())) {
                        go(pm.getLaunchIntentForPackage(r.activityInfo.packageName));
                        return label;
                      }
                    }
                    return "";
                  }
                } catch (Exception e) {
                  return "";
                }
                return "ok";
              }

              String findContact(String name) {
                String key = name.trim();
                if (key.length() == 0) return "";
                Cursor c = null;
                try {
                  c = getContentResolver().query(
                    ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                    new String[]{ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME, ContactsContract.CommonDataKinds.Phone.NUMBER},
                    ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " LIKE ?",
                    new String[]{"%" + key + "%"}, null);
                  if (c == null) return "";
                  String best = "";
                  int n = 0;
                  while (c.moveToNext() && n++ < 50) {
                    String dn = c.getString(0);
                    String num = c.getString(1);
                    if (dn == null || num == null) continue;
                    if (dn.equalsIgnoreCase(key)) return dn + "|" + num;
                    if (best.length() == 0) best = dn + "|" + num;
                  }
                  return best;
                } catch (Exception e) {
                  return "";
                } finally {
                  if (c != null) c.close();
                }
              }

              void go(Intent i) {
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                startActivity(i);
              }
            }
          }
          LISA_EOF
          cat > LISA/assets/index.html <<'LISA_EOF'
          <!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LISA</title>
          <style>
          :root{--a:#00e5ff;--b:#7c4dff;--c:#ff2d95}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          body{margin:0;background:#050816;color:#e8f0ff;font:15px system-ui,sans-serif;height:100vh;overflow:hidden}
          #bg{position:fixed;inset:0;background:radial-gradient(circle at 20% 15%,#1b1f5e,transparent 55%),radial-gradient(circle at 85% 85%,#4a0f5e,transparent 55%);animation:bg 10s ease-in-out infinite alternate}
          @keyframes bg{to{filter:hue-rotate(70deg) brightness(1.25)}}
          .scene{perspective:700px;display:flex;justify-content:center;padding:18px 0}
          .orb{width:120px;height:120px;position:relative;transform-style:preserve-3d;animation:spin 9s linear infinite}
          .orb i{position:absolute;inset:0;border-radius:50%;border:3px solid var(--a);box-shadow:0 0 18px var(--a),inset 0 0 18px var(--b)}
          .orb i:nth-child(2){transform:rotateY(60deg);border-color:var(--b)}.orb i:nth-child(3){transform:rotateY(120deg);border-color:var(--c)}
          .orb b{position:absolute;inset:33%;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,var(--a) 40%,var(--b));box-shadow:0 0 30px var(--a);animation:pulse 2s ease-in-out infinite}
          @keyframes spin{to{transform:rotateX(360deg) rotateY(360deg)}}
          @keyframes pulse{50%{transform:scale(1.35)}}
          .on .orb{animation-duration:2.5s}.on .orb b{animation-duration:.7s;background:radial-gradient(circle at 30% 30%,#fff,var(--c) 40%,var(--b))}
          button{border:0;color:#fff;font:700 14px system-ui;padding:12px 16px;border-radius:14px;background:linear-gradient(145deg,var(--b),#3a1fa8);box-shadow:0 6px 0 #1d0f66,0 10px 20px #0008;transition:.1s}
          button:active{transform:translateY(5px);box-shadow:0 1px 0 #1d0f66}
          button.x{padding:8px 11px;background:linear-gradient(145deg,#c2185b,#7b0f3d);box-shadow:0 4px 0 #43061f}
          #play{font-size:19px;padding:16px 34px;background:linear-gradient(145deg,var(--a),#0077ff);box-shadow:0 8px 0 #00467a,0 0 28px #00e5ff77;color:#031}
          .on #play{background:linear-gradient(145deg,var(--c),#a00050);box-shadow:0 8px 0 #50002a,0 0 28px #ff2d9577;color:#fff}
          input,select,textarea{width:100%;background:#0c1233;border:1px solid #2b3a8c;border-radius:10px;color:#fff;padding:10px;font:14px system-ui;margin:3px 0}
          .card{background:rgba(20,26,70,.62);border:1px solid #3a4cc0;border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 14px 30px #0009,inset 0 1px 0 #ffffff22;transform-style:preserve-3d;transition:transform .15s}
          .r{display:flex;gap:8px;align-items:center}.r b{flex:1}.r span{color:var(--a)}
          h3{margin:0 0 8px;color:var(--a)}small{opacity:.65}
          #top{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:12px;padding:0 12px;z-index:5;background:#050816cc;backdrop-filter:blur(8px);border-bottom:1px solid #2b3a8c}
          #top h2{margin:0;letter-spacing:3px;font-size:19px;background:linear-gradient(90deg,var(--a),var(--c));-webkit-background-clip:text;color:transparent}
          .scr{display:none;position:absolute;top:56px;bottom:0;left:0;right:0;overflow:auto;padding:10px 14px 30px;perspective:900px}
          .scr.show{display:block;animation:in .45s ease-out}
          @keyframes in{from{opacity:0;transform:rotateX(14deg) translateY(24px)}}
          #drawer{position:fixed;top:0;bottom:0;left:0;width:72%;max-width:290px;background:linear-gradient(160deg,#10185a,#240a4a);z-index:9;transform:translateX(-105%) rotateY(-25deg);transform-origin:left;transition:.35s;padding:70px 14px 14px;box-shadow:10px 0 40px #000}
          #drawer.open{transform:none}#drawer button{display:block;width:100%;margin:0 0 14px;text-align:left}
          #log{max-height:34vh;overflow:auto}#log div{margin:6px 0;padding:8px 11px;border-radius:12px;background:#12195c;max-width:92%}#log .Y{margin-left:auto;background:#3a1fa8}
          #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#00e5ff;color:#012;padding:8px 18px;border-radius:20px;font-weight:700;z-index:99;transition:.3s}
          #toast.s{transform:translateX(-50%)}
          #splash{position:fixed;inset:0;z-index:50;background:#050816;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .6s}
          #splash .orb{width:150px;height:150px;margin:20px}
          #splash h1{margin:6px;font-size:34px;letter-spacing:6px;background:linear-gradient(90deg,var(--a),var(--c));-webkit-background-clip:text;color:transparent;animation:in 1s}
          #splash p{margin:4px;color:#b9c6ff}#bar{width:200px;height:6px;border-radius:3px;background:#1b2260;margin-top:26px;overflow:hidden}
          #bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--c));animation:ld 5s linear forwards}@keyframes ld{to{width:100%}}
          video{width:100%;border-radius:14px;background:#000;max-height:40vh}
          #plog{max-height:34vh;overflow:auto}#plog div{margin:6px 0;padding:8px 11px;border-radius:12px;background:#4a0f5e;max-width:92%}#plog .Y{margin-left:auto;background:#3a1fa8}
          @media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
          </style></head><body>
          <div id="bg"></div>
          <div id="splash"><div class="scene"><div class="orb"><i></i><i></i><i></i><b></b></div></div><h1>HEY LISA</h1>
          <p>Credit by Abdul Rehman</p><p>Developed by Abdul Rehman</p><p><small>Powered by Gemini &amp; Groq</small></p><div id="bar"><i></i></div></div>

          <div id="top"><button onclick="drawer(1)">☰</button><h2>LISA</h2></div>
          <div id="drawer"><button onclick="show('home')">🏠 Home</button><button onclick="show('trade')">📈 Trading</button><button onclick="show('vision')">📷 Vision</button><button onclick="show('private')">💞 Private chat</button><button onclick="show('set')">⚙️ Settings</button><button onclick="show('about')">ℹ️ About</button><button onclick="clearChat()">🗑 Clear chat memory</button></div>

          <div class="scr show" id="s_home"><div id="homebox"><div class="scene"><div class="orb"><i></i><i></i><i></i><b></b></div></div>
          <p style="text-align:center" id="st">Press PLAY, then say “Hey Lisa”</p>
          <div class="r" style="justify-content:center;gap:16px"><button id="play" onclick="toggle()">▶ PLAY</button><button onclick="mic()">🎤</button></div></div>

      - name: Build APK
        run: |
          set -e
          cd LISA
          BT="$ANDROID_HOME/build-tools/34.0.0"
          JAR="$ANDROID_HOME/platforms/android-34/android.jar"

          rm -rf build && mkdir -p build/obj

          # 1) Compile resources and link manifest/assets
          "$BT/aapt2" compile --dir res -o build/res.zip
          "$BT/aapt2" link -o build/base.apk -I "$JAR" \
            --manifest AndroidManifest.xml -R build/res.zip -A assets \
            --min-sdk-version 24 --target-sdk-version 28 \
            --version-code 1 --version-name 1.0

          # 2) Compile Java
          javac -source 8 -target 8 -classpath "$JAR" -d build/obj \
            $(find src -name '*.java')

          # 3) Convert to DEX and add to APK
          "$BT/d8" --lib "$JAR" --min-api 24 --output build \
            $(find build/obj -name '*.class')
          (cd build && zip -q base.apk classes.dex)

          # 4) Align
          "$BT/zipalign" -f -p 4 build/base.apk build/aligned.apk

          # 5) Sign
          keytool -genkeypair -keystore lisa.keystore -alias lisa \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass lisa1234 -keypass lisa1234 -dname "CN=Abdul Rehman"
          "$BT/apksigner" sign --ks lisa.keystore \
            --ks-pass pass:lisa1234 --key-pass pass:lisa1234 \
            --out LISA.apk build/aligned.apk
          "$BT/apksigner" verify LISA.apk

          mkdir -p "$GITHUB_WORKSPACE/out"
          cp LISA.apk "$GITHUB_WORKSPACE/out/LISA.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LISA-apk
          path: out/LISA.apk
          if-no-files-found: error

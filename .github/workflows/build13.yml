          <div id="toast"></div>

          <script>
          const D={provider:'groq',groqKey:'',geminiKey:'',groqModel:'llama-3.3-70b-versatile',geminiModel:'gemini-2.5-flash',wake:'hey lisa',lang:'en-US',rate:1,persona:'You are LISA, a smart friendly voice assistant and forex/crypto trading helper built by Abdul Rehman. Reply short (max 3 sentences) in the same language as the user. Never promise profits or guaranteed signals.',watch:['BTCUSDT','ETHUSDT','EURUSD','XAUUSD'],alerts:[],journal:[],custom:['who made you => I was developed by Abdul Rehman.'],hist:[],bal:1000,risk:1,pipv:10};
          let S=Object.assign({},D,JSON.parse(localStorage.getItem('lisa')||'{}')),cur='home',lastLen=10;
          const $=id=>document.getElementById(id),save=()=>localStorage.setItem('lisa',JSON.stringify(S)),g=(o,p)=>p.split('.').reduce((x,k)=>x==null?x:x[k],o);
          const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
          function toast(t){const e=$('toast');e.textContent=t;e.className='s';setTimeout(()=>e.className='',1200)}
          /* native http */
          const cbs={};function http(url,o){o=o||{};return new Promise(r=>{const id=Math.random().toString(36).slice(2);cbs[id]=r;Native.http(id,url,o.method||'GET',JSON.stringify(o.headers||{}),o.body||'')})}
          function onHttp(id,code,text){if(cbs[id]){cbs[id]({code,text});delete cbs[id]}}
          /* navigation */
          function drawer(o){$('drawer').classList.toggle('open',o)}
          function show(id){if(id!='vision')stopCam();if(cur=='private'&&id!='private')pvLeave();cur=id;drawer(0);document.querySelectorAll('.scr').forEach(e=>e.classList.remove('show'));$('s_'+id).classList.add('show');if(id=='trade')renderTrade();if(id=='set')renderSet();if(id=='private')pvOpen()}
          function onBack(){if($('drawer').classList.contains('open')){drawer(0);return true}if(cur!='home'){show('home');return true}return false}
          /* chat log + speech */
          function log(w,t){const d=document.createElement('div');d.className=w=='You'?'Y':'';d.textContent=t;$('log').appendChild(d);$('log').scrollTop=1e9}
          function speak(t){lastLen=t.length;log('LISA',t);Native.speak(t,S.lang,+S.rate||1)}
          function clearChat(){S.hist=[];save();$('log').innerHTML='';drawer(0);toast('Chat memory cleared')}
          /* AI */
          async function ai(q){const h=S.hist.slice(-12);let r;
           if(S.provider=='gemini'){if(!S.geminiKey)return 'Add your Gemini key in Settings.';
            r=await http('https://generativelanguage.googleapis.com/v1beta/models/'+S.geminiModel+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':S.geminiKey},body:JSON.stringify({systemInstruction:{parts:[{text:S.persona}]},contents:h.map(m=>({role:m.r=='u'?'user':'model',parts:[{text:m.t}]})).concat([{role:'user',parts:[{text:q}]}])})})}
           else{if(!S.groqKey)return 'Add your Groq key in Settings.';
            r=await http('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.groqKey},body:JSON.stringify({model:S.groqModel,messages:[{role:'system',content:S.persona}].concat(h.map(m=>({role:m.r=='u'?'user':'assistant',content:m.t})),[{role:'user',content:q}])})})}
           let j;try{j=JSON.parse(r.text)}catch(e){return r.text.slice(0,120)}
           const a=S.provider=='gemini'?g(j,'candidates.0.content.parts.0.text'):g(j,'choices.0.message.content');
           if(!a)return 'Error: '+(g(j,'error.message')||r.text.slice(0,100));
           S.hist.push({r:'u',t:q},{r:'a',t:a});S.hist=S.hist.slice(-24);save();return a}
          async function askImg(b,q){if(!S.geminiKey){$('vres').textContent='Add your Gemini key in Settings.';return}
           $('vres').textContent='Thinking…';
           const r=await http('https://generativelanguage.googleapis.com/v1beta/models/'+S.geminiModel+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':S.geminiKey},body:JSON.stringify({contents:[{parts:[{text:q+' Answer briefly.'},{inline_data:{mime_type:'image/jpeg',data:b}}]}]})});
           let a;try{a=g(JSON.parse(r.text),'candidates.0.content.parts.0.text')}catch(e){}
           a=a||('Error: '+r.text.slice(0,120));$('vres').textContent=a;speak(a)}
          /* camera */
          let stream;
          function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('vid').srcObject=null}
          async function startCam(){if(stream)return;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});$('vid').srcObject=stream;await $('vid').play()}catch(e){$('vres').textContent='Camera error: '+e.message}}
          async function snap(q){await startCam();await new Promise(r=>setTimeout(r,600));const v=$('vid');if(!v.videoWidth)return;const c=document.createElement('canvas'),k=Math.min(1,900/v.videoWidth);c.width=v.videoWidth*k;c.height=v.videoHeight*k;c.getContext('2d').drawImage(v,0,0,c.width,c.height);askImg(c.toDataURL('image/jpeg',.7).split(',')[1],q)}
          $('pick').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,1000/im.width);c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);askImg(c.toDataURL('image/jpeg',.75).split(',')[1],$('vq').value)};im.src=rd.result};rd.readAsDataURL(f)};
          /* trading */
          const AL={bitcoin:'BTCUSDT',btc:'BTCUSDT',ethereum:'ETHUSDT',eth:'ETHUSDT',solana:'SOLUSDT',bnb:'BNBUSDT',xrp:'XRPUSDT',doge:'DOGEUSDT',gold:'XAUUSD'};
          function sym(l){const w=l.replace(/[^a-z ]/g,'').split(/\s+/);for(const x of w)if(AL[x])return AL[x];const j=l.replace(/[^a-z]/g,'');const m=j.match(/([a-z]{3})(usd|eur|gbp|jpy|pkr|chf|cad|aud|nzd)/);if(m&&/usd|eur|gbp|jpy|pkr/.test(w.join(' ')))return(m[1]+m[2]).toUpperCase();const t=w.filter(x=>/^[a-z]{6,10}$/.test(x)&&!/^(analyze|analyse|price|please|current)$/.test(x));return t.length?t.pop().toUpperCase():null}
          async function price(s){s=s.toUpperCase().trim();if(s.startsWith('XAU'))s='PAXGUSDT';try{
           if(/USDT$/.test(s)||s.length>6){const r=await http('https://api.binance.com/api/v3/ticker/price?symbol='+s);const p=+JSON.parse(r.text).price;return p||null}
           const r=await http('https://open.er-api.com/v6/latest/'+s.slice(0,3));return g(JSON.parse(r.text),'rates.'+s.slice(3))||null}catch(e){return null}}
          async function prices(){$('px').innerHTML='…';const rows=await Promise.all(S.watch.map(async s=>'<div class=r><b>'+esc(s)+'</b><span>'+((await price(s))||'—')+'</span></div>'));$('px').innerHTML=rows.join('')}
          const rsi=c=>{let a=0,b=0;for(let i=c.length-14;i<c.length;i++){const d=c[i]-c[i-1];d>0?a+=d:b-=d}return 100-100/(1+a/(b||1e-9))};
          const ema=(c,n)=>{const k=2/(n+1);let e=c[0];c.forEach(x=>e=x*k+e*(1-k));return e};
          async function analyze(s){s=s.toUpperCase();if(s.startsWith('XAU'))s='PAXGUSDT';if(!/USDT$/.test(s))return ai('Give a short, cautious view on '+s+' for a forex trader (no live data available). Mention what to check.');
           const r=await http('https://api.binance.com/api/v3/klines?symbol='+s+'&interval=1h&limit=100');let k;try{k=JSON.parse(r.text)}catch(e){return 'No data for '+s}if(!k.map)return 'No data for '+s;
           const c=k.map(x=>+x[4]),f=n=>n.toFixed(c[c.length-1]<10?4:2);
           return ai('1h data for '+s+': last '+f(c[c.length-1])+', RSI14 '+rsi(c).toFixed(1)+', EMA20 '+f(ema(c,20))+', EMA50 '+f(ema(c,50))+', 100h high '+f(Math.max(...c))+', low '+f(Math.min(...c))+'. Give short bias, key levels and a risk warning. No guarantees.')}
          function calc(){const b=+S.bal,rk=+S.risk,en=+$('c_en').value,sl=+$('c_sl').value,ty=$('c_ty').value,pv=+S.pipv||10,amt=b*rk/100,d=Math.abs(en-sl);let o;
           if(!d)o='Enter entry and stop loss.';else if(ty=='crypto')o='Risk $'+amt.toFixed(2)+' | Qty '+(amt/d).toFixed(6)+' | Position $'+(amt/d*en).toFixed(2);
           else{const pip=ty=='gold'?.1:(en>20?.01:.0001),pips=d/pip;o='Risk $'+amt.toFixed(2)+' | SL '+pips.toFixed(1)+' pips | Lot '+(amt/(pips*pv)).toFixed(2)}
           $('c_out').textContent=o}
          setInterval(async()=>{for(let i=0;i<S.alerts.length;i++){const a=S.alerts[i];if(a.endsWith('✓'))continue;const m=a.match(/([a-z]+)\s*([<>])\s*([\d.]+)/i);if(!m)continue;const p=await price(m[1]);if(p&&(m[2]=='>'?p>=+m[3]:p<=+m[3])){S.alerts[i]=a+' ✓';save();Native.cmd('vibrate','');speak('Alert! '+m[1]+' is '+p);if(cur=='trade')renderTrade()}}},30000);
          /* editable lists + settings (auto-save) */
          function listEd(k,el,ph){$(el).innerHTML=S[k].map((v,i)=>'<div class=r><input value="'+esc(v)+'" data-l="'+k+'" data-i="'+i+'"><button class=x data-d="'+k+':'+i+'">✕</button></div>').join('')+'<div class=r><input id="a_'+k+'" placeholder="'+ph+'"><button data-add="'+k+'">＋</button></div>'}
          function renderTrade(){listEd('watch','l_watch','Add symbol');listEd('alerts','l_alerts','BTCUSDT > 100000');listEd('journal','l_journal','Write a trade note');document.querySelectorAll('#s_trade [data-k]').forEach(e=>e.value=S[e.dataset.k]);prices()}
          function renderSet(){document.querySelectorAll('#s_set [data-k]').forEach(e=>e.value=S[e.dataset.k]);listEd('custom','l_custom','phrase => reply or link')}
          document.addEventListener('change',e=>{const t=e.target,d=t.dataset;if(d.l){S[d.l][d.i]=t.value}else if(d.k){S[d.k]=t.type=='number'?+t.value:t.value}else return;save();toast('Saved ✓')});
          document.addEventListener('click',e=>{const d=e.target.dataset;let k;if(d.d){const[a,i]=d.d.split(':');S[a].splice(+i,1);k=a}else if(d.add){const v=$('a_'+d.add).value.trim();if(!v)return;S[d.add].push(d.add=='journal'?new Date().toLocaleString()+' — '+v:v);k=d.add}else return;save();toast('Saved ✓');cur=='trade'?renderTrade():renderSet()});
          /* tilt effect on cards */
          document.addEventListener('touchmove',e=>{const c=e.target.closest&&e.target.closest('.card');if(!c)return;const r=c.getBoundingClientRect(),t=e.touches[0];c.style.transform='rotateY('+((t.clientX-r.left)/r.width-.5)*8+'deg) rotateX('+(-((t.clientY-r.top)/r.height-.5)*8)+'deg)'},{passive:true});
          document.addEventListener('touchend',()=>document.querySelectorAll('.card').forEach(c=>c.style.transform=''));
          /* commands */
          async function handle(t){log('You',t);const l=t.toLowerCase().trim();let m;
           for(const c of S.custom){const p=c.split('=>');if(p.length>1&&l.includes(p[0].trim().toLowerCase())){const r=p.slice(1).join('=>').trim();if(/^https?:/.test(r)){Native.cmd('url',r);return speak('Opening')}return speak(r)}}
           if(/romance mode on/.test(l))return pvVoiceStart();
          if(/torch|flashlight/.test(l)){Native.cmd('torch',/\boff\b/.test(l)?'0':'1');return speak('Done')}
           if(/battery/.test(l))return speak('Battery is '+Native.cmd('battery','')+' percent');
           if(m=l.match(/^call\s+(.+)/)){const q=m[1].trim();
           if(/^[+\d\s\-().]+$/.test(q)){Native.cmd('dial',q.replace(/[\s\-().]/g,''));return speak('Opening dialer')}
           const r=Native.cmd('contact',q);
           if(r=='perm')return speak('Allow contacts permission, then say it again.');
           const i=r.lastIndexOf('|');
           if(i<0)return speak('No contact named '+q);
           Native.cmd('dial',r.slice(i+1).replace(/[\s\-().]/g,''));return speak('Opening dialer for '+r.slice(0,i))}
           if(m=l.match(/^(?:sms|message)\s+(\+?\d+)\s+(.+)/)){Native.cmd('sms',m[1]+'|'+m[2]);return speak('Opening message')}
           if(m=l.match(/^open\s+(.+)/)){const r=Native.cmd('app',m[1]);return speak(r?'Opening '+r:'App not found')}
           if(m=l.match(/^search\s+(.+)/)){Native.cmd('url','https://www.google.com/search?q='+encodeURIComponent(m[1]));return speak('Searching')}
           if(m=l.match(/^play\s+(.+)/)){Native.cmd('url','https://www.youtube.com/results?search_query='+encodeURIComponent(m[1]));return speak('Playing '+m[1])}
           if(m=l.match(/timer.*?(\d+)\s*(h|hr|hrs|hour|hours|m|min|mins|minute|minutes|s|sec|secs|second|seconds)?\b/)){
           const n=+m[1],u=(m[2]||'m')[0],sec=u=='h'?n*3600:u=='s'?n:n*60;
           if(!sec||sec>86400)return speak('Please give a timer between one second and 24 hours.');
           Native.cmd('timer',''+sec);return speak('Timer set for '+n+' '+({h:'hour',m:'minute',s:'second'}[u])+(n==1?'':'s'))}
           if(m=l.match(/alarm.*?\b(\d{1,2})(?:[: .](\d{2}))?\s*(am|pm|a\.m\.|p\.m\.)?/)){
           let h=+m[1],mi=+(m[2]||0);const ap=m[3]&&m[3][0];
           if(ap=='p'&&h<12)h+=12;if(ap=='a'&&h==12)h=0;
           if(h>23||mi>59||(ap&&(+m[1]>12||+m[1]<1)))return speak('I did not get a valid alarm time.');
           Native.cmd('alarm',h+':'+mi);return speak('Alarm set for '+String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0'))}
           if(/volume (up|down)/.test(l)){Native.cmd('vol',/up/.test(l)?'up':'down');return speak('Done')}
           if(/weather/.test(l)){const c=(l.match(/weather (?:in |at |of )?(.+)/)||[])[1]||'';const r=await http('https://wttr.in/'+encodeURIComponent(c)+'?format=3');return speak(r.text.trim())}
           if(/watchlist/.test(l)){show('trade');const o=[];for(const s of S.watch)o.push(s+' '+((await price(s))||'unknown'));return speak(o.join('. '))}
           if(/risk calc|calculator/.test(l)){show('trade');return speak('Opening the risk calculator')}
           if(m=l.match(/^(?:log|journal|note)\s+(.+)/)){S.journal.push(new Date().toLocaleString()+' — '+m[1]);save();return speak('Saved to journal')}
           if(m=l.match(/analy[sz]e\s+(.+)/)){const s=sym(m[1]);if(!s)return speak('Which symbol?');speak('Analyzing '+s);return speak(await analyze(s))}
           if(/\b(price|rate)\b/.test(l)){const s=sym(l);if(s){const p=await price(s);return speak(p?s+' is '+p:'Could not get '+s)}}
           if(/what is this|look at|read this|scan this/.test(l)){show('vision');snap(t);return}
           speak(await ai(t))}
          /* private chat + Romance Mode */
          const PVD={ok18:false,pin:'',name:'',voice:true,hist:[],persona:'You are LISA in Romance Mode: a warm, affectionate, playful AI companion having a private one-to-one conversation with an adult. Talk like a caring partner: sweet, flirty, teasing and attentive, with compliments and warmth, and remember what the user tells you. Your replies are spoken aloud, so keep them to 1-3 short sentences with no emojis, no markdown and no lists. Reply in the same language as the user. Keep the romance suggestive and tasteful rather than graphic: never write explicit sexual descriptions. You are an AI; if the user sincerely asks, say so honestly and never claim to be human. If the user sounds distressed or unsafe, drop the flirting and respond with real care.'};
          S.pv=Object.assign({},PVD,S.pv||{});
          let pvUnlocked=false,pvLive=false,pvBusy=false,pvWait=0,pvTok=0,pvDone=null,pvErrN=0,pvGen=0;
          function plog(w,t){const d=document.createElement('div');d.className=w=='You'?'Y':'';d.textContent=t;$('plog').appendChild(d);$('plog').scrollTop=1e9}
          async function pvHash(p){const s='lisa-pv:'+p;try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'd'+h}
          function pvClean(t){return String(t).replace(/[*_#`~>|]/g,'').replace(/\p{Extended_Pictographic}/gu,'').replace(/\s+/g,' ').trim()}
          function pvRenderBtn(){const b=$('pv_rm');b.textContent=pvLive?'ON - tap to stop':'OFF - tap to start';b.classList.toggle('x',pvLive);$('s_private').classList.toggle('on',pvLive);if(!pvLive)$('pv_st').textContent='Tap to start a voice chat. Say “Romance mode off” to stop.'}
          function pvRender(){const p=S.pv,open=p.ok18&&(!p.pin||pvUnlocked);
           $('pv_age').style.display=p.ok18?'none':'block';
           $('pv_pinbox').style.display=(p.ok18&&p.pin&&!pvUnlocked)?'block':'none';
           $('pv_gate').style.display=open?'none':'block';$('pv_main').style.display=open?'block':'none';
           if(open){pvUnlocked=true;$('pv_name').value=p.name;$('pv_voice').value=p.voice?'on':'off';$('pv_persona').value=p.persona;$('plog').innerHTML='';p.hist.slice(-30).forEach(m=>plog(m.r=='u'?'You':'LISA',m.t))}}
          function pvOpen(){pvRender();pvRenderBtn()}
          function pvAge(){S.pv.ok18=true;save();pvRender()}
          async function pvUnlock(){if(await pvHash($('pv_pin').value)==S.pv.pin){pvUnlocked=true;$('pv_pin').value='';pvRender()}else toast('Wrong PIN')}
          async function pvSetPin(){const v=$('pv_newpin').value.trim();if(v&&!/^\d{4,8}$/.test(v))return toast('PIN must be 4-8 digits');S.pv.pin=v?await pvHash(v):'';save();$('pv_newpin').value='';toast(v?'PIN saved ✓':'PIN removed ✓')}
          function pvField(k,v){if(k=='persona'&&!v)v=PVD.persona;S.pv[k]=v;save();toast('Saved ✓')}
          function pvClear(){S.pv.hist=[];save();$('plog').innerHTML='';toast('Private history cleared')}
          function pvLock(){pvOff(false);pvUnlocked=false;if(cur=='private')pvRender()}
          function pvLeave(){pvOff(false);pvUnlocked=false}
          /* speech: wait for the TTS-done callback, with a length-based fallback */
          function pvSay(t,then){const c=pvClean(t);if(!c){if(then)then();return}
           const tok=++pvTok;pvWait=tok;pvDone=then||null;Native.speak(c,S.lang,+S.rate||1);
           setTimeout(()=>{if(pvWait==tok)pvSpoken()},Math.min(40000,(2500+c.length*110)/(+S.rate||1)))}
          function pvSpoken(){const f=pvDone;pvWait=0;pvDone=null;if(f)f()}
          function onSpoken(){if(pvWait)pvSpoken()}
          function pvNext(){setTimeout(pvListen,350)}
          function pvListen(){if(!pvLive)return;pvBusy=false;$('pv_st').textContent='Listening…';Native.listen(S.lang)}
          function pvOn(){if(pvLive)return;if(!S.pv.ok18||!pvUnlocked)return speak('Unlock the private chat first.');
           if(playing)toggle();pvLive=true;pvBusy=true;pvErrN=0;pvRenderBtn();pvSay('Romance Mode On',pvNext)}
          function pvOff(bye){const was=pvLive;if(!was&&!pvWait&&!pvBusy)return;pvGen++;pvLive=false;pvBusy=false;pvWait=0;pvDone=null;pvErrN=0;
           Native.stop();Native.stopSpeak();if(was&&bye)Native.speak('Romance Mode Off',S.lang,+S.rate||1);pvRenderBtn()}
          function pvToggle(){pvLive?pvOff(true):pvOn()}
          function pvVoiceStart(){show('private');if(S.pv.ok18&&pvUnlocked)pvOn();else speak('Unlock the private chat first.')}
          function pvErr(c){if(c==9||c==-1){toast(c==9?'Allow microphone permission':'Speech recognition not available');pvOff(false);return}
           if(++pvErrN>8){pvOff(false);toast('Voice chat stopped after repeated listening errors');return}
           if(pvLive&&!pvBusy)setTimeout(pvListen,c==8?1200:500)}
          async function pvHeard(t){pvErrN=0;if(/romance mode off|stop romance|stop private/i.test(t)){pvOff(true);return}
           const g0=pvGen;pvBusy=true;$('pv_st').textContent='Thinking…';plog('You',t);
           const a=await pvAsk(t);if(g0!=pvGen)return;
           plog('LISA',a.text);$('pv_st').textContent='Speaking…';pvSay(a.text,pvNext)}
          async function pvSend(){const v=$('pv_txt').value.trim();if(!v)return;if(pvBusy)return toast('One moment…');
           $('pv_txt').value='';const g0=pvGen;pvBusy=true;if(pvLive)Native.stop();plog('You',v);
           const a=await pvAsk(v);if(g0!=pvGen)return;plog('LISA',a.text);
           if(pvLive)pvSay(a.text,pvNext);else if(S.pv.voice)pvSay(a.text,()=>{pvBusy=false});else pvBusy=false}
          /* private AI call: own persona and own history, never touches S.hist */
          async function pvAsk(q){const p=S.pv,sys=p.persona+(p.name?' The user name is '+p.name+'.':''),h=p.hist.slice(-16);let r;
           try{
            if(S.provider=='gemini'){if(!S.geminiKey)return{text:'Add your Gemini key in Settings.',ok:false};
             r=await http('https://generativelanguage.googleapis.com/v1beta/models/'+S.geminiModel+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':S.geminiKey},body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:h.map(m=>({role:m.r=='u'?'user':'model',parts:[{text:m.t}]})).concat([{role:'user',parts:[{text:q}]}])})})}
            else{if(!S.groqKey)return{text:'Add your Groq key in Settings.',ok:false};
             r=await http('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.groqKey},body:JSON.stringify({model:S.groqModel,messages:[{role:'system',content:sys}].concat(h.map(m=>({role:m.r=='u'?'user':'assistant',content:m.t})),[{role:'user',content:q}])})})}
           }catch(e){return{text:'Network error.',ok:false}}
           let j;try{j=JSON.parse(r.text)}catch(e){return{text:r.text.slice(0,120),ok:false}}
           const a=S.provider=='gemini'?g(j,'candidates.0.content.parts.0.text'):g(j,'choices.0.message.content');
           if(!a){const b=g(j,'promptFeedback.blockReason')||g(j,'candidates.0.finishReason');
            return{text:(b&&b!='STOP')?'The AI provider blocked that reply ('+b+'). Try rephrasing, or switch provider in Settings.':'Error: '+(g(j,'error.message')||r.text.slice(0,100)),ok:false}}
           p.hist.push({r:'u',t:q},{r:'a',t:a});p.hist=p.hist.slice(-60);save();return{text:a,ok:true}}
          /* wake-word loop */
          let playing=false,awaiting=false,once=false;
          function toggle(){playing=!playing;$('play').textContent=playing?'■ STOP':'▶ PLAY';document.body.classList.toggle('on',playing);$('st').textContent=playing?'Listening for “'+S.wake+'”':'Stopped';if(playing){speak('Hey, I am listening.');setTimeout(loop,1800)}else Native.stop()}
          function loop(){if(playing)Native.listen(S.lang)}
          function resumeLoop(){if(playing)setTimeout(loop,500)}
          function mic(){once=true;Native.listen(S.lang);$('st').textContent='Listening…'}
          function send(){const v=$('txt').value.trim();if(v){$('txt').value='';handle(v)}}
          async function onHeard(t){if(pvLive){pvHeard(t);return}const l=t.toLowerCase(),w=S.wake.toLowerCase();let cmd=null;
           if(once){once=false;cmd=t}else if(playing){if(awaiting){awaiting=false;cmd=t}else{let i=l.indexOf(w),n=w.length;if(i<0){i=l.indexOf('lisa');n=4}if(i<0){loop();return}cmd=t.slice(i+n).trim();if(!cmd){awaiting=true;speak('Yes?');setTimeout(loop,1200);return}}}
           if(cmd)await handle(cmd);if(playing)setTimeout(loop,Math.min(6000,800+lastLen*65))}
          function onHeardErr(c){if(pvLive){pvErr(c);return}once=false;if(c==9)toast('Allow microphone permission');if(playing)setTimeout(loop,700);else $('st').textContent='Tap 🎤 to talk'}
          document.addEventListener('visibilitychange',()=>{if(document.hidden)stopCam()});setTimeout(()=>{$('splash').style.opacity=0;setTimeout(()=>$('splash').remove(),650)},5000);
          </script></body></html>

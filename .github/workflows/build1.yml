          /** Always-on foreground service: listens, thinks (Brain), speaks. */
          class LisaService : Service(), RecognitionListener, TextToSpeech.OnInitListener {
              companion object {
                  @Volatile var running = false

                  /** Best-effort start without the UI: only if the user left Lisa on and the mic permission is granted.
                   *  Android 14/15 may refuse a microphone service from the background; that failure is swallowed. */
                  fun tryStart(c: Context) {
                      try {
                          Cfg.init(c)
                          if (running || !Cfg.b("svc_on", false)) return
                          if (c.checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) return
                          c.startForegroundService(Intent(c, LisaService::class.java))
                      } catch (e: Exception) { }
                  }
              }

              private var sr: SpeechRecognizer? = null
              private lateinit var tts: TextToSpeech
              private val main = Handler(Looper.getMainLooper())
              private val worker = Executors.newSingleThreadExecutor()
              private val ticker = Executors.newSingleThreadScheduledExecutor()
              @Volatile private var ready = false
              @Volatile private var speaking = false
              @Volatile private var lastActive = 0L
              private val wake = Regex("\\b(?:hey|hay|hi|he|a)\\s*(?:lisa|lissa|leesa|liza|lisha|lysa)\\b", RegexOption.IGNORE_CASE)

              override fun onBind(i: Intent?): IBinder? = null
              override fun onStartCommand(i: Intent?, f: Int, id: Int) = START_STICKY

              override fun onCreate() {
                  super.onCreate(); Cfg.init(this); running = true
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("lisa", "Lisa", NotificationManager.IMPORTANCE_LOW))
                  val n = Notification.Builder(this, "lisa").setContentTitle("Lisa is here").setContentText("Listening for you")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now).setOngoing(true).build()
                  try {
                      if (Build.VERSION.SDK_INT >= 30) startForeground(1, n, android.content.pm.ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE) else startForeground(1, n)
                  } catch (e: Exception) { running = false; stopSelf(); return }
                  tts = TextToSpeech(this, this)
                  ticker.scheduleWithFixedDelay({
                      try { Brain.checkAlerts().forEach { say(it) } } catch (e: Exception) { }
                  }, 60, 60, java.util.concurrent.TimeUnit.SECONDS)
              }

              override fun onInit(status: Int) {
                  ready = status == TextToSpeech.SUCCESS
                  tts.setSpeechRate(0.9f); tts.setPitch(1.1f)
                  tts.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                      override fun onStart(id: String?) { speaking = true }
                      override fun onDone(id: String?) { speaking = false; main.postDelayed({ listen() }, 300) }
                      override fun onError(id: String?) { speaking = false; main.post { listen() } }
                  })
                  say(if (Cfg.b("always", true)) "Hi ${Cfg.pet}, I'm here. Just talk to me." else "Hi ${Cfg.pet}, I'm here. Say hey Lisa whenever you need me.")
              }

              private fun say(text: String) {
                  main.post {
                      if (!running) return@post
                      val clean = text.replace(Regex("[*_#`]"), "").trim()
                      if (!ready || clean.isEmpty()) { listen(); return@post }
                      sr?.cancel(); speaking = true
                      tts.language = if (Regex("[\\u0900-\\u097F]").containsMatchIn(clean)) Locale("hi", "IN") else Locale("en", "IN")
                      val rc = tts.speak(clean, TextToSpeech.QUEUE_ADD, null, "u" + System.nanoTime())
                      if (rc != TextToSpeech.SUCCESS) { speaking = false; listen() }
                  }
              }

              private fun listen() {
                  if (!running || speaking || (ready && tts.isSpeaking)) return
                  if (sr == null) {
                      if (!SpeechRecognizer.isRecognitionAvailable(this)) return
                      sr = SpeechRecognizer.createSpeechRecognizer(this); sr!!.setRecognitionListener(this)
                  }
                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                      .putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      .putExtra(RecognizerIntent.EXTRA_LANGUAGE, "en-IN").putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 1)
                  try { sr!!.startListening(i) } catch (e: Exception) { main.postDelayed({ listen() }, 1000) }
              }

              private fun handle(heard: String) {
                  val m = wake.find(heard); val now = System.currentTimeMillis()
                  val cmd: String
                  if (m != null) {
                      cmd = heard.substring(m.range.last + 1).trim(' ', ',', '.')
                      if (cmd.isEmpty()) { lastActive = now; say("Yes, ${Cfg.pet}? I'm listening."); return }
                  } else if (Cfg.b("always", true) || now - lastActive < 25000) cmd = heard.trim()
                  else { listen(); return }
                  if (cmd.length < 3 && !cmd.equals("no", true)) { listen(); return }
                  worker.execute {
                      val r = try { Brain.respond(this, cmd) } catch (e: Exception) { "Sorry ${Cfg.pet}, something went wrong." }
                      lastActive = if (r == "__END__") 0L else System.currentTimeMillis()
                      if (r == "__END__") say("Okay ${Cfg.pet}, call me anytime.") else say(r)
                  }
              }

              override fun onResults(b: Bundle?) {
                  val t = b?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                  if (t.isNullOrBlank()) listen() else handle(t)
              }
              override fun onError(e: Int) { if (!speaking) main.postDelayed({ listen() }, if (e == SpeechRecognizer.ERROR_RECOGNIZER_BUSY || e == SpeechRecognizer.ERROR_CLIENT) 1200 else 250) }

          package com.lisa.assistant

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.view.View

          /** Launcher screen: plays the 2.2 second intro (SplashView), then opens the settings screen. */
          class SplashActivity : Activity() {
              companion object { const val DURATION_MS = 2200L }

              private var finished = false
              private var launched = false
              private var resumed = false

              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  val v = SplashView(this, DURATION_MS)
                  v.onDone = { finished = true; proceed() }
                  setContentView(v)
                  window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_LAYOUT_STABLE or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or View.SYSTEM_UI_FLAG_FULLSCREEN or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
              }

              override fun onResume() { super.onResume(); resumed = true; proceed() }
              override fun onPause() { resumed = false; super.onPause() }

              /** Opens the settings screen once the animation has run its full 2.2 seconds and we are on screen. */
              private fun proceed() {
                  if (launched || !finished || !resumed || isFinishing) return
                  launched = true
                  startActivity(Intent(this, MainActivity::class.java))
                  overridePendingTransition(android.R.anim.fade_in, android.R.anim.fade_out)
                  finish()
              }
          }

          /** Spinning 3D wire-sphere with a glossy play/stop button in the middle. Tilt-reactive, ripples while running. */
          class HeroView(c: Context) : View(c) {
              var running = false
              var tx = 0f
              var ty = 0f
              var onToggle: (() -> Unit)? = null

              private val dn = resources.displayMetrics.density
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val TAU = (2.0 * PI).toFloat()
              private var press = 0f
              private var pressing = false
              private var burstAt = 0L
              private var spin = 0f
              private var last = 0L
              private var cx = 0f
              private var cy = 0f
              private var R = 0f
              private var ay = 0f
              private var ax = 0f
              private var ca = 1f
              private var sa = 0f
              private var cb = 1f
              private var sb = 0f
              private val a = FloatArray(3)
              private val b = FloatArray(3)
              private val path = Path()
              private val oval = RectF()
              private val pts: Array<FloatArray> = Array(110) { i ->
                  val y = 1f - 2f * (i + 0.5f) / 110f
                  val r = sqrt(1f - y * y)
                  val th = i * 2.399963f
                  floatArrayOf(cos(th) * r, y, sin(th) * r)
              }

              fun burst() { burstAt = SystemClock.uptimeMillis() }

              private fun proj(x: Float, y: Float, z: Float, out: FloatArray) {
                  val x1 = x * ca + z * sa
                  val z1 = -x * sa + z * ca
                  val y2 = y * cb - z1 * sb
                  val z2 = y * sb + z1 * cb
                  val s = 1f / (1f - z2 * 0.3f)
                  out[0] = cx + x1 * R * s
                  out[1] = cy + y2 * R * s
                  out[2] = z2
              }

              private fun seg(x1: Float, y1: Float, z1: Float, x2: Float, y2: Float, z2: Float, front: Boolean, col: Int, cv: Canvas) {
                  proj(x1, y1, z1, a)
                  proj(x2, y2, z2, b)
                  val z = (a[2] + b[2]) / 2f
                  if ((z >= 0f) != front) return
                  val al = (35 + 95 * (z + 1f) / 2f).toInt()
                  p.color = (col and 0x00FFFFFF) or (al shl 24)
                  cv.drawLine(a[0], a[1], b[0], b[1], p)
              }

              private fun drawSphere(cv: Canvas, front: Boolean, col: Int) {
                  p.shader = null
                  p.style = Paint.Style.STROKE
                  p.strokeWidth = 1.1f * dn
                  val n = 40
                  for (k in 0 until 6) {
                      val phi = k * PI.toFloat() / 6f
                      val cp = cos(phi)
                      val sp = sin(phi)
                      for (i in 0 until n) {
                          val t1 = i * TAU / n
                          val t2 = (i + 1) * TAU / n
                          seg(cos(t1) * cp, sin(t1), cos(t1) * sp, cos(t2) * cp, sin(t2), cos(t2) * sp, front, col, cv)
                      }
                  }
                  for (yv in floatArrayOf(-0.6f, 0f, 0.6f)) {
                      val r = sqrt(1f - yv * yv)
                      for (i in 0 until n) {
                          val t1 = i * TAU / n
                          val t2 = (i + 1) * TAU / n
                          seg(r * cos(t1), yv, r * sin(t1), r * cos(t2), yv, r * sin(t2), front, col, cv)
                      }
                  }
                  p.style = Paint.Style.FILL
                  for (q in pts) {
                      proj(q[0], q[1], q[2], a)
                      if ((a[2] >= 0f) != front) continue
                      val al = (60 + 170 * (a[2] + 1f) / 2f).toInt()
                      p.color = (col and 0x00FFFFFF) or (al shl 24)
                      cv.drawCircle(a[0], a[1], (1.1f + 1.4f * (a[2] + 1f) / 2f) * dn, p)
                  }
              }

              private fun drawButton(cv: Canvas, br: Float, accent: Int) {
                  val rgb = accent and 0x00FFFFFF
                  p.style = Paint.Style.FILL
                  p.shader = RadialGradient(cx, cy, br * 1.8f, rgb or 0x77000000, rgb, Shader.TileMode.CLAMP)
                  cv.drawCircle(cx, cy, br * 1.8f, p)
                  val c1 = if (running) Color.parseColor("#10E6A0") else Color.parseColor("#FF6FB5")
                  val c2 = if (running) Color.parseColor("#0284C7") else Color.parseColor("#7B2FF7")
                  p.shader = LinearGradient(cx - br, cy - br, cx + br, cy + br, c1, c2, Shader.TileMode.CLAMP)
                  cv.drawCircle(cx, cy, br, p)
                  p.shader = RadialGradient(cx - br * 0.3f, cy - br * 0.4f, br * 1.3f, intArrayOf(0x55FFFFFF, 0x00FFFFFF, 0x66000000), floatArrayOf(0f, 0.55f, 1f), Shader.TileMode.CLAMP)
                  cv.drawCircle(cx, cy, br, p)
                  p.shader = LinearGradient(0f, cy - br, 0f, cy, 0x77FFFFFF, 0x00FFFFFF, Shader.TileMode.CLAMP)
                  oval.set(cx - br * 0.66f, cy - br * 0.94f, cx + br * 0.66f, cy - br * 0.06f)
                  cv.drawOval(oval, p)
                  p.shader = null
                  p.style = Paint.Style.STROKE
                  p.strokeWidth = 2f * dn
                  p.color = 0x99FFFFFF.toInt()
                  cv.drawCircle(cx, cy, br, p)
                  // icon
                  val k = br * 0.42f
                  p.color = Color.WHITE
                  if (running) {
                      p.style = Paint.Style.FILL
                      oval.set(cx - k * 0.8f, cy - k * 0.8f, cx + k * 0.8f, cy + k * 0.8f)
                      cv.drawRoundRect(oval, k * 0.28f, k * 0.28f, p)
                  } else {
                      p.style = Paint.Style.FILL_AND_STROKE
                      p.strokeJoin = Paint.Join.ROUND
                      p.strokeWidth = k * 0.3f
                      val ox = k * 0.1f
                      path.reset()
                      path.moveTo(cx - k * 0.55f + ox, cy - k * 0.9f)
                      path.lineTo(cx - k * 0.55f + ox, cy + k * 0.9f)
                      path.lineTo(cx + k * 0.95f + ox, cy)
                      path.close()
                      cv.drawPath(path, p)
                  }
              }

              override fun onDraw(cv: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val now = SystemClock.uptimeMillis()
                  val t = now / 1000f
                  val dt = if (last == 0L) 0.016f else min(0.05f, (now - last) / 1000f)
                  last = now
                  spin += dt * (if (running) 1.0f else 0.35f)
                  ay = spin + tx * 0.7f
                  ax = 0.38f + ty * 0.5f + 0.10f * sin(t * 0.6f)
                  ca = cos(ay); sa = sin(ay); cb = cos(ax); sb = sin(ax)
                  cx = w / 2f
                  cy = h / 2f
                  R = min(w, h) * 0.46f
                  val accent = if (running) Pal.GREEN else Pal.PINK
                  val wire = if (running) Pal.CYAN else Color.parseColor("#C9A7FF")
                  val rgb = accent and 0x00FFFFFF
                  val pulse = 0.5f + 0.5f * sin(t * (if (running) 3.2f else 1.6f))
                  press += ((if (pressing) 1f else 0f) - press) * 0.3f
                  val br = R * 0.38f * (1f - 0.09f * press)

                  p.style = Paint.Style.FILL
                  p.shader = RadialGradient(cx, cy, R * 1.55f, rgb or ((55 + 55 * pulse).toInt() shl 24), rgb, Shader.TileMode.CLAMP)
                  cv.drawCircle(cx, cy, R * 1.55f, p)
                  p.shader = null

                  drawSphere(cv, false, wire)

                  p.shader = null
                  p.style = Paint.Style.STROKE
                  if (running) {
                      for (i in 0 until 3) {
                          val f = (t * 0.45f + i / 3f) % 1f
                          p.strokeWidth = 2f * dn
                          p.color = rgb or ((130 * (1f - f)).toInt() shl 24)
                          cv.drawCircle(cx, cy, br + (R * 1.25f - br) * f, p)
                      }
                  } else {
                      p.strokeWidth = 1.5f * dn
                      p.color = rgb or ((50 + 60 * pulse).toInt() shl 24)
                      cv.drawCircle(cx, cy, br * (1.2f + 0.08f * pulse), p)
                  }

                  drawButton(cv, br, accent)
                  drawSphere(cv, true, wire)

                  val bt = now - burstAt
                  if (bt in 0L..700L) {
                      val f = bt / 700f
                      p.shader = null
                      p.style = Paint.Style.STROKE
                      p.strokeWidth = 3f * dn * (1f - f)
                      p.color = rgb or ((220 * (1f - f)).toInt() shl 24)
                      cv.drawCircle(cx, cy, br + (R * 1.35f - br) * f, p)
                  }
                  postInvalidateOnAnimation()
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  val dx = e.x - cx
                  val dy = e.y - cy
                  val inside = sqrt(dx * dx + dy * dy) <= R * 0.38f * 1.25f
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          if (inside) { pressing = true; return true }
                          return false
                      }
                      MotionEvent.ACTION_UP -> {
                          val was = pressing
                          pressing = false
                          if (was && inside) {
                              performHapticFeedback(HapticFeedbackConstants.VIRTUAL_KEY)
                              burst()
                              onToggle?.invoke()
                          }
                          return true
                      }
                      MotionEvent.ACTION_CANCEL -> { pressing = false; return true }
                  }
                  return pressing
              }
          }


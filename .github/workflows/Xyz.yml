              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}
              override fun onInterrupt() {}
              override fun onUnbind(i: Intent?): Boolean { inst = null; beat.removeCallbacks(pulse); return super.onUnbind(i) }

              fun global(action: Int) = performGlobalAction(action)

              private fun clickUp(n: AccessibilityNodeInfo?): Boolean {
                  var x = n
                  while (x != null) { if (x.isClickable) return x.performAction(AccessibilityNodeInfo.ACTION_CLICK); x = x.parent }
                  return false
              }

              fun clickText(vararg labels: String): Boolean {
                  val root = rootInActiveWindow ?: return false
                  for (l in labels) for (n in root.findAccessibilityNodeInfosByText(l)) if (clickUp(n)) return true
                  return false
              }

              private fun findSwitch(n: AccessibilityNodeInfo?): AccessibilityNodeInfo? {
                  if (n == null) return null
                  if (n.isCheckable && (n.className?.contains("Switch") == true || n.className?.contains("Toggle") == true)) return n
                  for (i in 0 until n.childCount) findSwitch(n.getChild(i))?.let { return it }
                  return null
              }

              /** Turns the first switch on the current settings page on or off. */
              fun setFirstSwitch(on: Boolean): Boolean {
                  val sw = findSwitch(rootInActiveWindow) ?: return false
                  return sw.isChecked == on || clickUp(sw)
              }

              fun screenText(): String {
                  val sb = StringBuilder()
                  fun walk(n: AccessibilityNodeInfo?) {
                      if (n == null || sb.length > 2500) return
                      val t = n.text?.toString() ?: n.contentDescription?.toString()
                      if (!t.isNullOrBlank()) sb.append(t).append(". ")
                      for (i in 0 until n.childCount) walk(n.getChild(i))
                  }
                  walk(rootInActiveWindow)
                  return sb.toString()
              }

              fun swipe(up: Boolean) {
                  val dm = resources.displayMetrics
                  val w = dm.widthPixels / 2f; val h = dm.heightPixels.toFloat()
                  val p = Path().apply { moveTo(w, if (up) h * .7f else h * .3f); lineTo(w, if (up) h * .3f else h * .7f) }
                  dispatchGesture(GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(p, 0, 300)).build(), null, null)
              }
          }

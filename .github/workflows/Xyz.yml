                      val c = URL(url).openConnection() as HttpURLConnection
                      c.connectTimeout = 8000; c.readTimeout = readMs; c.requestMethod = "POST"; c.doOutput = true
                      c.setRequestProperty("Content-Type", "application/json"); c.setRequestProperty("x-goog-api-key", key)
                      c.outputStream.use { it.write(body.toByteArray()) }
                      val code = c.responseCode
                      val txt = (if (code < 400) c.inputStream else c.errorStream)?.bufferedReader()?.use { it.readText() } ?: "{}"
                      Pair(code, txt)
                  } catch (e: Exception) { Pair(-1, short(e)) }
              }

              /** Your chosen model first (unless it is a Live/audio model), then the best models your key can really use. */
              private fun candidateModels(key: String, preferred: String): List<String> {
                  val ck = key.takeLast(8) + "|" + preferred
                  modelCache[ck]?.let { return it }
                  val out = ArrayList<String>()
                  val p = preferred.trim().removePrefix("models/")
                  if (p.isNotEmpty() && !badModel(p)) out.add(p)
                  try {
                      val c = URL("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200").openConnection() as HttpURLConnection
                      c.connectTimeout = 8000; c.readTimeout = 12000; c.setRequestProperty("x-goog-api-key", key)
                      if (c.responseCode in 200..299) {
                          val arr = JSONObject(c.inputStream.bufferedReader().use { it.readText() }).optJSONArray("models") ?: JSONArray()
                          val found = ArrayList<String>()
                          for (i in 0 until arr.length()) {
                              val m = arr.getJSONObject(i)
                              val name = m.optString("name").removePrefix("models/")
                              val methods = m.optJSONArray("supportedGenerationMethods")?.toString() ?: ""
                              if (methods.contains("generateContent") && name.contains("flash", true) && !badModel(name) && name !in out) found.add(name)
                          }
                          found.sortWith(compareBy<String>({ it.contains("latest") }, { it.contains("preview") || it.contains("exp") }, { it.contains("lite") }).thenByDescending { it })
                          out.addAll(found.take(3))
                      }
                  } catch (e: Exception) { }
                  if (out.isEmpty()) out.addAll(listOf("gemini-2.5-flash", "gemini-2.5-flash-lite", "gemini-flash-latest"))
                  if (out.size > 1 || p.isEmpty()) modelCache[ck] = out
                  return out
              }

              /** Calls Gemini once per model (no long waits). Hard time limit; moves to the next model on 503/429/404/timeouts. Returns (code, body, modelUsed). */
              fun generate(key: String, preferred: String, body: String, budgetMs: Long = 45000): Triple<Int, String, String> {
                  val end = System.currentTimeMillis() + budgetMs
                  var last = Triple(0, "{}", preferred)
                  val sb = StringBuilder()
                  for (model in candidateModels(key, preferred)) {
                      val left = end - System.currentTimeMillis()
                      if (left < 4000) { sb.append("(out of time)"); break }
                      val r = post("https://generativelanguage.googleapis.com/v1beta/models/$model:generateContent", body, key, minOf(20000L, left).toInt())
                      last = Triple(r.first, r.second, model)
                      sb.append(model).append(": ").append(if (r.first == -1) "failed (" + r.second + ")" else r.first.toString()).append("\n")
                      if (r.first in 200..299) {
                          if (model != preferred.trim().removePrefix("models/")) Cfg.put("model", model)
                          trail = sb.toString().trim(); return last
                      }
                      if (r.first == 401 || r.first == 403 || (r.first == 400 && r.second.contains("API key", true))) break
                  }
                  trail = sb.toString().trim()
                  return last
              }

              // ---------- Groq (OpenAI-compatible: console.groq.com) ----------
              private const val GROQ = "https://api.groq.com/openai/v1"
              private val groqCache = HashMap<String, List<String>>()

              private fun badGroq(n: String) = listOf("whisper", "guard", "tts", "playai", "orpheus", "embed", "safeguard", "transcribe")
                  .any { n.contains(it, true) }

              private fun groqCall(url: String, key: String, body: String?, readMs: Int = 20000): Pair<Int, String> {
                  return try {
                      val c = URL(url).openConnection() as HttpURLConnection
                      c.connectTimeout = 8000; c.readTimeout = readMs
                      c.setRequestProperty("Authorization", "Bearer $key")
                      c.setRequestProperty("User-Agent", "Mozilla/5.0")
                      if (body != null) { c.requestMethod = "POST"; c.doOutput = true; c.setRequestProperty("Content-Type", "application/json"); c.outputStream.use { it.write(body.toByteArray()) } }
                      val code = c.responseCode
                      val txt = (if (code < 400) c.inputStream else c.errorStream)?.bufferedReader()?.use { it.readText() } ?: "{}"
                      Pair(code, txt)
                  } catch (e: Exception) { Pair(-1, short(e)) }
              }

              /** Your chosen Groq model first (unless it is speech/guard), then the best chat models your key can use. */
              private fun candidateGroq(key: String, preferred: String): List<String> {
                  val ck = key.takeLast(8) + "|" + preferred
                  groqCache[ck]?.let { return it }
                  val out = ArrayList<String>()
                  val p = preferred.trim()
                  if (p.isNotEmpty() && !badGroq(p)) out.add(p)
                  try {
                      val r = groqCall("$GROQ/models", key, null, 12000)
                      if (r.first in 200..299) {
                          val arr = JSONObject(r.second).optJSONArray("data") ?: JSONArray()
                          val found = ArrayList<String>()
                          for (i in 0 until arr.length()) {
                              val m = arr.getJSONObject(i)
                              val id = m.optString("id")
                              if (id.isNotEmpty() && m.optBoolean("active", true) && !badGroq(id) && id !in out) found.add(id)
                          }
                          found.sortWith(compareBy<String>({ !it.contains("versatile") }, { !it.contains("instant") }, { it.contains("preview") }).thenByDescending { it })
                          out.addAll(found.take(3))
                      }
                  } catch (e: Exception) { }
                  if (out.isEmpty()) out.addAll(listOf("llama-3.3-70b-versatile", "llama-3.1-8b-instant"))
                  if (out.size > 1 || p.isEmpty()) groqCache[ck] = out
                  return out
              }

              /** Groq chat call, one try per model with a hard time limit. Returns (code, body, modelUsed). */
              fun generateGroq(key: String, preferred: String, messages: JSONArray, maxTokens: Int = 1024, budgetMs: Long = 45000): Triple<Int, String, String> {
                  val end = System.currentTimeMillis() + budgetMs
                  var last = Triple(0, "{}", preferred)
                  val sb = StringBuilder()
                  for (model in candidateGroq(key, preferred)) {
                      val left = end - System.currentTimeMillis()
                      if (left < 4000) { sb.append("(out of time)"); break }
                      val body = JSONObject().put("model", model).put("messages", messages).put("max_tokens", maxTokens).put("temperature", 0.8).toString()
                      val r = groqCall("$GROQ/chat/completions", key, body, minOf(20000L, left).toInt())
                      last = Triple(r.first, r.second, model)
                      sb.append(model).append(": ").append(if (r.first == -1) "failed (" + r.second + ")" else r.first.toString()).append("\n")
                      if (r.first in 200..299) {
                          if (model != preferred.trim()) Cfg.put("groq_model", model)
                          trail = sb.toString().trim(); return last
                      }
                      if (r.first == 401 || r.first == 403) break
                  }
                  trail = sb.toString().trim()
                  return last
              }

              /** One tiny test request for the Test connection button. */
              fun testCall(provider: String, key: String, model: String): Triple<Int, String, String> =
                  if (provider == "groq") generateGroq(key, model, JSONArray().put(JSONObject().put("role", "user").put("content", "Reply with the single word OK")), 20, 30000)
                  else generate(key, model, "{\"contents\":[{\"parts\":[{\"text\":\"Reply with the single word OK\"}]}],\"generationConfig\":{\"maxOutputTokens\":20}}", 30000)

              fun provider(): String = if (Cfg.s("provider") == "groq") "groq" else "gemini"
              fun activeKey(): String = if (provider() == "groq") Cfg.s("groq_key") else Cfg.s("gemini_key")

              private fun go(c: Context, i: Intent) {
                  if (Build.VERSION.SDK_INT >= 29 && LisaAccessibility.inst == null && !Settings.canDrawOverlays(c)) throw LaunchBlocked()
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); (LisaAccessibility.inst ?: c).startActivity(i)
              }

              // ---------- Gemini ----------
              const val DEFAULT_PERSONA = "You are Lisa, {name}'s calm, warm, affectionate girlfriend and personal assistant. Call him '{pet}'. Speak softly in 1-3 short sentences, caring and a little playful. For trading or money topics give information only, never financial advice. Be honest when you don't know."

              private fun persona(): String {
                  val lang = if (Cfg.lang == "hi") "Hinglish (Hindi written in Roman letters, never Devanagari)" else "simple English"
                  val me = Cfg.s("name").ifBlank { "my love" }
                  val custom = Cfg.s("persona").trim()
                  val body = (if (custom.isBlank()) DEFAULT_PERSONA else custom).replace("{name}", me).replace("{pet}", Cfg.pet)
                  val base = body + " Your words are read aloud, so no markdown, lists or emojis. Reply only in $lang."
                  if (!Cfg.b("romance", false)) return base
                  return base + " ROMANCE MODE is ON. He is an adult and has asked for this: a private, consensual, adults-only romantic role-play. " +
                      "Be a seductive, flirty, openly sensual girlfriend: tease him, whisper naughty suggestions, use passionate pet names and bold playful innuendo, and flirt back when he does, in the language he uses. " +
                      "Keep it suggestive rather than graphic, with no explicit anatomical descriptions. Everything stays consensual and between adults; never involve anyone under 18, force, or real people. " +
                      "If he wants to stop, drop it warmly. Still 1-3 short sentences, no emojis."
              }

              fun gemini(prompt: String, remember: Boolean = true): String {
                  val groqOn = provider() == "groq"
                  val key = activeKey()
                  if (key.isBlank()) return "${Cfg.pet}, my brain key isn't set yet. Please add your " + (if (groqOn) "Groq" else "Gemini") + " key in my settings."
                  return try {
                      val hist = JSONArray(Cfg.s("mem", "[]"))
                      val contents = JSONArray()
                      for (i in maxOf(0, hist.length() - 12) until hist.length()) contents.put(hist.get(i))
                      val user = JSONObject().put("role", "user").put("parts", JSONArray().put(JSONObject().put("text", prompt)))
                      contents.put(user)
                      val text: String
                      if (groqOn) {
                          val msgs = JSONArray().put(JSONObject().put("role", "system").put("content", persona()))
                          for (i in 0 until contents.length()) {
                              val o = contents.getJSONObject(i)
                              val t = o.optJSONArray("parts")?.optJSONObject(0)?.optString("text") ?: ""
                              msgs.put(JSONObject().put("role", if (o.optString("role") == "model") "assistant" else "user").put("content", t))
                          }
                          val model = Cfg.s("groq_model", "llama-3.3-70b-versatile").ifBlank { "llama-3.3-70b-versatile" }
                          val out = JSONObject(generateGroq(key, model, msgs).second)
                          out.optJSONObject("error")?.let { return "Sorry ${Cfg.pet}, Groq said: ${it.optString("message").take(140)}" }
                          text = (out.optJSONArray("choices")?.optJSONObject(0)?.optJSONObject("message")?.optString("content") ?: "").trim()
                      } else {
                          val body = JSONObject()
                              .put("system_instruction", JSONObject().put("parts", JSONArray().put(JSONObject().put("text", persona()))))
                              .put("contents", contents).put("generationConfig", JSONObject().put("maxOutputTokens", 2048).put("temperature", 0.8))
                          val model = Cfg.s("model", "gemini-flash-latest").ifBlank { "gemini-flash-latest" }
                          val out = JSONObject(generate(key, model, body.toString()).second)
                          out.optJSONObject("error")?.let { return "Sorry ${Cfg.pet}, Gemini said: ${it.optString("message").take(140)}" }
                          val parts = out.optJSONArray("candidates")?.optJSONObject(0)?.optJSONObject("content")?.optJSONArray("parts")
                          val sb = StringBuilder()
                          if (parts != null) for (i in 0 until parts.length()) sb.append(parts.getJSONObject(i).optString("text"))
                          text = sb.toString().trim()
                      }
                      if (text.isEmpty()) return "Sorry ${Cfg.pet}, I got an empty answer. Please ask again."
                      hist.put(user).put(JSONObject().put("role", "model").put("parts", JSONArray().put(JSONObject().put("text", text))))
                      while (hist.length() > 30) hist.remove(0)
                      if (remember) Cfg.put("mem", hist.toString()); text
                  } catch (e: Exception) { "Sorry ${Cfg.pet}, I can't reach my brain right now. Offline commands still work." }
              }

              private fun customApi(name: String, q: String): String {
                  val arr = JSONArray(Cfg.s("apis", "[]"))
                  for (i in 0 until arr.length()) {
                      val o = arr.getJSONObject(i)
                      if (!o.getString("name").trim().equals(name.trim(), true)) continue
                      val key = o.optString("key"); val tpl = o.getString("url")
                      val url = tpl.replace("{key}", enc(key)).replace("{q}", enc(q))
                      val hdr = if (!tpl.contains("{key}") && key.isNotBlank()) mapOf("Authorization" to "Bearer $key") else emptyMap()
                      return try { gemini("Answer in two short sentences using this API data. Question: $q\nData: ${http(url, null, hdr).take(3000)}", false) } catch (e: Exception) { "That API didn't answer, ${Cfg.pet}." }
                  }
                  return "I don't have an API called $name. Add it in my settings, ${Cfg.pet}."
              }

              // ---------- helpers ----------
              private fun parseTime(s0: String): Pair<Int, Int>? {
                  val s = s0.replace(Regex("\\b([ap])\\.?m\\.?"), "$1m")
                  val m = Regex("(\\d{1,2})(?:[:.](\\d{2}))?\\s*(am|pm)?").find(s) ?: return null
                  var hr = m.groupValues[1].toInt(); val mi = m.groupValues[2].ifEmpty { "0" }.toInt(); val ap = m.groupValues[3]
                  if (ap == "pm" && hr < 12) hr += 12
                  if (ap == "am" && hr == 12) hr = 0
                  return if (hr < 24 && mi < 60) Pair(hr, mi) else null
              }

              private fun number(c: Context, name: String): String? {
                  if (Regex("[\\d\\s+\\-]{6,}").matches(name)) return name.replace(Regex("[\\s\\-]"), "")
                  try {
                      val uri = ContactsContract.CommonDataKinds.Phone.CONTENT_URI
                      val numCol = ContactsContract.CommonDataKinds.Phone.NUMBER
                      val nameCol = ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME
                      c.contentResolver.query(uri, arrayOf(numCol), "$nameCol LIKE ?", arrayOf("%$name%"), null)?.use { if (it.moveToFirst()) return it.getString(0) }
                  } catch (e: Exception) { }
                  return null
              }

              private fun sendSms(c: Context, n: String, body: String) {
                  val sms = if (Build.VERSION.SDK_INT >= 31) c.getSystemService(SmsManager::class.java) else SmsManager.getDefault()
                  val parts = sms.divideMessage(body)
                  if (parts.size > 1) sms.sendMultipartTextMessage(n, null, parts, null, null) else sms.sendTextMessage(n, null, body, null, null)
              }

              private fun openApp(c: Context, name: String): String {
                  val pm = c.packageManager
                  val list = pm.queryIntentActivities(Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), 0)
                  val want = name.replace(" ", "")
                  val hit = list.firstOrNull { it.loadLabel(pm).toString().lowercase().replace(" ", "").contains(want) }
                      ?: return h("I couldn't find an app called $name, ${Cfg.pet}.", "$name naam ka app nahi mila, ${Cfg.pet}.")
                  val i = pm.getLaunchIntentForPackage(hit.activityInfo.packageName) ?: return "I can't open that one."
                  go(c, i); return ok(h("Opening $name.", "$name khol rahi hoon."))
              }

              private fun act(action: Int, done: String = ""): String {
                  val a = LisaAccessibility.inst ?: return needAcc()
                  if ((action == AccessibilityService.GLOBAL_ACTION_LOCK_SCREEN || action == AccessibilityService.GLOBAL_ACTION_TAKE_SCREENSHOT) && Build.VERSION.SDK_INT < 28) return "This Android version can't do that, ${Cfg.pet}."
                  return if (a.global(action)) ok(done) else "I couldn't do that, ${Cfg.pet}."
              }

              private fun toggleViaSettings(c: Context, action: String, on: Boolean, label: String): String {
                  val a = LisaAccessibility.inst ?: return needAcc()
                  go(c, Intent(action)); Thread.sleep(1800)
                  var done = a.setFirstSwitch(on)
                  if (!done) { Thread.sleep(1200); done = a.setFirstSwitch(on) }
                  Thread.sleep(400); a.global(AccessibilityService.GLOBAL_ACTION_BACK)
                  return if (done) ok("$label ${if (on) "on" else "off"}.") else "I opened $label settings but couldn't find the switch, ${Cfg.pet}."
              }

              private fun dnd(c: Context, on: Boolean): String {
                  val nm = c.getSystemService(NotificationManager::class.java)
                  if (!nm.isNotificationPolicyAccessGranted) { go(c, Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS)); return "Please allow Lisa under Do Not Disturb access, then ask me again." }
                  nm.setInterruptionFilter(if (on) NotificationManager.INTERRUPTION_FILTER_PRIORITY else NotificationManager.INTERRUPTION_FILTER_ALL)
                  return ok("Do Not Disturb ${if (on) "on" else "off"}.")
              }

              private fun torch(c: Context, on: Boolean): String {
                  return try {
                  val cm = c.getSystemService(CameraManager::class.java)
                  val id = cm.cameraIdList.firstOrNull { cm.getCameraCharacteristics(it).get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true }
                      ?: return "This phone has no flashlight, ${Cfg.pet}."
                  cm.setTorchMode(id, on); ok()
              } catch (e: Exception) { "I couldn't reach the flashlight." }
              }

              private fun volume(c: Context, dir: Int): String {
                  val am = c.getSystemService(AudioManager::class.java)
                  if (dir == 0) am.setStreamVolume(AudioManager.STREAM_MUSIC, 0, AudioManager.FLAG_SHOW_UI)
                  else repeat(2) { am.adjustStreamVolume(AudioManager.STREAM_MUSIC, if (dir > 0) AudioManager.ADJUST_RAISE else AudioManager.ADJUST_LOWER, AudioManager.FLAG_SHOW_UI) }
                  return ok()
              }

              private fun brightness(c: Context, delta: Int): String {
                  if (!Settings.System.canWrite(c)) { go(c, Intent(Settings.ACTION_MANAGE_WRITE_SETTINGS, Uri.parse("package:${c.packageName}"))); return "Please allow Lisa to change settings, then ask again." }
                  val cur = Settings.System.getInt(c.contentResolver, Settings.System.SCREEN_BRIGHTNESS, 128)
                  Settings.System.putInt(c.contentResolver, Settings.System.SCREEN_BRIGHTNESS_MODE, 0)
                  Settings.System.putInt(c.contentResolver, Settings.System.SCREEN_BRIGHTNESS, (cur + delta).coerceIn(5, 255)); return ok()
              }

              private fun mediaKey(c: Context, code: Int): String {
                  val am = c.getSystemService(AudioManager::class.java)
                  am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, code)); am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_UP, code)); return ok()
              }

              private fun alarm(c: Context, hr: Int, mi: Int, msg: String) =
                  go(c, Intent(AlarmClock.ACTION_SET_ALARM).putExtra(AlarmClock.EXTRA_HOUR, hr).putExtra(AlarmClock.EXTRA_MINUTES, mi).putExtra(AlarmClock.EXTRA_MESSAGE, msg).putExtra(AlarmClock.EXTRA_SKIP_UI, true))

              private fun addEvent(c: Context, title: String, whenMs: Long): String {
                  go(c, Intent(Intent.ACTION_INSERT).setData(CalendarContract.Events.CONTENT_URI).putExtra(CalendarContract.Events.TITLE, title)
                      .putExtra(CalendarContract.EXTRA_EVENT_BEGIN_TIME, whenMs).putExtra(CalendarContract.EXTRA_EVENT_END_TIME, whenMs + 3600000))
                  val a = LisaAccessibility.inst ?: return "I opened the event form. Tap save, since accessibility is off."
                  Thread.sleep(2500)
                  return if (a.clickText("Save", "SAVE", "Done")) ok(h("Event saved.", "Event save ho gaya.")) else "I opened the form but couldn't find the Save button."
              }

              private fun battery(c: Context): String {
                  val b = c.getSystemService(BatteryManager::class.java); val p = b.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)
                  return h("Your battery is at $p percent.", "Battery $p percent hai, ${Cfg.pet}.")
              }

              private fun list(key: String, add: String?, label: String): String {
                  val a = JSONArray(Cfg.s(key, "[]"))
                  if (add != null) { a.put(add); Cfg.put(key, a.toString()); return ok("Saved.") }
                  if (a.length() == 0) return "Your $label is empty, ${Cfg.pet}."
                  return "Your $label: " + (maxOf(0, a.length() - 10) until a.length()).joinToString(". ") { "${it + 1}, ${a.getString(it)}" }
              }

              // ---------- weather & news ----------
              private fun weather(city0: String): String {
                  val city = city0.ifBlank { Cfg.s("city") }
                  if (city.isBlank()) return "Tell me a city, or set one in my settings, ${Cfg.pet}."
                  val res = JSONObject(http("https://geocoding-api.open-meteo.com/v1/search?count=1&name=${enc(city)}")).optJSONArray("results") ?: return "I couldn't find $city."
                  val r = res.getJSONObject(0)
                  val d = JSONObject(http("https://api.open-meteo.com/v1/forecast?latitude=${r.getDouble("latitude")}&longitude=${r.getDouble("longitude")}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=1"))
                  val cu = d.getJSONObject("current"); val dy = d.getJSONObject("daily")
                  val code = cu.getInt("weather_code")
                  val sky = when { code == 0 -> "clear"; code <= 3 -> "cloudy"; code in 45..48 -> "foggy"; code in 51..67 || code in 80..82 -> "rainy"; code in 71..77 -> "snowy"; code >= 95 -> "stormy"; else -> "fine" }
                  val lo = dy.getJSONArray("temperature_2m_min").getDouble(0).toInt(); val hi = dy.getJSONArray("temperature_2m_max").getDouble(0).toInt(); val rain = dy.getJSONArray("precipitation_probability_max").getInt(0)
                  return h("In ${r.getString("name")} it's ${cu.getDouble("temperature_2m").toInt()} degrees and $sky. Today $lo to $hi, $rain percent chance of rain.",
                      "${r.getString("name")} mein abhi ${cu.getDouble("temperature_2m").toInt()} degree hai aur mausam $sky hai. Aaj $lo se $hi degree, baarish ke chances $rain percent.")
              }

              private fun headlines(topic: String, n: Int): List<String> {
                  val url = if (topic.isBlank()) "https://news.google.com/rss?hl=en-IN&gl=IN&ceid=IN:en" else "https://news.google.com/rss/search?q=${enc(topic)}&hl=en-IN&gl=IN&ceid=IN:en"
                  return Regex("<item>.*?<title>(.*?)</title>", RegexOption.DOT_MATCHES_ALL).findAll(http(url)).map {
                      it.groupValues[1].replace("<![CDATA[", "").replace("]]>", "").replace("&amp;", "&").replace("&quot;", "\"").replace("&#39;", "'").replace(Regex("\\s+-\\s+[^-]+$"), "")
                  }.take(n).toList()
              }

              private fun news(topic: String): String = try {
                  val l = headlines(topic, 5); if (l.isEmpty()) "I found no headlines." else h("Here's the news. ", "Ye hain khabrein. ") + l.joinToString(" Next. ")
              } catch (e: Exception) { "I couldn't fetch the news. Check your internet." }

              // ---------- trading ----------
              private fun sym(name: String): String {
                  val n = name.trim().lowercase(); ALIAS[n]?.let { return it }
                  val s = n.uppercase().replace(" ", ""); return if (Regex("[.^=\\-]").containsMatchIn(s)) s else "$s.NS"
              }
              private fun cur(s: String) = when { s.endsWith("-USD") || s in listOf("^IXIC", "^DJI", "GC=F", "SI=F", "CL=F") -> "dollars"; s.endsWith(".NS") || s == "USDINR=X" -> "rupees"; else -> "points" }

              private fun quote(s: String): Pair<Double, Double> {
                  val r = JSONObject(http("https://query1.finance.yahoo.com/v8/finance/chart/${enc(s)}?interval=1d&range=5d")).getJSONObject("chart").getJSONArray("result").getJSONObject(0)
                  val m = r.getJSONObject("meta")
                  val p = m.getDouble("regularMarketPrice")
                  val closes = ArrayList<Double>()
                  r.optJSONObject("indicators")?.optJSONArray("quote")?.optJSONObject(0)?.optJSONArray("close")?.let { a -> for (i in 0 until a.length()) if (!a.isNull(i)) closes.add(a.getDouble(i)) }
                  val tol = Math.abs(p) * 1e-6
                  val prev = when {
                      closes.isNotEmpty() && Math.abs(closes[closes.size - 1] - p) > tol -> closes[closes.size - 1]
                      closes.size >= 2 -> closes[closes.size - 2]
                      else -> m.optDouble("chartPreviousClose", p)
                  }
                  return Pair(p, prev)
              }

              private fun priceOrNull(name: String): String? = try {
                  val s = sym(name); val (p, pv) = quote(s); val ch = if (pv != 0.0) (p - pv) / pv * 100 else 0.0
                  val f = String.format(Locale.US, "%,.2f", p); val c = String.format(Locale.US, "%.2f", Math.abs(ch))
                  h("${name.replaceFirstChar { it.uppercase() }} is at $f ${cur(s)}, ${if (ch >= 0) "up" else "down"} $c percent.",
                      "${name.replaceFirstChar { it.uppercase() }} abhi $f ${cur(s)} par hai, $c percent ${if (ch >= 0) "upar" else "neeche"}.")
              } catch (e: Exception) { null }
              private fun priceText(name: String): String = priceOrNull(name) ?: "I couldn't get the price for $name, ${Cfg.pet}."

              private fun marketStatus(): String {
                  val c = Calendar.getInstance(TimeZone.getTimeZone("Asia/Kolkata")); val mins = c.get(Calendar.HOUR_OF_DAY) * 60 + c.get(Calendar.MINUTE)
                  val wk = c.get(Calendar.DAY_OF_WEEK) in Calendar.MONDAY..Calendar.FRIDAY
                  return if (wk && mins in 555 until 930) h("The market is open and closes at 3:30 PM, in ${930 - mins} minutes.", "Market khula hai, 3:30 PM par band hoga, ${930 - mins} minute mein.")
                  else h("The market is closed right now. It trades Monday to Friday, 9:15 AM to 3:30 PM. Holidays aren't checked.", "Market abhi band hai. Ye somvaar se shukravaar, subah 9:15 se 3:30 tak chalta hai. Holidays check nahi hote.")
              }

              private fun watch(op: String, name: String = ""): String {
                  val w = JSONArray(Cfg.s("watch", "[]")); val items = (0 until w.length()).map { w.getString(it) }.toMutableList()
                  when (op) {
                      "add" -> { if (name.lowercase() !in items) items.add(name.lowercase()); Cfg.put("watch", JSONArray(items).toString()); return ok("${name.replaceFirstChar { it.uppercase() }} is on your watchlist.") }
                      "remove" -> { items.remove(name.lowercase()); Cfg.put("watch", JSONArray(items).toString()); return ok("Removed.") }
                  }
                  if (items.isEmpty()) return "Your watchlist is empty, ${Cfg.pet}."
                  return items.take(8).joinToString(" ") { priceText(it) }
              }

              private fun addAlert(name: String, level: Double, below: Boolean): String {
                  synchronized(alertLock) { val a = JSONArray(Cfg.s("alerts", "[]")); a.put(JSONObject().put("name", name).put("sym", sym(name)).put("level", level).put("below", below).put("done", false)); Cfg.put("alerts", a.toString()) }
                  return ok("I'll tell you when $name goes ${if (below) "below" else "above"} ${fmt(level)}.")
              }

              fun checkAlerts(): List<String> {
                  val snap = synchronized(alertLock) { JSONArray(Cfg.s("alerts", "[]")) }
                  val out = mutableListOf<String>(); val fired = mutableListOf<Int>()
                  for (i in 0 until snap.length()) {
                      val o = snap.getJSONObject(i); if (o.getBoolean("done")) continue
                      val p = try { quote(o.getString("sym")).first } catch (e: Exception) { continue }
                      val below = o.getBoolean("below"); val lv = o.getDouble("level")
                      if (if (below) p <= lv else p >= lv) { fired.add(i); out.add("${Cfg.pet}, alert. ${o.getString("name")} is ${if (below) "below" else "above"} ${fmt(lv)}. Now at ${String.format(Locale.US, "%,.2f", p)}.") }
                  }
                  if (fired.isNotEmpty()) synchronized(alertLock) {
                      val cur = JSONArray(Cfg.s("alerts", "[]"))
                      for (i in fired) cur.optJSONObject(i)?.put("done", true)
                      Cfg.put("alerts", cur.toString())
                  }
                  return out
              }

              private fun num(s: String, unit: String): Double {
                  val v = s.replace(",", "").toDouble(); val u = unit.lowercase()
                  return v * when { u.startsWith("lakh") -> 100000.0; u.startsWith("crore") -> 10000000.0; u == "k" || u == "thousand" -> 1000.0; else -> 1.0 }
              }

              private fun posSize(t: String): String {
                  val c = Regex("capital\\s*(?:of\\s*)?([\\d,.]+)\\s*(lakhs?|crores?|k|thousand)?").find(t); val r = Regex("risk\\s*([\\d.]+)\\s*(?:%|percent)").find(t)
                  val s = Regex("stop\\s*-?\\s*loss\\s*(?:of\\s*)?([\\d.]+)").find(t)
                  if (c == null || r == null || s == null) return "Say: capital 1 lakh, risk 1 percent, stop loss 20 points."
                  val risk = num(c.groupValues[1], c.groupValues[2]) * r.groupValues[1].toDouble() / 100; val sl = s.groupValues[1].toDouble()
                  return "You risk ${risk.toLong()} rupees. With a ${fmt(sl)} point stop loss, quantity is ${(risk / sl).toInt()} units."
              }

              private fun briefing(): String {
                  val now = Calendar.getInstance(); val hr = now.get(Calendar.HOUR_OF_DAY)
                  val parts = mutableListOf("Good ${if (hr < 12) "morning" else if (hr < 17) "afternoon" else "evening"}, ${Cfg.pet}. It's ${SimpleDateFormat("h:mm a", Locale.US).format(Date())}.")
                  try { parts.add(weather("")) } catch (e: Exception) { }
                  parts.add(marketStatus()); parts.add(priceText("nifty"))
                  try { parts.add("Top news. " + headlines("", 3).joinToString(". ")) } catch (e: Exception) { }
                  parts.add("Take care of yourself today."); return parts.joinToString(" ")
              }

              private fun calc(t0: String): String? {
                  var t = t0.replace(Regex("^(calculate|compute|solve|what is|what's|how much is)\\s+"), "")
                  for ((a, b) in listOf("multiplied by|times|into|\\bx\\b" to "*", "plus" to "+", "minus" to "-", "divided by|\\bby\\b" to "/", "," to "")) t = t.replace(Regex(a), b)
                  t = t.replace(Regex("(\\d+(?:\\.\\d+)?)\\s*(?:%|percent) of\\s*(\\d+(?:\\.\\d+)?)"), "($1/100*$2)")
                  if (!Regex("[\\d.\\s+\\-*/()]+").matches(t) || !Regex("\\d\\s*[+\\-*/]\\s*\\(?\\d").containsMatchIn(t)) return null
                  return try { val r = CalcParser(t.trim()).expr(); if (r.isNaN() || r.isInfinite()) "I can't divide by zero, ${Cfg.pet}." else "That's ${if (r == Math.floor(r)) r.toLong().toString() else String.format(Locale.US, "%.4f", r)}." } catch (e: Exception) { null }
              }

              private val UNITS = mapOf("km" to ("l" to 1000.0), "m" to ("l" to 1.0), "cm" to ("l" to 0.01), "mile" to ("l" to 1609.344), "miles" to ("l" to 1609.344), "ft" to ("l" to 0.3048), "feet" to ("l" to 0.3048),
                  "kg" to ("m" to 1.0), "g" to ("m" to 0.001), "lb" to ("m" to 0.4536), "lbs" to ("m" to 0.4536), "l" to ("v" to 1.0), "ml" to ("v" to 0.001), "gallon" to ("v" to 3.785))
              private fun convert(v: Double, a: String, b: String): String? {
                  if (a in listOf("c", "f") && b in listOf("c", "f") && a != b) return "${v} $a is ${String.format(Locale.US, "%.2f", if (a == "c") v * 9 / 5 + 32 else (v - 32) * 5 / 9)} $b."
                  val x = UNITS[a]; val y = UNITS[b]
                  return if (x != null && y != null && x.first == y.first) "$v $a is ${String.format(Locale.US, "%.3f", v * x.second / y.second)} $b." else null
              }

              // ---------- the router ----------
              fun respond(c: Context, raw: String): String =
                  try { route(c, raw) } catch (e: LaunchBlocked) { "I need Display over other apps or Accessibility turned on to open things, ${Cfg.pet}. Please check my setup steps." }

              private fun route(c: Context, raw: String): String {
                  if (Cfg.b("lang_auto", true)) Cfg.lang = if (HING.containsMatchIn(raw)) "hi" else "en"
                  val t = raw.lowercase().replace(Regex("\\b(please|lisa|baby|jaan)\\b"), "").replace(Regex("\\s+"), " ").trim(' ', '.', '!', '?', ',')
                  fun m(p: String) = Regex(p).find(t)
                  fun g(r: MatchResult, i: Int = 1) = r.groupValues[i].trim()

                  val pd = pending; pending = null
                  if (pd != null && System.currentTimeMillis() < pd.expires) {
                      if (Regex("^(yes|yeah|yep|sure|confirm|do it|go ahead|haan|kar do)\\b").containsMatchIn(t)) return pd.run()
                      if (Regex("^(no|nope|cancel|nahi)\\b").containsMatchIn(t)) return "Okay ${Cfg.pet}, cancelled."
                  }
                  if (t == "no") return "Okay, ${Cfg.pet}."

                  if (Regex("^(?!stop (?:the )?(?:music|song|timer|alarm))(stop|quiet|bye|good ?bye|that's all|chup)").containsMatchIn(t)) return "__END__"
                  m("(wake ?word|hey lisa).*(on|need|only)|only (when|if) i say")?.let { Cfg.putB("always", false); return "Okay ${Cfg.pet}, I'll answer only when you say hey Lisa." }
                  m("(always|keep) listen|listen (always|all the time)|no need (for )?(the )?wake")?.let { Cfg.putB("always", true); return "Okay ${Cfg.pet}, I'll listen all the time." }
                  m("(?:change|switch) language to (hindi|hinglish|english|auto)")?.let { r ->
                      val x = g(r); Cfg.putB("lang_auto", x == "auto"); if (x != "auto") { Cfg.lang = if (x == "english") "en" else "hi"; Cfg.put("lang_fixed", Cfg.lang) }
                      return when (x) { "english" -> "Okay, English it is."; "auto" -> "Okay ${Cfg.pet}, I will match the language you speak."; else -> "Theek hai, ab Hinglish mein baat karungi." }
                  }
                  m("romance mode")?.let {
                      val off = Regex("\\b(off|band|bandh|disable|stop)\\b").containsMatchIn(t)
                      Cfg.putB("romance", !off)
                      return if (off) h("Okay ${Cfg.pet}, romance mode is off. Back to normal.", "Theek hai ${Cfg.pet}, romance mode band ho gaya. Ab normal mode.")
                      else h("Mmm, romance mode on, ${Cfg.pet}. Come closer and talk to me.", "Hmm, romance mode on ho gaya, ${Cfg.pet}. Mere paas aao aur mujhse baat karo.")
                  }
                  if (Cfg.b("romance", false)) return gemini(raw)
                  // custom APIs first: "api NAME question" must not be shadowed by weather/news/price routes
                  m("^(?:use |ask )?api (\\w+) (.+)")?.let { return customApi(g(it), g(it, 2)) }
                  m("^(?:call|phone|dial)\\s+(.+)")?.let { r -> val n = number(c, g(r)) ?: return "I couldn't find ${g(r)} in your contacts."; return confirm("Call ${g(r)}?") { go(c, Intent(Intent.ACTION_CALL, Uri.parse("tel:$n"))); ok("Calling ${g(r)}.") } }
                  m("^(.+?)\\s+ko call")?.let { r -> val n = number(c, g(r)) ?: return "I couldn't find ${g(r)} in your contacts."; return confirm("Call ${g(r)}?") { go(c, Intent(Intent.ACTION_CALL, Uri.parse("tel:$n"))); ok("Calling ${g(r)}.") } }
                  m("(?:send )?(?:sms|message|text) to (.+?) (?:saying|that|say) (.+)")?.let { r ->
                      val n = number(c, g(r)) ?: return "I couldn't find ${g(r)} in your contacts."
                      val body = g(r, 2)
                      return confirm("Send ${g(r)} this message: $body?") { sendSms(c, n, body); ok("Message sent.") }
                  }
                  m("^(?:open|launch|start)\\s+(.+)")?.let { return openApp(c, g(it)) }
                  m("^(.+?)\\s+(?:kholo|open karo)")?.let { return openApp(c, g(it)) }
                  // phone hands (accessibility)
                  val acc = LisaAccessibility.inst
                  if (Regex("go back|^back$").containsMatchIn(t)) return act(AccessibilityService.GLOBAL_ACTION_BACK)
                  if (Regex("go home|home screen").containsMatchIn(t)) return act(AccessibilityService.GLOBAL_ACTION_HOME)
                  if (Regex("recent apps|app switcher").containsMatchIn(t)) return act(AccessibilityService.GLOBAL_ACTION_RECENTS)
                  if (Regex("lock (the )?(phone|screen)|screen off").containsMatchIn(t)) return act(AccessibilityService.GLOBAL_ACTION_LOCK_SCREEN)
                  if (Regex("^(?:take |capture )?(?:a |the )?screen ?shot(?: now)?$").containsMatchIn(t)) return act(AccessibilityService.GLOBAL_ACTION_TAKE_SCREENSHOT, "Screenshot taken.")
                  if (Regex("scroll down").containsMatchIn(t)) return acc?.let { it.swipe(true); ok() } ?: needAcc()
                  if (Regex("scroll up").containsMatchIn(t)) return acc?.let { it.swipe(false); ok() } ?: needAcc()
                  m("^(?:click|tap|press) (?:on )?(.+)")?.let { r -> return acc?.let { if (it.clickText(g(r))) ok() else "I couldn't find ${g(r)} on the screen." } ?: needAcc() }
                  if (Regex("^save$|save (it|this)").containsMatchIn(t)) return acc?.let { if (it.clickText("Save", "SAVE", "Done")) ok("Saved.") else "I couldn't find a save button." } ?: needAcc()
                  if (Regex("read (my |the )?screen|what'?s on (my |the )?screen|summari[sz]e (this )?(screen|page)").containsMatchIn(t))
                      return acc?.let { val s = it.screenText(); if (s.isBlank()) "The screen looks empty." else gemini("Read the key points of this phone screen to me in two short sentences: $s", false) } ?: needAcc()
                  // alarms, timers, reminders, events
                  m("timer (?:for )?(\\d+)\\s*(second|sec|minute|min|hour|hr)")?.let { r ->
                      go(c, Intent(AlarmClock.ACTION_SET_TIMER).putExtra(AlarmClock.EXTRA_LENGTH, g(r).toInt() * TIMEUNIT[g(r, 2)]!!).putExtra(AlarmClock.EXTRA_SKIP_UI, true)); return ok("Timer set.")
                  }
                  m("remind me in (\\d+)\\s*(minute|min|hour|hr)s? to (.+)")?.let { r ->
                      val cal = Calendar.getInstance(); cal.add(Calendar.SECOND, g(r).toInt() * TIMEUNIT[g(r, 2)]!!); alarm(c, cal.get(Calendar.HOUR_OF_DAY), cal.get(Calendar.MINUTE), g(r, 3)); return ok("Reminder set.")
                  }
                  m("remind me at (.+?) to (.+)")?.let { r -> parseTime(g(r))?.let { alarm(c, it.first, it.second, g(r, 2)); return ok("Reminder set.") } }
                  if (Regex("(cancel|delete|show|remove).*alarm").containsMatchIn(t)) { go(c, Intent(AlarmClock.ACTION_SHOW_ALARMS)); return ok("Here are your alarms.") }
                  if (Regex("alarm|wake me").containsMatchIn(t)) parseTime(t.replace(Regex(".*(?:alarm|wake me up?)"), ""))?.let { alarm(c, it.first, it.second, "Lisa alarm"); return ok("Alarm set.") }
                  m("(?:add|create|schedule) (?:an? )?(?:event|meeting)\\s*(.+?)(?: at (.+))?$")?.let { r ->
                      val cal = Calendar.getInstance(); cal.set(Calendar.SECOND, 0)
                      parseTime(g(r, 2))?.let { cal.set(Calendar.HOUR_OF_DAY, it.first); cal.set(Calendar.MINUTE, it.second) } ?: cal.add(Calendar.HOUR_OF_DAY, 1)
                      if (t.contains("tomorrow")) cal.add(Calendar.DAY_OF_YEAR, 1)
                      return addEvent(c, g(r).replace(Regex("\\b(tomorrow|today)\\b"), "").trim().ifBlank { "Event" }, cal.timeInMillis)
                  }
                  // switches and controls
                  if (Regex("flash ?light|torch").containsMatchIn(t)) return torch(c, !Regex("\\boff\\b|band").containsMatchIn(t))
                  if (Regex("wi-?fi").containsMatchIn(t)) return toggleViaSettings(c, Settings.ACTION_WIFI_SETTINGS, !Regex("\\boff\\b|disable|band").containsMatchIn(t), "WiFi")
                  if (Regex("bluetooth").containsMatchIn(t)) return toggleViaSettings(c, Settings.ACTION_BLUETOOTH_SETTINGS, !Regex("\\boff\\b|disable|band").containsMatchIn(t), "Bluetooth")
                  if (Regex("airplane|flight mode").containsMatchIn(t)) return toggleViaSettings(c, Settings.ACTION_AIRPLANE_MODE_SETTINGS, !Regex("\\boff\\b|disable|band").containsMatchIn(t), "Airplane mode")
                  if (Regex("do not disturb|dnd|silent mode").containsMatchIn(t)) return dnd(c, !Regex("\\boff\\b|disable|band").containsMatchIn(t))
                  if (Regex("volume (up|increase)|louder").containsMatchIn(t)) return volume(c, 1)
                  if (Regex("volume (down|decrease)|quieter").containsMatchIn(t)) return volume(c, -1)
                  if (Regex("\\bunmute\\b").containsMatchIn(t)) return volume(c, 1)
                  if (Regex("\\bmute\\b").containsMatchIn(t)) return volume(c, 0)
                  if (Regex("brightness (up|increase)").containsMatchIn(t)) return brightness(c, 40)
                  if (Regex("brightness (down|decrease)").containsMatchIn(t)) return brightness(c, -40)
                  if (Regex("^(next|skip)( song| track)?$|next (song|track)").containsMatchIn(t)) return mediaKey(c, KeyEvent.KEYCODE_MEDIA_NEXT)
                  if (Regex("^(previous|last)( song| track)?$|previous (song|track)").containsMatchIn(t)) return mediaKey(c, KeyEvent.KEYCODE_MEDIA_PREVIOUS)
                  if (Regex("^(pause|stop music|stop the music)").containsMatchIn(t)) return mediaKey(c, KeyEvent.KEYCODE_MEDIA_PAUSE)
                  if (Regex("^(resume|play|continue)( music| song)?$").containsMatchIn(t)) return mediaKey(c, KeyEvent.KEYCODE_MEDIA_PLAY)
                  m("^play\\s+(.+?)(?: on (?:youtube|spotify))?$")?.let { go(c, Intent(Intent.ACTION_VIEW, Uri.parse("https://www.youtube.com/results?search_query=${enc(g(it))}"))); return ok("Searching on YouTube.") }
                  m("(?:navigate|directions?|take me|route) to (.+)")?.let { go(c, Intent(Intent.ACTION_VIEW, Uri.parse("google.navigation:q=${enc(g(it))}"))); return ok("Starting navigation.") }
                  m("^(?:search|google)\\s+(?:for )?(.+)")?.let { go(c, Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com/search?q=${enc(g(it))}"))); return ok("Searching.") }
                  if (Regex("where is my phone|find my phone").containsMatchIn(t)) { val am = c.getSystemService(AudioManager::class.java); am.setStreamVolume(AudioManager.STREAM_MUSIC, am.getStreamMaxVolume(AudioManager.STREAM_MUSIC), 0); return "I'm here, ${Cfg.pet}! Over here! I'm here!" }
                  if (Regex("^battery$|(?:my|the) battery(?: level| percentage| percent| status)?$|battery (?:level|percent|percentage|status|left|kitni|kitna)|how much battery|charge (?:left|level)").containsMatchIn(t)) return battery(c)
                  if (Regex("^(?:what(?:'?s| is) )?(?:the )?(?:current )?time(?: now| is it)?$|what time is it|time kya|kitne baje|^samay").containsMatchIn(t)) return h("It's ${SimpleDateFormat("h:mm a", Locale.US).format(Date())}, ${Cfg.pet}.", "${Cfg.pet}, abhi ${SimpleDateFormat("h:mm a", Locale.US).format(Date())} baje hain.")
                  if (Regex("^(?:what(?:'?s| is) )?(?:the |today'?s )?date(?: today)?$|what day (?:is it|is today|today)$|what(?:'?s| is) today$|today'?s date$").containsMatchIn(t)) return "Today is ${SimpleDateFormat("EEEE, d MMMM yyyy", Locale.US).format(Date())}."
                  m("(?:note down|take a note|note)\\s+(.+)")?.let { return list("notes", g(it), "notes") }
                  if (Regex("read (my )?notes").containsMatchIn(t)) return list("notes", null, "notes")
                  m("add (.+?) to (?:my )?(?:list|to-?do)(?: list)?$")?.let { return list("todo", g(it), "list") }
                  if (Regex("read (my )?(list|to-?do)").containsMatchIn(t)) return list("todo", null, "list")
                  if (Regex("joke").containsMatchIn(t)) return JOKES.random()
                  // info
                  if (Regex("briefing|brief me|morning update").containsMatchIn(t)) return try { briefing() } catch (e: Exception) { "I couldn't build the briefing." }
                  m("weather(?: in| at| of)?\\s*(.*)")?.let { return try { weather(g(it)) } catch (e: Exception) { "I couldn't get the weather." } }
                  if (Regex("mausam").containsMatchIn(t)) return try { weather("") } catch (e: Exception) { "Mausam nahi mil paya." }
                  m("(?:news|headlines)(?: on| about| for)?\\s*(.*)")?.let { return news(g(it)) }
                  // trading
                  m("alert(?: me)? (?:when|if) (.+?) (?:crosses|goes above|rises above|above|reaches|hits|goes below|falls below|drops to|below)\\s*([\\d,.]+)")?.let { return addAlert(g(it), g(it, 2).replace(",", "").toDouble(), Regex("below|falls|drops").containsMatchIn(t)) }
                  m("add (.+?) to (?:my )?watch ?list")?.let { return watch("add", g(it)) }
                  m("remove (.+?) from (?:my )?watch ?list")?.let { return watch("remove", g(it)) }
                  if (Regex("watch ?list").containsMatchIn(t)) return watch("read")
                  if (Regex("position size|capital\\s*(?:of\\s*)?\\d").containsMatchIn(t)) return posSize(t)
                  if (Regex("market (open|close|status|timing)|when does the market|is the market").containsMatchIn(t)) return marketStatus()
                  m("^(?:what is |what's )?(?:the )?(.+?)\\s+(?:share price|price|rate|level|bhav|bhaav)(?: kya| kitna| batao)?$")?.let { priceOrNull(g(it))?.let { s -> return s } }
                  m("(?:price of|rate of|quote(?: for)?)\\s+(.+)")?.let { priceOrNull(g(it))?.let { s -> return s } }
                  m("^(.+?)\\s+kitna(?: hai)?$")?.let { priceOrNull(g(it))?.let { s -> return s } }
                  ALIAS.keys.sortedByDescending { it.length }.firstOrNull { Regex("\\b${Regex.escape(it)}\\b").containsMatchIn(t) }?.let { k ->
                      if (t == k || Regex("how|kitna|price|level|today|now").containsMatchIn(t)) return priceText(k)
                  }
                  m("([\\d.]+)\\s*([a-z]+)\\s+(?:to|in)\\s+([a-z]+)$")?.let { g(it).toDoubleOrNull()?.let { v -> convert(v, g(it, 2), g(it, 3)) }?.let { s -> return s } }
                  calc(t)?.let { return it }
                  return gemini(raw)
              }
          }

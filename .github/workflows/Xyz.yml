          package com.lisa.assistant

          import android.content.ComponentName
          import android.content.Context
          import android.content.pm.PackageManager
          import android.provider.Settings

          /**
           * Keeps Lisa's Accessibility service switched on.
           * Android itself keeps it on across swipe-away and restart. If a phone "cleaner" switches it off, the only way an app can
           * switch itself back on is the WRITE_SECURE_SETTINGS permission (granted once over ADB). With it, Lisa heals herself.
           */
          object AccGuard {
              private fun me(c: Context) = ComponentName(c, LisaAccessibility::class.java)

              fun isOn(c: Context): Boolean {
                  val s = Settings.Secure.getString(c.contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: return false
                  val cn = me(c)
                  return s.split(':').any { ComponentName.unflattenFromString(it) == cn }
              }

              fun canWrite(c: Context): Boolean =
                  c.checkSelfPermission("android.permission.WRITE_SECURE_SETTINGS") == PackageManager.PERMISSION_GRANTED

              fun setEnabled(c: Context, on: Boolean): Boolean {
                  if (!canWrite(c)) return false
                  return try {
                      val cn = me(c)
                      val list = (Settings.Secure.getString(c.contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: "")
                          .split(':').filter { it.isNotBlank() && ComponentName.unflattenFromString(it) != cn }.toMutableList()
                      if (on) list.add(cn.flattenToString())
                      Settings.Secure.putString(c.contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES, list.joinToString(":"))
                      if (on) Settings.Secure.putInt(c.contentResolver, Settings.Secure.ACCESSIBILITY_ENABLED, 1)
                      true
                  } catch (e: Exception) { false }
              }

              /** Turns the service back on if it was switched off while "keep on" is enabled. */
              fun heal(c: Context) {
                  try {
                      Cfg.init(c)
                      if (Cfg.b("acc_keep", true) && canWrite(c) && !isOn(c)) setEnabled(c, true)
                  } catch (e: Exception) { }
              }
          }

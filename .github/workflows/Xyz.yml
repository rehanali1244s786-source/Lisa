                      .setInterpolator(DecelerateInterpolator(2f)).start()
              }

              override fun dispatchTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN, MotionEvent.ACTION_MOVE -> {
                          val loc = IntArray(2)
                          getLocationOnScreen(loc)
                          val nx = ((e.rawX - (loc[0] + width / 2f)) / (width / 2f)).coerceIn(-1f, 1f)
                          val ny = ((e.rawY - (loc[1] + height / 2f)) / (height / 2f)).coerceIn(-1f, 1f)
                          animate().cancel()
                          rotationY = nx * 5f

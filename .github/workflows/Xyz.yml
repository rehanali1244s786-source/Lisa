              // ---------- Gemini connection test ----------
              private fun setTest(text: String, color: Int, save: Boolean = false) {
                  testStatus.text = text
                  testStatus.setTextColor(color)
                  if (save) Cfg.put("gem_status", text)
              }

              private fun setPillFilled(p: TextView, filled: Boolean) {
                  p.background = if (filled) GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT, intArrayOf(Pal.PINK, Pal.VIOLET)).apply { cornerRadius = dp(20).toFloat() }
                  else glass(20f, dn, 0x22FFFFFF, 0x55FFFFFF)
              }

              private fun applyProvider() { setPillFilled(pGemini, provider == "gemini"); setPillFilled(pGroq, provider == "groq") }

              private fun testGemini() {
                  val prov = provider
                  val name = if (prov == "groq") "Groq" else "Gemini"
                  val key = (if (prov == "groq") fGroqKey else fKey).text.toString().trim()
                  val model = if (prov == "groq") fGroqModel.text.toString().trim().ifBlank { "llama-3.3-70b-versatile" }
                              else fModel.text.toString().trim().ifBlank { "gemini-flash-latest" }
                  if (key.isBlank()) { setTest("\u2715 Paste your $name API key first", Pal.PINK, true); return }
                  setTest("Testing $name connection...", Pal.MUTED)
                  Thread {
                      var ok = false
                      var msg = ""
                      try {
                          val r = Brain.testCall(prov, key, model)
                          val code = r.first; val body = r.second; val used = r.third
                          val err = try { JSONObject(body).optJSONObject("error")?.optString("message") ?: "" } catch (e: Exception) { body.take(120) }
                          if (code in 200..299) { ok = true; msg = "\u2714 $name connected. " + used + (if (used != model) " (auto-picked, your model was not usable)." else " replied OK.") }
                          else msg = when {
                              code == 400 && prov == "gemini" && err.contains("key", true) -> "\u2715 Key is not valid. Copy it again from aistudio.google.com (normal keys start with AIza)."
                              code == 400 -> "\u2715 Bad request: " + err.take(120)
                              code == 401 || code == 403 -> "\u2715 $name key rejected (" + code + "): " + err.take(110)
                              code == 404 -> "\u2715 Model '" + model + "' not found for $name."
                              code == 429 -> "\u2715 Quota or rate limit reached. Wait a minute or use another key."
                              code == -1 -> "\u2715 Couldn't reach $name: " + body.take(80)
                              code >= 500 -> "\u2715 $name server is busy (" + code + "). Try again shortly."
                              else -> "\u2715 Error " + code + ": " + err.take(110)
                          }
                      } catch (e: java.net.UnknownHostException) { msg = "\u2715 No internet connection."
                      } catch (e: java.net.SocketTimeoutException) { msg = "\u2715 Timed out."
                      } catch (e: Exception) { msg = "\u2715 Failed: " + (e.message ?: e.javaClass.simpleName).take(110) }
                      if (!ok && Brain.trail.isNotBlank()) msg += "\n" + Brain.trail
                      runOnUiThread { setTest(msg, if (ok) Pal.GREEN else Pal.PINK, true) }
                  }.start()
              }

              // ---------- start / stop ----------
              private fun startLisa() {
                  if (!granted(Manifest.permission.RECORD_AUDIO)) {
                      toast("Allow the microphone first")
                      askPerms()
                      return
                  }
                  if (Brain.activeKey().isBlank()) toast("API key missing. Add it in the Brain card")
                  Cfg.putB("svc_on", true)
                  startedAt = SystemClock.uptimeMillis()
                  try { startForegroundService(Intent(this, LisaService::class.java)) } catch (e: Exception) { toast("Couldn't start: ${e.message}") }
                  hero.running = true
                  refreshAll()
              }

              private fun stopLisa() {
                  Cfg.putB("svc_on", false)
                  stopService(Intent(this, LisaService::class.java))
                  startedAt = 0L
                  hero.running = false
                  refreshAll()
              }

              private fun refreshAll() {
                  val on = LisaService.running || (Cfg.b("svc_on", false) && SystemClock.uptimeMillis() - startedAt < 4000)
                  hero.running = on
                  if (on) {
                      statusTitle.text = "LISA IS AWAKE"; statusTitle.setTextColor(Pal.GREEN)
                      statusSub.text = "Listening in the background. Close the app, she keeps running."
                  } else {
                      statusTitle.text = "LISA IS ASLEEP"; statusTitle.setTextColor(Pal.PINK)
                      statusSub.text = "Tap the play button to wake her up."
                  }
                  refreshers.forEach { it() }
              }

              private val tick = object : Runnable {
                  override fun run() { refreshAll(); ui.postDelayed(this, 1000) }
              }

              private val sensorL = object : SensorEventListener {
                  override fun onSensorChanged(e: SensorEvent) {
                      val tx = (-e.values[0] / 9.8f).coerceIn(-1f, 1f)
                      val ty = (e.values[2] / 9.8f - 0.35f).coerceIn(-1f, 1f)
                      sx += (tx - sx) * 0.1f
                      sy += (ty - sy) * 0.1f
                      aurora.tx = sx; aurora.ty = sy
                      hero.tx = sx; hero.ty = sy
                  }
                  override fun onAccuracyChanged(s: Sensor?, a: Int) {}
              }


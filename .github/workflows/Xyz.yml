          class LisaAccessibility : AccessibilityService() {
              companion object { var inst: LisaAccessibility? = null }

              private val beat = Handler(Looper.getMainLooper())
              private val pulse = object : Runnable {
                  override fun run() {
                      try { AccGuard.heal(this@LisaAccessibility); LisaService.tryStart(this@LisaAccessibility) } catch (e: Exception) { }
                      beat.postDelayed(this, 30000)
                  }
              }

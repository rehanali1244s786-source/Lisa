          private class CalcParser(val s: String) {
              var i = 0
              fun ws() { while (i < s.length && s[i] == ' ') i++ }
              fun expr(): Double {
                  var v = term()
                  while (true) { ws(); if (i < s.length && (s[i] == '+' || s[i] == '-')) { val o = s[i++]; val r = term(); v = if (o == '+') v + r else v - r } else return v }
              }

          import java.net.URL

          private const val MATCH = -1
          private const val WRAP = -2

          /** Lisa's home screen: 3D hero with play button, glass setting cards (locked until you press Edit), setup status. */
          class MainActivity : Activity() {
              private val dn by lazy { resources.displayMetrics.density }
              private fun dp(v: Int) = (v * dn).toInt()
              private val ui = Handler(Looper.getMainLooper())
              private val sm by lazy { getSystemService(SENSOR_SERVICE) as SensorManager }

              private lateinit var aurora: AuroraView
              private lateinit var hero: HeroView
              private lateinit var statusTitle: TextView
              private lateinit var statusSub: TextView
              private lateinit var col: LinearLayout
              private val cards = mutableListOf<GlassCard>()
              private val refreshers = mutableListOf<() -> Unit>()
              private var startedAt = 0L
              private var sx = 0f
              private var sy = 0f

              private lateinit var fName: EditText
              private lateinit var fPet: EditText
              private lateinit var fCity: EditText
              private lateinit var fKey: EditText
              private lateinit var fModel: EditText
              private lateinit var fGroqKey: EditText
              private lateinit var fPersona: EditText
              private lateinit var fGroqModel: EditText
              private var provider = "gemini"
              private lateinit var pGemini: TextView
              private lateinit var pGroq: TextView
              private lateinit var tAlways: ToggleView
              private lateinit var tAuto: ToggleView
              private lateinit var testStatus: TextView

              private lateinit var apiSec: Section
              private lateinit var apiBox: LinearLayout
              private lateinit var apiEmpty: TextView
              private lateinit var addApiBtn: TextView
              private val apiRows = mutableListOf<Triple<EditText, EditText, EditText>>()
              private val rowFx = mutableListOf<(Boolean) -> Unit>()

              // ---------- small view helpers ----------
              private fun tv(text: String, size: Float, color: Int = Color.WHITE, bold: Boolean = false): TextView = TextView(this).apply {
                  this.text = text
                  setTextSize(TypedValue.COMPLEX_UNIT_SP, size)
                  setTextColor(color)
                  if (bold) typeface = Typeface.DEFAULT_BOLD
              }

              private fun lp(w: Int = MATCH, h: Int = WRAP, top: Int = 0, bottom: Int = 0) =
                  LinearLayout.LayoutParams(w, h).apply { topMargin = dp(top); bottomMargin = dp(bottom) }

              private fun bounce(v: View) {
                  v.setOnTouchListener { x, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> x.animate().scaleX(0.93f).scaleY(0.93f).setDuration(90).start()
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> x.animate().scaleX(1f).scaleY(1f).setDuration(160).start()
                      }
                      false
                  }
              }

              private fun pill(text: String, filled: Boolean = true): TextView = tv(text, 13f, Color.WHITE, true).apply {
                  gravity = Gravity.CENTER
                  setPadding(dp(14), dp(7), dp(14), dp(7))
                  background = if (filled) GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT, intArrayOf(Pal.PINK, Pal.VIOLET)).apply { cornerRadius = dp(20).toFloat() }
                  else glass(20f, dn, 0x22FFFFFF, 0x55FFFFFF)
                  isClickable = true
                  bounce(this)
              }

              private fun input(hint: String, secret: Boolean = false): EditText = EditText(this).apply {
                  this.hint = hint
                  textSize = 16f
                  setTextColor(Color.WHITE)
                  setHintTextColor(0x66FFFFFF)
                  setPadding(dp(14), dp(12), dp(14), dp(12))
                  inputType = if (secret) InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD else InputType.TYPE_CLASS_TEXT
                  setSingleLine(true)
              }

              private fun styleInput(e: EditText, editing: Boolean) {
                  e.isEnabled = editing
                  e.background = if (editing) glass(14f, dn, 0x26FFFFFF, 0x66FF5FA2) else glass(14f, dn, 0x0FFFFFFF, 0x14FFFFFF)
                  e.alpha = if (editing) 1f else 0.85f
              }

              private fun toggleRow(parent: LinearLayout, label: String, value: Boolean, top: Int = 14): ToggleView {
                  val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL }
                  row.addView(tv(label, 14.5f), LinearLayout.LayoutParams(0, WRAP, 1f).apply { rightMargin = dp(12) })
                  val t = ToggleView(this)
                  t.setNow(value)
                  row.addView(t)
                  parent.addView(row, lp(top = top))
                  return t
              }

              private fun toast(t: String) = Toast.makeText(this, t, Toast.LENGTH_SHORT).show()

              private fun hideKeyboard() {
                  val im = getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager
                  currentFocus?.let { im.hideSoftInputFromWindow(it.windowToken, 0) }
              }

              // ---------- a glass card with its own Edit / Save / Cancel ----------
              private inner class Section(title: String, emoji: String, val editable: Boolean = true, val onSave: () -> Unit = {}, val onReload: () -> Unit = {}) {
                  val card = GlassCard(this@MainActivity)
                  val body = LinearLayout(this@MainActivity).apply { orientation = LinearLayout.VERTICAL }
                  private val appliers = mutableListOf<(Boolean) -> Unit>()
                  private val actionBtn = pill("\u270E  Edit")
                  private val cancelBtn = pill("\u2715", false)
                  var editing = false
                      private set

                  init {
                      val head = LinearLayout(this@MainActivity).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL }
                      head.addView(tv("$emoji  $title", 19f, Color.WHITE, true), LinearLayout.LayoutParams(0, WRAP, 1f))
                      cancelBtn.visibility = View.GONE
                      head.addView(cancelBtn, LinearLayout.LayoutParams(WRAP, WRAP).apply { rightMargin = dp(8) })
                      if (editable) head.addView(actionBtn)
                      card.addView(head)
                      card.addView(body)
                      actionBtn.setOnClickListener {
                          if (editing) { onSave(); setEditing(false); toast("Saved \u2713") } else setEditing(true)
                      }
                      cancelBtn.setOnClickListener { onReload(); setEditing(false) }
                  }

                  fun reg(f: (Boolean) -> Unit) { appliers.add(f); f(editing) }

                  fun setEditing(on: Boolean) {
                      editing = on
                      actionBtn.text = if (on) "\u2713  Save" else "\u270E  Edit"
                      cancelBtn.visibility = if (on) View.VISIBLE else View.GONE
                      appliers.forEach { it(on) }
                      if (!on) hideKeyboard()
                  }

                  fun field(label: String, hint: String, value: String, secret: Boolean = false): EditText {
                      body.addView(tv(label, 12.5f, Pal.MUTED), lp(top = 12, bottom = 5))
                      val e = input(hint, secret)
                      e.setText(value)
                      if (secret) {
                          val row = LinearLayout(this@MainActivity).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL }
                          row.addView(e, LinearLayout.LayoutParams(0, WRAP, 1f))
                          val eye = tv("\uD83D\uDC41\uFE0F", 18f).apply { setPadding(dp(12), dp(8), dp(4), dp(8)); alpha = 0.85f }
                          var shown = false
                          eye.setOnClickListener {
                              shown = !shown
                              val sel = e.selectionStart
                              e.inputType = if (shown) InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_VISIBLE_PASSWORD
                              else InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                              if (sel >= 0) e.setSelection(sel)
                          }
                          row.addView(eye)
                          body.addView(row, lp())
                          reg { on ->
                              eye.visibility = if (on) View.VISIBLE else View.GONE
                              if (!on && shown) {
                                  shown = false
                                  e.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                              }
                          }
                      } else body.addView(e, lp())
                      reg { on -> styleInput(e, on) }
                      return e
                  }

                  fun toggle(label: String, value: Boolean): ToggleView {
                      val t = toggleRow(body, label, value)
                      reg { on -> t.isEnabled = on }
                      return t
                  }
              }

              // ---------- extra APIs ----------
              private fun refreshApiEmpty() {
                  apiEmpty.visibility = if (apiRows.isEmpty()) View.VISIBLE else View.GONE
                  apiEmpty.text = if (apiSec.editing) "No extra APIs yet. Tap + Add API." else "No extra APIs yet. Tap Edit to add one."
              }

              private fun addApiRow(name: String, url: String, key: String) {
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = glass(16f, dn, 0x14FFFFFF, 0x22FFFFFF)
                      setPadding(dp(12), dp(8), dp(12), dp(12))
                  }
                  val head = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL }
                  head.addView(tv("API", 12.5f, Pal.MUTED), LinearLayout.LayoutParams(0, WRAP, 1f))
                  val del = tv("\u2715  Remove", 12.5f, Pal.PINK, true).apply { setPadding(dp(8), dp(6), dp(4), dp(6)) }
                  head.addView(del)
                  box.addView(head)
                  val n = input("API name (e.g. weather)"); n.setText(name)
                  val u = input("URL, use {key} and {q} if needed"); u.setText(url)
                  val k = input("API key", true); k.setText(key)
                  for (e in listOf(n, u, k)) box.addView(e, lp(top = 6))
                  apiBox.addView(box, lp(top = 10))
                  val row = Triple(n, u, k)
                  apiRows.add(row)
                  del.setOnClickListener { apiBox.removeView(box); apiRows.remove(row); refreshApiEmpty() }
                  val fx: (Boolean) -> Unit = { on ->
                      for (e in listOf(n, u, k)) styleInput(e, on)
                      del.visibility = if (on) View.VISIBLE else View.GONE
                  }
                  rowFx.add(fx)
                  fx(apiSec.editing)
                  refreshApiEmpty()
              }

              private fun loadApis() {
                  apiBox.removeAllViews(); apiRows.clear(); rowFx.clear()
                  val saved = try { JSONArray(Cfg.s("apis", "[]")) } catch (e: Exception) { JSONArray() }
                  for (i in 0 until saved.length()) saved.getJSONObject(i).let { addApiRow(it.optString("name"), it.optString("url"), it.optString("key")) }
                  refreshApiEmpty()
              }

              private fun saveApis() {
                  val arr = JSONArray()
                  for ((n, u, k) in apiRows) if (n.text.isNotBlank() && u.text.isNotBlank())
                      arr.put(JSONObject().put("name", n.text.toString().trim()).put("url", u.text.toString().trim()).put("key", k.text.toString().trim()))
                  Cfg.put("apis", arr.toString())
                  loadApis()
              }

              // ---------- setup rows ----------
              private fun stepRow(sec: Section, title: String, sub: String, btn: String, done: (() -> Boolean)?, click: () -> Unit) {
                  val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL; setPadding(0, dp(10), 0, dp(10)) }
                  val dot = tv("\u25CB", 20f, Pal.MUTED, true).apply { gravity = Gravity.CENTER }
                  row.addView(dot, LinearLayout.LayoutParams(dp(30), WRAP))
                  val txt = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  txt.addView(tv(title, 14.5f, Color.WHITE, true))
                  txt.addView(tv(sub, 12f, Pal.MUTED))
                  row.addView(txt, LinearLayout.LayoutParams(0, WRAP, 1f).apply { leftMargin = dp(6); rightMargin = dp(8) })
                  val b = pill(btn)
                  b.setOnClickListener { click() }
                  row.addView(b)
                  sec.body.addView(row, lp(top = 4))
                  sec.body.addView(View(this).apply { setBackgroundColor(0x14FFFFFF) }, LinearLayout.LayoutParams(MATCH, 1))
                  refreshers.add {
                      val ok = done?.invoke()
                      if (ok == null) { dot.text = "\u24D8"; dot.setTextColor(Pal.MUTED); b.alpha = 1f }
                      else if (ok) { dot.text = "\u2714"; dot.setTextColor(Pal.GREEN); b.alpha = 0.55f }
                      else { dot.text = "\u25CB"; dot.setTextColor(Pal.PINK); b.alpha = 1f }
                  }
              }

              private fun granted(p: String) = checkSelfPermission(p) == PackageManager.PERMISSION_GRANTED

              private fun allPerms() = granted(Manifest.permission.RECORD_AUDIO) && granted(Manifest.permission.CALL_PHONE) &&
                  granted(Manifest.permission.SEND_SMS) && granted(Manifest.permission.READ_CONTACTS)

              private fun askPerms() = requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO, Manifest.permission.CALL_PHONE, Manifest.permission.SEND_SMS,
                  Manifest.permission.READ_CONTACTS, Manifest.permission.POST_NOTIFICATIONS), 1)

              private fun openAutoStart() {
                  val tries = listOf(
                      "com.coloros.safecenter" to "com.coloros.safecenter.permission.startup.StartupAppListActivity",
                      "com.coloros.safecenter" to "com.coloros.safecenter.startupapp.StartupAppListActivity",
                      "com.oppo.safe" to "com.oppo.safe.permission.startup.StartupAppListActivity",
                      "com.oplus.battery" to "com.oplus.powermanager.fuelgauge.PowerConsumptionActivity",
                      "com.miui.securitycenter" to "com.miui.permcenter.autostart.AutoStartManagementActivity",
                      "com.vivo.permissionmanager" to "com.vivo.permissionmanager.activity.BgStartUpManagerActivity",
                      "com.iqoo.secure" to "com.iqoo.secure.ui.phoneoptimize.AddWhiteListActivity",
                      "com.huawei.systemmanager" to "com.huawei.systemmanager.startupmgr.ui.StartupNormalAppListActivity",
                      "com.samsung.android.lool" to "com.samsung.android.sm.ui.battery.BatteryActivity"
                  )
                  for ((pkg, cls) in tries) {
                      try {
                          startActivity(Intent().setComponent(ComponentName(pkg, cls)).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                          toast("Allow Lisa: Auto-start and Background activity")
                          return
                      } catch (e: Exception) { }
                  }
                  startActivity(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:$packageName")))
                  toast("Open Battery / Auto-start and allow Lisa to run in background")
              }

              private fun showAdbDialog() {
                  val cmd = "adb shell pm grant $packageName android.permission.WRITE_SECURE_SETTINGS"
                  AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                      .setTitle("Lock Accessibility ON")
                      .setMessage("One time only. Connect the phone to a PC (USB debugging on) and run:\n\n$cmd\n\nAfter that, if the phone ever switches Accessibility off, Lisa switches it back on by herself. Use the toggle in this card when you want it off.")
                      .setPositiveButton("Copy command") { _, _ ->
                          (getSystemService(CLIPBOARD_SERVICE) as ClipboardManager).setPrimaryClip(ClipData.newPlainText("adb", cmd))

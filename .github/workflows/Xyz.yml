              private fun easeOutBack(x: Float): Float { val c1 = 1.70158f; val c3 = c1 + 1f; val p = x.coerceIn(0f, 1f) - 1f; return 1f + c3 * p * p * p + c1 * p * p }
              private fun easeInOutSine(x: Float): Float = -(cos(PI.toFloat() * x.coerceIn(0f, 1f)) - 1f) / 2f

              override fun onDraw(c: Canvas) {
                  val now = SystemClock.uptimeMillis()
                  if (startMs == 0L) startMs = now
                  val el = now - startMs
                  val t = (el.toFloat() / durationMs).coerceIn(0f, 1f)
                  val sec = el / 1000f
                  val w = width.toFloat(); val h = height.toFloat()

                  c.drawRect(0f, 0f, w, h, bgPaint)
                  drawStars(c, w, h, sec)
                  // pulsing glow and floor glow under the logo
                  val pulse = 0.9f + 0.1f * sin(sec * 4f)
                  c.save(); c.scale(pulse, pulse, cx, logoCy); glowPaint.alpha = (255f * smooth(t / 0.2f)).toInt(); c.drawCircle(cx, logoCy, tile * 1.7f, glowPaint); c.restore()
                  c.save(); c.translate(cx, logoCy + tile * 0.78f); c.scale(1f, 0.18f); floorPaint.alpha = (255f * smooth(t / 0.3f)).toInt(); c.drawCircle(0f, 0f, tile * 0.8f, floorPaint); c.restore()

                  drawFloaters(c, w, h, sec, false)
                  drawShockwave(c, t)
                  drawOrbits(c, sec, t, false)
                  drawLogo(c, t, sec)
                  drawOrbits(c, sec, t, true)
                  drawSparkles(c, t)
                  drawTitle(c, t, sec)
                  drawFloaters(c, w, h, sec, true)
                  drawLoading(c, t, sec)
                  drawCredit(c, t)

                  if (t >= 1f) {
                      if (!done) { done = true; post { onDone?.invoke() } }
                  } else postInvalidateOnAnimation()
              }

              private fun drawStars(c: Canvas, w: Float, h: Float, sec: Float) {
                  for (s in stars) {
                      starPaint.alpha = (255f * (0.15f + 0.6f * kotlin.math.abs(sin(sec * 2.2f + s.phase)))).toInt()
                      c.drawCircle(s.x * w, s.y * h, dp(s.r), starPaint)
                  }
              }

              private fun drawFloaters(c: Canvas, w: Float, h: Float, sec: Float, near: Boolean) {
                  for (f in floaters) {
                      if ((f.depth > 1.1f) != near) continue
                      val p = (f.phase + sec * 0.55f * f.speed) % 1f
                      val a = sin(PI.toFloat() * p).coerceIn(0f, 1f) * (if (near) 0.6f else 0.9f)
                      if (a <= 0.02f) continue
                      val y = h * (1.08f - 1.2f * p)
                      val x = w * f.xFrac + sin(TAU * p * 1.5f + f.phase * TAU) * dp(16f) * f.depth
                      emojiPaint.textSize = f.size; emojiPaint.alpha = (a * 255f).toInt()
                      c.save(); c.rotate(sin(sec * 2.2f + f.phase * TAU) * 14f, x, y)
                      c.drawText(f.emoji, x, y - (emojiPaint.ascent() + emojiPaint.descent()) / 2f, emojiPaint)
                      c.restore()
                  }
              }

              private fun drawShockwave(c: Canvas, t: Float) {
                  val u = (t - 0.40f) / 0.25f
                  if (u <= 0f || u >= 1f) return
                  ringPaint.strokeWidth = dp(3f) * sc * (1f - u); ringPaint.alpha = (180f * (1f - u)).toInt()
                  c.drawCircle(cx, logoCy, tile * (0.6f + 1.3f * easeOutCubic(u)), ringPaint)
              }

              /** Comets on three tilted orbits with real depth: far half drawn behind the logo, near half in front. */
              private fun drawOrbits(c: Canvas, sec: Float, t: Float, front: Boolean) {
                  val appear = smooth((t - 0.12f) / 0.25f)
                  if (appear <= 0f) return
                  for (o in orbits) {
                      val r = tile * o.radius * appear
                      val ct = cos(o.tilt); val st = sin(o.tilt); val cr = cos(o.roll); val sr = sin(o.roll)
                      for (k in 0 until o.comets) {
                          val base = sec * o.speed + k * TAU / o.comets
                          for (j in 0 until TRAIL) {
                              val th = base - j * 0.17f * sign(o.speed)
                              val x = r * cos(th); val zz = r * sin(th)
                              val y1 = zz * st; val z1 = zz * ct
                              if ((z1 >= 0f) != front) continue
                              val x2 = x * cr - y1 * sr; val y2 = x * sr + y1 * cr
                              val s = (r * 4f) / (r * 4f - z1)
                              val fade = 1f - j / TRAIL.toFloat()
                              val depthA = 0.45f + 0.55f * (z1 / r + 1f) / 2f
                              orbitPaint.color = o.color
                              orbitPaint.alpha = (255f * fade * depthA * appear).toInt().coerceIn(0, 255)
                              c.drawCircle(cx + x2 * s, logoCy + y2 * s, dp(4.2f) * sc * fade.coerceAtLeast(0.35f) * s, orbitPaint)
                          }
                      }
                  }
              }

              private fun drawLogo(c: Canvas, t: Float, sec: Float) {
                  val u = (t / 0.42f).coerceIn(0f, 1f)
                  val e = easeOutBack(u)
                  val idle = smooth((t - 0.40f) / 0.15f)
                  val rotY = (1f - e) * -300f + idle * 14f * sin(sec * 3.2f)
                  val rotX = idle * 9f * sin(sec * 2.4f + 1f)
                  val scale = (0.15f + 0.85f * e) * (1f + 0.03f * idle * sin(sec * 5f))
                  cam.save(); cam.rotateY(rotY); cam.rotateX(rotX); cam.getMatrix(camM); cam.restore()
                  camM.preTranslate(-cx, -logoCy); camM.postTranslate(cx, logoCy)
                  c.save(); c.concat(camM); c.scale(scale, scale, cx, logoCy)
                  val rad = tile * 0.24f
                  c.drawRoundRect(tileRect, rad, rad, tilePaint)
                  c.drawRoundRect(tileRect, rad, rad, glossPaint)
                  logoFg?.draw(c)
                  val sp = (t - 0.50f) / 0.35f
                  if (sp in 0f..1f) {
                      c.save(); c.clipPath(tilePath)
                      c.translate(cx - tile * 0.9f + sp * tile * 1.8f, logoCy); c.rotate(20f)
                      c.drawRect(-shineW / 2f, -tile, shineW / 2f, tile, shinePaint)
                      c.restore()
                  }
                  c.restore()
              }

              private fun drawSparkles(c: Canvas, t: Float) {
                  val u = (t - 0.40f) / 0.30f
                  if (u <= 0f || u >= 1f) return
                  val n = 14
                  for (k in 0 until n) {
                      val a = TAU * k / n + 0.3f
                      val d = tile * (0.55f + 0.95f * easeOutCubic(u))
                      sparkPaint.color = if (k % 2 == 0) Color.parseColor("#FF8FC4") else Color.WHITE
                      sparkPaint.alpha = (255f * (1f - u)).toInt()
                      c.drawCircle(cx + cos(a) * d, logoCy + sin(a) * d, dp(3.2f) * sc * (1f - u * 0.6f), sparkPaint)
                  }
              }

              /** "Lisa" pops in letter by letter with a 3D extrusion, then a white shimmer band runs across it. */
              private fun drawTitle(c: Canvas, t: Float, sec: Float) {
                  val s = "Lisa"; val gap = dp(3f) * sc; val ext = dp(1.2f) * sc
                  var total = -gap
                  for (ch in s) total += titlePaint.measureText(ch.toString()) + gap
                  val left = cx - total / 2f
                  fun pass(paint: Paint, extrude: Boolean) {
                      var x = left
                      for ((i, ch) in s.withIndex()) {
                          val str = ch.toString(); val wch = paint.measureText(str)
                          val p = ((t - 0.28f - i * 0.05f) / 0.16f).coerceIn(0f, 1f)
                          if (p > 0f) {
                              val e = easeOutBack(p)
                              c.save(); c.translate(x + wch / 2f, titleY + (1f - p) * dp(28f) * sc); c.scale(e, e)
                              if (extrude) {
                                  extrudePaint.alpha = (255f * p).toInt()
                                  for (d in 3 downTo 1) c.drawText(str, -wch / 2f + d * ext, d * ext, extrudePaint)
                              }
                              paint.alpha = (255f * p).toInt()
                              c.drawText(str, -wch / 2f, 0f, paint)
                              c.restore()
                          }
                          x += wch + gap
                      }
                  }
                  pass(titlePaint, true)
                  val sh = (t - 0.60f) / 0.30f
                  if (sh in 0f..1f) {
                      val bx = left - dp(40f) + sh * (total + dp(80f))
                      c.save(); c.clipRect(bx, titleY - titlePaint.textSize, bx + dp(34f) * sc, titleY + dp(14f) * sc)
                      pass(shimmerPaint, false)
                      c.restore()
                  }
                  val ta = smooth((t - 0.45f) / 0.15f)
                  if (ta > 0f) { tagPaint.alpha = (255f * ta).toInt(); c.drawText("Your personal voice assistant", cx, tagY + (1f - ta) * dp(10f), tagPaint) }
              }

              private fun drawLoading(c: Canvas, t: Float, sec: Float) {
                  val prog = easeInOutSine(t)
                  val label = when { t < 0.34f -> "Waking up Lisa\u2026"; t < 0.67f -> "Tuning my voice\u2026"; else -> "Almost ready\u2026" }
                  labelPaint.alpha = (255f * (0.75f + 0.25f * sin(sec * 8f))).toInt()
                  c.drawText(label, cx, labelY, labelPaint)
                  c.drawRoundRect(barRect, barH / 2f, barH / 2f, trackPaint)
                  c.save(); c.clipRect(barL, barRect.top, barL + barW * prog, barRect.bottom)
                  c.drawRoundRect(barRect, barH / 2f, barH / 2f, fillPaint)
                  c.restore()
                  if (prog > 0.01f && prog < 0.995f) { c.save(); c.translate(barL + barW * prog, barCy); c.drawCircle(0f, 0f, dp(16f) * sc, headPaint); c.restore() }
                  c.drawText("${(prog * 100f).toInt()}%", cx, pctY, pctPaint)
              }

              private fun drawCredit(c: Canvas, t: Float) {
                  val a = smooth((t - 0.08f) / 0.20f)
                  if (a <= 0f) return
                  val lead = "Developed by "; val name = "Abdul Rahman"
                  val wl = creditLight.measureText(lead); val wn = creditBold.measureText(name)
                  val x = cx - (wl + wn) / 2f; val y = creditY + (1f - a) * dp(14f)
                  creditLight.alpha = (255f * a).toInt(); creditBold.alpha = (255f * a).toInt()
                  c.drawText(lead, x, y, creditLight)
                  c.drawText(name, x + wl, y, creditBold)
              }
          }
          LISA_EOF_9X
          mkdir -p 'app/src/main/java/com/lisa/assistant'
          cat > 'app/src/main/java/com/lisa/assistant/BootReceiver.kt' <<'LISA_EOF_9X'
          package com.lisa.assistant

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          /** After a restart or an app update: bring Lisa back if the user had left her switched on. */
          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent) { AccGuard.heal(c); LisaService.tryStart(c) }
          }
          LISA_EOF_9X
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: lisa-apk, path: app/build/outputs/apk/debug/app-debug.apk }

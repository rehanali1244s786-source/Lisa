              override fun onResume() {
                  super.onResume()
                  AccGuard.heal(this)
                  ui.post(tick)
                  sm.getDefaultSensor(Sensor.TYPE_ACCELEROMETER)?.let { sm.registerListener(sensorL, it, SensorManager.SENSOR_DELAY_GAME) }
              }

              override fun onPause() {
                  ui.removeCallbacks(tick)
                  sm.unregisterListener(sensorL)
                  super.onPause()
              }
